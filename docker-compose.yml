# Compose-local stack: production-built images with dev env overlays (not identical to Fly prod).
# Backend: run `npm run docker:build:backend` (prunes dist/) before first build.
services:
  # Backend API Service (NestJS)
  backend:
    build:
      context: apps/backend
      dockerfile: Dockerfile
    container_name: oneohm-epc-backend-dev
    env_file:
      - ./apps/backend/.env
    environment:
      - NODE_ENV=development
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
    ports:
      - '${BACKEND_PORT:-8085}:${BACKEND_PORT:-8085}'
    depends_on:
      postgres:
        condition: service_healthy
      # redis:
      #   condition: service_healthy
    restart: unless-stopped
    networks:
      - oneohm-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:8085/api/v1', (r) => { process.exit(r.statusCode >= 200 && r.statusCode < 400 ? 0 : 1); }).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # Web Application Service (Next.js)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://backend:8085/api/v1
        NEXT_PUBLIC_APP_NAME: OneOhm EPC
    container_name: oneohm-epc-web-dev
    env_file:
      - ./apps/web/.env.local
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://backend:8085/api/v1
    ports:
      - '${PORT:-3001}:${PORT:-3001}'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - oneohm-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3001/api/health', (r) => { process.exit(r.statusCode >= 200 && r.statusCode < 400 ? 0 : 1); }).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: postgres-15-container
    environment:
      POSTGRES_USER: oneohm
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oneohm_epc
    ports:
      - '5436:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - oneohm-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oneohm']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache (Optional - Uncomment to enable)
  # redis:
  #   image: redis:7-alpine
  #   container_name: oneohm-epc-redis
  #   ports:
  #     - '6379:6379'
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - oneohm-network
  #   healthcheck:
  #     test: ['CMD', 'redis-cli', 'ping']
  #     interval: 10s
  #     timeout: 3s
  #     retries: 5
  #   restart: unless-stopped
  #   command: redis-server --appendonly yes

networks:
  oneohm-network:
    driver: bridge
    name: oneohm-network

volumes:
  postgres_data:
    name: oneohm-epc-postgres-data
  # redis_data:
  #   name: oneohm-epc-redis-data

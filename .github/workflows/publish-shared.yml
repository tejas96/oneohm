name: Publish Shared Package

on:
  push:
    branches: [main]
    paths:
      - 'libs/shared/src/**'
      - 'libs/shared/package.json'
      - 'libs/shared/tsup.config.ts'

  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  NODE_VERSION: '20'

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tejas96'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Build shared package
        run: npx nx build shared

      - name: Auto-bump patch version if already published
        id: version-bump
        working-directory: libs/shared
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "${PACKAGE_NAME}@${CURRENT_VERSION}" version 2>/dev/null || echo "")

          if [ "$PUBLISHED" = "$CURRENT_VERSION" ]; then
            # Version already published — auto-bump patch
            NEW_VERSION=$(node -p "
              const [maj, min, pat] = '${CURRENT_VERSION}'.split('.').map(Number);
              \`\${maj}.\${min}.\${pat + 1}\`
            ")
            echo "Bumping ${CURRENT_VERSION} -> ${NEW_VERSION}"
            npm version "$NEW_VERSION" --no-git-tag-version
            echo "bumped=true" >> $GITHUB_OUTPUT
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          else
            echo "bumped=false" >> $GITHUB_OUTPUT
            echo "new_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            echo "Version ${CURRENT_VERSION} not yet published, publishing as-is"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Commit bumped version back to main
        if: steps.version-bump.outputs.bumped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add libs/shared/package.json
          git commit -m "chore(shared): auto-bump version to ${{ steps.version-bump.outputs.new_version }} [skip ci]"
          git push

      - name: Publish to GitHub Packages
        working-directory: libs/shared
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Generate Summary
        if: always()
        run: |
          VERSION=$(node -p "require('./libs/shared/package.json').version")
          echo "## Shared Package" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.version-bump.outputs.bumped }}" == "true" ]; then
            echo "✅ Auto-bumped and published @tejas96/shared@${VERSION}" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Published @tejas96/shared@${VERSION}" >> $GITHUB_STEP_SUMMARY
          fi

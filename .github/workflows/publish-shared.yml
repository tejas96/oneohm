name: Publish Shared Package

on:
  push:
    branches: [main]
    paths:
      - 'libs/shared/src/**'
      - 'libs/shared/package.json'
      - 'libs/shared/tsup.config.ts'

  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  NODE_VERSION: '20'

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tejas96'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Build shared package
        run: npx nx build shared

      - name: Check if version already published
        id: version-check
        working-directory: libs/shared
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          # Try to fetch the specific version — exit code 0 means already published
          if npm view "${PACKAGE_NAME}@${CURRENT_VERSION}" version \
               --registry https://npm.pkg.github.com 2>/dev/null | grep -q "^${CURRENT_VERSION}$"; then
            echo "already_published=true" >> $GITHUB_OUTPUT
            echo "Version ${CURRENT_VERSION} is already published"
          else
            echo "already_published=false" >> $GITHUB_OUTPUT
            echo "Version ${CURRENT_VERSION} is not yet published"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Auto-bump patch version when already published
        id: version-bump
        if: steps.version-check.outputs.already_published == 'true'
        working-directory: libs/shared
        run: |
          CURRENT_VERSION="${{ steps.version-check.outputs.current_version }}"
          NEW_VERSION=$(node -p "
            const [maj, min, pat] = '${CURRENT_VERSION}'.split('.').map(Number);
            \`\${maj}.\${min}.\${pat + 1}\`
          ")
          echo "Auto-bumping ${CURRENT_VERSION} -> ${NEW_VERSION}"
          npm version "$NEW_VERSION" --no-git-tag-version
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit auto-bumped version back to main
        if: steps.version-check.outputs.already_published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add libs/shared/package.json
          git commit -m "chore(shared): auto-bump version to ${{ steps.version-bump.outputs.new_version }} [skip ci]"
          git push

      - name: Publish to GitHub Packages
        working-directory: libs/shared
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Generate Summary
        if: always()
        run: |
          VERSION=$(node -p "require('./libs/shared/package.json').version")
          if [ "${{ steps.version-check.outputs.already_published }}" == "true" ]; then
            echo "## Shared Package" >> $GITHUB_STEP_SUMMARY
            echo "✅ Auto-bumped and published @tejas96/shared@${VERSION}" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Shared Package" >> $GITHUB_STEP_SUMMARY
            echo "✅ Published @tejas96/shared@${VERSION}" >> $GITHUB_STEP_SUMMARY
          fi

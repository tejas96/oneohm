name: Publish Shared Package

on:
  push:
    branches: [main]
    paths:
      - 'libs/shared/src/**'
      - 'libs/shared/package.json'
      - 'libs/shared/tsup.config.ts'

  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  NODE_VERSION: '20'

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tejas96'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Build shared package
        run: npx nx build shared

      - name: Check if version already published
        id: version-check
        working-directory: libs/shared
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          # No explicit --registry. setup-node wrote an .npmrc mapping the
          # @tejas96 scope to GitHub Packages together with the NODE_AUTH_TOKEN
          # line; passing --registry bypasses that mapping, so `npm view`
          # answered 401. The old code sent both stderr and the exit code to
          # /dev/null, turning that 401 into an empty string and therefore into
          # "not yet published" — after which publish hit 409 Conflict. Every
          # run from 2026-07-28 onward failed this way, which is why the
          # package stopped publishing while the checks all looked green.
          set +e
          PUBLISHED_VERSION=$(npm view "${PACKAGE_NAME}@${CURRENT_VERSION}" version 2>view_err.log)
          VIEW_EXIT=$?
          set -e

          # E404 is the ONLY acceptable failure — it genuinely means "not
          # published". Anything else (401, network, registry outage) must fail
          # loudly rather than be misread as a green light to publish.
          if [ $VIEW_EXIT -ne 0 ] && ! grep -q "E404" view_err.log; then
            echo "::error::npm view failed for ${PACKAGE_NAME}@${CURRENT_VERSION}"
            cat view_err.log
            exit 1
          fi

          if [ "$PUBLISHED_VERSION" = "$CURRENT_VERSION" ]; then
            echo "already_published=true" >> $GITHUB_OUTPUT
            echo "Version ${CURRENT_VERSION} is already published"
          else
            echo "already_published=false" >> $GITHUB_OUTPUT
            echo "Version ${CURRENT_VERSION} is not yet published"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Auto-bump patch version when already published
        id: version-bump
        if: steps.version-check.outputs.already_published == 'true'
        working-directory: libs/shared
        run: |
          CURRENT_VERSION="${{ steps.version-check.outputs.current_version }}"
          NEW_VERSION=$(node -p "
            const [maj, min, pat] = '${CURRENT_VERSION}'.split('.').map(Number);
            \`\${maj}.\${min}.\${pat + 1}\`
          ")
          echo "Auto-bumping ${CURRENT_VERSION} -> ${NEW_VERSION}"
          npm version "$NEW_VERSION" --no-git-tag-version
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit auto-bumped version back to main
        if: steps.version-check.outputs.already_published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add libs/shared/package.json
          git commit -m "chore(shared): auto-bump version to ${{ steps.version-bump.outputs.new_version }} [skip ci]"
          git push

      - name: Publish to GitHub Packages
        working-directory: libs/shared
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Generate Summary
        if: always()
        run: |
          VERSION=$(node -p "require('./libs/shared/package.json').version")
          if [ "${{ steps.version-check.outputs.already_published }}" == "true" ]; then
            echo "## Shared Package" >> $GITHUB_STEP_SUMMARY
            echo "✅ Auto-bumped and published @tejas96/shared@${VERSION}" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Shared Package" >> $GITHUB_STEP_SUMMARY
            echo "✅ Published @tejas96/shared@${VERSION}" >> $GITHUB_STEP_SUMMARY
          fi

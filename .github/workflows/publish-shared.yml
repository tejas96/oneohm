name: Publish Shared Package

on:
  push:
    branches: [main]
    paths:
      - 'libs/shared/src/**'
      - 'libs/shared/package.json'
      - 'libs/shared/tsup.config.ts'

  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  NODE_VERSION: '20'

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tejas96'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Build shared package
        run: npx nx build shared

      # The registry is the only authority on what is already published.
      # The old flow asked `npm view` first and treated ANY failure as
      # "not published" — a 404 for a private package reads exactly like a
      # missing version — so every run published over an existing version
      # and died on 409. Publish first, and let a real 409 drive the bump.
      - name: Publish to GitHub Packages
        id: publish
        working-directory: libs/shared
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          set +e
          OUTPUT=$(npm publish 2>&1)
          STATUS=$?
          set -e
          printf '%s\n' "$OUTPUT"

          if [ $STATUS -eq 0 ]; then
            echo "published_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Anything other than "this version is taken" is a real failure.
          if ! printf '%s' "$OUTPUT" | grep -q 'E409'; then
            echo "::error::npm publish failed for version ${CURRENT_VERSION}"
            exit $STATUS
          fi

          NEW_VERSION=$(node -p "const v = require('./package.json').version.split('.').map(Number); [v[0], v[1], v[2] + 1].join('.')")
          echo "Version ${CURRENT_VERSION} is already published — bumping to ${NEW_VERSION}"
          npm version "$NEW_VERSION" --no-git-tag-version
          npm publish

          echo "published_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "bumped=true" >> "$GITHUB_OUTPUT"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Commit auto-bumped version back to main
        if: steps.publish.outputs.bumped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add libs/shared/package.json
          git commit -m "chore(shared): auto-bump version to ${{ steps.publish.outputs.published_version }} [skip ci]"
          git push

      - name: Generate Summary
        if: always()
        run: |
          VERSION="${{ steps.publish.outputs.published_version }}"
          echo "## Shared Package" >> $GITHUB_STEP_SUMMARY
          if [ -z "$VERSION" ]; then
            echo "❌ Failed to publish @tejas96/shared" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.publish.outputs.bumped }}" == "true" ]; then
            echo "✅ Auto-bumped and published @tejas96/shared@${VERSION}" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Published @tejas96/shared@${VERSION}" >> $GITHUB_STEP_SUMMARY
          fi

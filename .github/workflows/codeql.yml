name: CodeQL Security Scan

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Run at 00:00 UTC every Monday
    - cron: '0 0 * * 1'

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        id: codeql-analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true

      - name: Generate Security Scan Summary
        if: always()
        run: |
          echo "## 🔒 CodeQL Security Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.codeql-analysis.outcome }}" == "success" ]; then
            echo "✅ Security scan completed successfully!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Language:** ${{ matrix.language }}" >> $GITHUB_STEP_SUMMARY
            echo "**Query Suite:** security-and-quality" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🔍 **Scan Details:**" >> $GITHUB_STEP_SUMMARY
            echo "- Checked for security vulnerabilities" >> $GITHUB_STEP_SUMMARY
            echo "- Analyzed code quality issues" >> $GITHUB_STEP_SUMMARY
            echo "- Detected potential bugs and weaknesses" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📊 View detailed results in the Security tab of your repository" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.codeql-analysis.outcome }}" == "failure" ]; then
            echo "⚠️ **Code Scanning Not Enabled**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "To enable CodeQL code scanning for this repository:" >> $GITHUB_STEP_SUMMARY
            echo "1. Go to **Settings** → **Code security and analysis**" >> $GITHUB_STEP_SUMMARY
            echo "2. Enable **Code scanning**" >> $GITHUB_STEP_SUMMARY
            echo "3. Choose **Set up** → **Advanced** (or Default)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📚 [Learn more about code scanning](https://docs.github.com/en/code-security/code-scanning/introduction-to-code-scanning/about-code-scanning)" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Security scan encountered issues. Please review the logs." >> $GITHUB_STEP_SUMMARY
          fi

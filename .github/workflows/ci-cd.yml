name: CI/CD with NX

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Required permissions for nx-set-shas to access workflow runs
permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: '20'
  NX_CLOUD_DISTRIBUTED_EXECUTION: 'false'

jobs:
  setup:
    name: Setup and Cache Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cache-key: ${{ steps.cache-keys.outputs.node-modules }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate cache keys
        id: cache-keys
        run: |
          echo "node-modules=${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}" >> $GITHUB_OUTPUT

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ steps.cache-keys.outputs.node-modules }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          npm ci --prefer-offline --no-audit
        env:
          CYPRESS_INSTALL_BINARY: 0
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Cache NX
        uses: actions/cache@v5
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nx-

      - name: Generate Setup Summary
        run: |
          echo "## 🚀 Setup Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Node.js: $(node --version)" >> $GITHUB_STEP_SUMMARY
          echo "✅ NPM: $(npm --version)" >> $GITHUB_STEP_SUMMARY
          echo "✅ NX: $(npx nx --version)" >> $GITHUB_STEP_SUMMARY
          echo "✅ Cache: ${{ steps.cache-node-modules.outputs.cache-hit == 'true' && 'Hit' || 'Miss' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY

  lint:
    name: Lint
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Restore NX cache
        uses: actions/cache/restore@v5
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nx-

      - name: Set NX SHAs
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: 'main'

      - name: Check code format (Prettier)
        run: npm run format:check

      - name: Run lint on affected projects
        run: npx nx affected -t lint --parallel=3 --configuration=ci

      - name: Generate Summary
        if: always()
        run: |
          echo "## 🔍 Lint Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ Format check (Prettier) and lint completed" >> $GITHUB_STEP_SUMMARY

  typecheck:
    name: Type Check
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Restore NX cache
        uses: actions/cache/restore@v5
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nx-

      - name: Set NX SHAs
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: 'main'

      - name: Run type check on affected projects
        run: npx nx affected -t typecheck --parallel=3

      - name: Generate Summary
        if: always()
        run: |
          echo "## 🔎 Type Check Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ Type checking completed" >> $GITHUB_STEP_SUMMARY

  test:
    name: Test
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Restore NX cache
        uses: actions/cache/restore@v5
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nx-

      - name: Set NX SHAs
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: 'main'

      - name: Run tests on affected projects
        run: npx nx affected -t test --parallel=3 --configuration=ci --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        if: always()
        with:
          directory: ./coverage
          fail_ci_if_error: false

      - name: Generate Summary
        if: always()
        run: |
          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ Tests completed" >> $GITHUB_STEP_SUMMARY

  build:
    name: Build
    needs: [lint, typecheck, test, setup]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Restore NX cache
        uses: actions/cache/restore@v5
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nx-

      - name: Set NX SHAs
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: 'main'

      - name: Build affected projects
        run: npx nx affected -t build --parallel=3 --configuration=production
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NEXT_PUBLIC_API_URL: https://oneohm-epc-backend.fly.dev/api/v1
          NEXT_PUBLIC_APP_NAME: "OneOhm EPC"

      - name: Check if backend prune is needed
        id: check-prune
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          AFFECTED=$(npx nx show projects --affected --json 2>/dev/null || echo "[]")
          if echo "$AFFECTED" | grep -qE '"backend"|"shared"'; then
            echo "needed=true" >> $GITHUB_OUTPUT
            echo "✅ Backend prune needed (backend or shared affected)"
          else
            echo "needed=false" >> $GITHUB_OUTPUT
            echo "⏭️ Backend prune not needed"
          fi

      - name: Prune backend (generate pruned lockfile + workspace modules)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.check-prune.outputs.needed == 'true'
        run: npx nx run backend:prune

      - name: Upload backend dist artifact
        uses: actions/upload-artifact@v7
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: backend-dist-${{ github.sha }}
          path: apps/backend/dist
          if-no-files-found: error
          retention-days: 7

      - name: Upload web build artifact
        uses: actions/upload-artifact@v7
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: web-next-${{ github.sha }}
          path: apps/web/.next
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Generate Summary
        if: always()
        run: |
          echo "## 🔨 Build Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build completed" >> $GITHUB_STEP_SUMMARY

  deploy-backend:
    name: Deploy Backend
    needs: [build, setup]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Set NX SHAs
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: 'main'

      - name: Check if backend is affected
        id: check-backend
        run: |
          AFFECTED=$(npx nx show projects --affected --json 2>/dev/null || echo "[]")
          if echo "$AFFECTED" | grep -q '"backend"'; then
            echo "affected=true" >> $GITHUB_OUTPUT
            echo "✅ Backend is affected"
          else
            echo "affected=false" >> $GITHUB_OUTPUT
            echo "⏭️ Backend is not affected"
          fi

      - name: Download backend dist artifact
        if: steps.check-backend.outputs.affected == 'true'
        uses: actions/download-artifact@v4
        with:
          name: backend-dist-${{ github.sha }}
          path: apps/backend/dist

      - name: Validate backend artifact
        if: steps.check-backend.outputs.affected == 'true'
        run: |
          test -f apps/backend/dist/package-lock.json
          test -f apps/backend/dist/src/main.js
          echo "✅ Backend artifact validated"

      - name: Setup Fly CLI
        if: steps.check-backend.outputs.affected == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest

      - name: Deploy Backend to Fly.io
        if: steps.check-backend.outputs.affected == 'true'
        working-directory: apps/backend
        # Backend Dockerfile expects apps/backend as build context, so run
        # flyctl from apps/backend and use the local fly.toml path.
        run: flyctl deploy --config fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Generate Summary
        if: always()
        run: |
          echo "## 🚀 Backend Deployment" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-backend.outputs.affected }}" == "true" ]; then
            echo "✅ Backend deployed to Fly.io" >> $GITHUB_STEP_SUMMARY
            echo "🔗 https://oneohm-epc-backend.fly.dev" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ Backend not affected, skipped" >> $GITHUB_STEP_SUMMARY
          fi

  deploy-web:
    name: Deploy Web
    needs: [build, setup]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Set NX SHAs
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: 'main'

      - name: Check if web is affected
        id: check-web
        run: |
          AFFECTED=$(npx nx show projects --affected --json 2>/dev/null || echo "[]")
          if echo "$AFFECTED" | grep -q '"web"'; then
            echo "affected=true" >> $GITHUB_OUTPUT
            echo "✅ Web is affected"
          else
            echo "affected=false" >> $GITHUB_OUTPUT
            echo "⏭️ Web is not affected"
          fi

      - name: Download web build artifact
        if: steps.check-web.outputs.affected == 'true'
        uses: actions/download-artifact@v4
        with:
          name: web-next-${{ github.sha }}
          path: apps/web/.next

      - name: Validate web artifact
        if: steps.check-web.outputs.affected == 'true'
        run: |
          test -d apps/web/.next/standalone
          echo "✅ Web artifact validated"

      - name: Setup Fly CLI
        if: steps.check-web.outputs.affected == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest

      - name: Deploy Web to Fly.io
        if: steps.check-web.outputs.affected == 'true'
        working-directory: apps/web
        # Web runtime Dockerfile expects apps/web as build context.
        run: flyctl deploy --config fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Generate Summary
        if: always()
        run: |
          echo "## 🌐 Web Deployment" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-web.outputs.affected }}" == "true" ]; then
            echo "✅ Web deployed to Fly.io" >> $GITHUB_STEP_SUMMARY
            echo "🔗 https://oneohm-epc-web.fly.dev" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ Web not affected, skipped" >> $GITHUB_STEP_SUMMARY
          fi

  docker-verify-backend:
    name: Docker Verify (Backend)
    needs: [build, setup]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Set NX SHAs
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: 'main'

      - name: Build and prune backend for Docker
        run: |
          npx nx run backend:build --configuration=production
          npx nx run backend:prune

      - name: Validate pruned dist
        run: |
          test -f apps/backend/dist/package-lock.json
          test -f apps/backend/dist/src/main.js

      - name: Build backend Docker image
        run: docker build -t oneohm-backend-test apps/backend

      - name: Check image size
        run: |
          # Docker .Size is the uncompressed sum of all layers (~700MB+ for Node apps).
          # Runtime footprint is measured via du inside the container (/app).
          APP_BYTES=$(docker run --rm --entrypoint '' oneohm-backend-test du -sb /app | cut -f1)
          LAYER_BYTES=$(docker image inspect oneohm-backend-test --format='{{.Size}}')
          NM_BYTES=$(docker run --rm --entrypoint '' oneohm-backend-test du -sb /app/node_modules | cut -f1)
          SRC_BYTES=$(docker run --rm --entrypoint '' oneohm-backend-test du -sb /app/src | cut -f1)
          echo "App filesystem (/app): ${APP_BYTES} bytes (~$((APP_BYTES / 1048576)) MB)"
          echo "  node_modules: ${NM_BYTES} bytes (~$((NM_BYTES / 1048576)) MB)"
          echo "  src: ${SRC_BYTES} bytes (~$((SRC_BYTES / 1048576)) MB)"
          echo "Docker layer total (informational): ${LAYER_BYTES} bytes (~$((LAYER_BYTES / 1048576)) MB)"
          LIMIT=524288000
          if [ "$APP_BYTES" -gt "$LIMIT" ]; then
            echo "❌ /app exceeds 500MB limit"
            docker run --rm --entrypoint '' oneohm-backend-test du -sh /app/* 2>/dev/null || true
            exit 1
          fi
          echo "✅ App size within 500MB limit"

  docker-verify-web:
    name: Docker Verify (Web)
    needs: [build, setup]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Build web Docker image
        run: |
          docker build -f apps/web/Dockerfile . \
            --build-arg NEXT_PUBLIC_API_URL=https://oneohm-epc-backend.fly.dev/api/v1 \
            --build-arg NEXT_PUBLIC_APP_NAME="OneOhm EPC" \
            -t oneohm-web-test

name: CI/CD with NX

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup NX
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      has-affected: ${{ steps.affected.outputs.has-affected }}
      cache-key: ${{ steps.cache-keys.outputs.node-modules }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Generate cache keys
        id: cache-keys
        run: |
          echo "node-modules=${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}" >> $GITHUB_OUTPUT

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            libs/*/node_modules
          key: ${{ steps.cache-keys.outputs.node-modules }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          echo "📦 Installing dependencies..."
          npm ci --loglevel=verbose --prefer-offline --no-audit --ignore-scripts
          echo "✅ Dependencies installed"
          echo "🔧 Running postinstall scripts..."
          npm rebuild --verbose
          echo "✅ Postinstall complete"

      - name: Check affected projects
        id: affected
        run: |
          echo "has-affected=true" >> $GITHUB_OUTPUT

      - name: Generate Setup Summary
        run: |
          echo "## 🚀 NX Setup Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Node.js version: $(node --version)" >> $GITHUB_STEP_SUMMARY
          echo "✅ NPM version: $(npm --version)" >> $GITHUB_STEP_SUMMARY
          echo "✅ Dependencies installed successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  lint:
    name: Lint Affected
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            libs/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies (if cache miss)
        run: |
          if [ ! -d "node_modules" ]; then
            echo "📦 Cache miss - installing dependencies..."
            npm ci --prefer-offline --no-audit --ignore-scripts
            npm rebuild
            echo "✅ Dependencies installed"
          else
            echo "✅ Using cached dependencies"
          fi

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@v4

      - name: Run lint on affected projects
        id: lint-run
        run: |
          npx nx affected --target=lint --parallel=3 || {
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 0 ]; then
              echo "No affected projects to lint"
              exit 0
            else
              exit $EXIT_CODE
            fi
          }
          npx nx print-affected --select=projects > /tmp/affected-projects.txt || echo "none" > /tmp/affected-projects.txt

      - name: Generate Lint Summary
        if: always()
        run: |
          echo "## 🔍 Linting Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/affected-projects.txt ]; then
            echo "**Affected Projects:**" >> $GITHUB_STEP_SUMMARY
            cat /tmp/affected-projects.txt | tr ',' '\n' | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.lint-run.outcome }}" == "success" ]; then
            echo "✅ All linting checks passed successfully!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Linting failed. Please check the logs above." >> $GITHUB_STEP_SUMMARY
          fi

  test:
    name: Test Affected
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            libs/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies (if cache miss)
        run: |
          if [ ! -d "node_modules" ]; then
            echo "📦 Cache miss - installing dependencies..."
            npm ci --prefer-offline --no-audit --ignore-scripts
            npm rebuild
            echo "✅ Dependencies installed"
          else
            echo "✅ Using cached dependencies"
          fi

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@v4

      - name: Run tests on affected projects
        id: test-run
        run: |
          npx nx affected --target=test --parallel=3 --coverage || {
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 0 ]; then
              echo "No affected projects to test"
              exit 0
            else
              exit $EXIT_CODE
            fi
          }
          npx nx print-affected --select=projects > /tmp/affected-projects-test.txt || echo "none" > /tmp/affected-projects-test.txt

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          directory: ./coverage
          fail_ci_if_error: false

      - name: Generate Test Summary
        if: always()
        run: |
          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/affected-projects-test.txt ]; then
            echo "**Tested Projects:**" >> $GITHUB_STEP_SUMMARY
            cat /tmp/affected-projects-test.txt | tr ',' '\n' | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.test-run.outcome }}" == "success" ]; then
            echo "✅ All tests passed successfully!" >> $GITHUB_STEP_SUMMARY
            echo "📊 Coverage reports uploaded to Codecov" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some tests failed. Please check the logs above." >> $GITHUB_STEP_SUMMARY
          fi

  build:
    name: Build Affected
    needs: [lint, test, setup]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            libs/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies (if cache miss)
        run: |
          if [ ! -d "node_modules" ]; then
            echo "📦 Cache miss - installing dependencies..."
            npm ci --prefer-offline --no-audit --ignore-scripts
            npm rebuild
            echo "✅ Dependencies installed"
          else
            echo "✅ Using cached dependencies"
          fi

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@v4

      - name: Build affected projects
        id: build-run
        run: |
          npx nx affected --target=build --parallel=3 || {
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 0 ]; then
              echo "No affected projects to build"
              exit 0
            else
              exit $EXIT_CODE
            fi
          }
          npx nx print-affected --select=projects > /tmp/affected-projects-build.txt || echo "none" > /tmp/affected-projects-build.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dist
          path: |
            apps/*/dist
            apps/*/.next
          retention-days: 7

      - name: Generate Build Summary
        if: always()
        run: |
          echo "## 🔨 Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/affected-projects-build.txt ]; then
            echo "**Built Projects:**" >> $GITHUB_STEP_SUMMARY
            cat /tmp/affected-projects-build.txt | tr ',' '\n' | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.build-run.outcome }}" == "success" ]; then
            echo "✅ All projects built successfully!" >> $GITHUB_STEP_SUMMARY
            echo "📦 Build artifacts uploaded (7 days retention)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build failed. Please check the logs above." >> $GITHUB_STEP_SUMMARY
          fi

  deploy-backend:
    name: Deploy Backend
    needs: [build, setup]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            libs/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies (if cache miss)
        run: |
          if [ ! -d "node_modules" ]; then
            echo "📦 Cache miss - installing dependencies..."
            npm ci --prefer-offline --no-audit --ignore-scripts
            npm rebuild
            echo "✅ Dependencies installed"
          else
            echo "✅ Using cached dependencies"
          fi

      - name: Derive appropriate SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Check if backend is affected
        id: check-backend
        run: |
          if npx nx print-affected --select=projects | grep -q "backend"; then
            echo "affected=true" >> $GITHUB_OUTPUT
          else
            echo "affected=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Backend Docker Image
        if: steps.check-backend.outputs.affected == 'true'
        working-directory: ./apps/backend
        run: docker build -t oneohm-epc-backend:latest .

      - name: Deploy Backend
        if: steps.check-backend.outputs.affected == 'true'
        run: echo "Add your backend deployment steps here"

      - name: Generate Backend Deployment Summary
        if: always()
        run: |
          echo "## 🚀 Backend Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-backend.outputs.affected }}" == "true" ]; then
            echo "✅ Backend was affected by changes" >> $GITHUB_STEP_SUMMARY
            echo "🐳 Docker image built successfully" >> $GITHUB_STEP_SUMMARY
            echo "📦 Deployment initiated" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Environment:** Production" >> $GITHUB_STEP_SUMMARY
            echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ Backend was not affected, skipping deployment" >> $GITHUB_STEP_SUMMARY
          fi

  deploy-web:
    name: Deploy Web
    needs: [build, setup]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            libs/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies (if cache miss)
        run: |
          if [ ! -d "node_modules" ]; then
            echo "📦 Cache miss - installing dependencies..."
            npm ci --prefer-offline --no-audit --ignore-scripts
            npm rebuild
            echo "✅ Dependencies installed"
          else
            echo "✅ Using cached dependencies"
          fi

      - name: Derive appropriate SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Check if web is affected
        id: check-web
        run: |
          if npx nx print-affected --select=projects | grep -q "web"; then
            echo "affected=true" >> $GITHUB_OUTPUT
          else
            echo "affected=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Web Application
        if: steps.check-web.outputs.affected == 'true'
        run: npx nx build web

      - name: Deploy Web
        if: steps.check-web.outputs.affected == 'true'
        run: echo "Add your web deployment steps here (Vercel, Netlify, etc.)"

      - name: Generate Web Deployment Summary
        if: always()
        run: |
          echo "## 🌐 Web Application Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-web.outputs.affected }}" == "true" ]; then
            echo "✅ Web app was affected by changes" >> $GITHUB_STEP_SUMMARY
            echo "🏗️ Build completed successfully" >> $GITHUB_STEP_SUMMARY
            echo "📦 Deployment initiated" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Environment:** Production" >> $GITHUB_STEP_SUMMARY
            echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ Web app was not affected, skipping deployment" >> $GITHUB_STEP_SUMMARY
          fi

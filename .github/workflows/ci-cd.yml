name: CI/CD with NX

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Required permissions for nx-set-shas to access workflow runs
permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: '20'
  NX_CLOUD_DISTRIBUTED_EXECUTION: 'false'

jobs:
  setup:
    name: Setup and Cache Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cache-key: ${{ steps.cache-keys.outputs.node-modules }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate cache keys
        id: cache-keys
        run: |
          echo "node-modules=${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}" >> $GITHUB_OUTPUT

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ steps.cache-keys.outputs.node-modules }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          npm ci --prefer-offline --no-audit
        env:
          CYPRESS_INSTALL_BINARY: 0
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Cache NX
        uses: actions/cache@v5
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-

      - name: Generate Setup Summary
        run: |
          echo "## 🚀 Setup Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Node.js: $(node --version)" >> $GITHUB_STEP_SUMMARY
          echo "✅ NPM: $(npm --version)" >> $GITHUB_STEP_SUMMARY
          echo "✅ NX: $(npx nx --version)" >> $GITHUB_STEP_SUMMARY
          echo "✅ Cache: ${{ steps.cache-node-modules.outputs.cache-hit == 'true' && 'Hit' || 'Miss' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY

  lint:
    name: Lint
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Restore NX cache
        uses: actions/cache/restore@v5
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-

      - name: Set NX SHAs
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: 'main'

      - name: Check code format (Prettier)
        run: npm run format:check

      - name: Run lint on affected projects
        run: npx nx affected -t lint --parallel=3 --configuration=ci

      - name: Generate Summary
        if: always()
        run: |
          echo "## 🔍 Lint Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ Format check (Prettier) and lint completed" >> $GITHUB_STEP_SUMMARY

  typecheck:
    name: Type Check
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Restore NX cache
        uses: actions/cache/restore@v5
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-

      - name: Set NX SHAs
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: 'main'

      - name: Run type check on affected projects
        run: npx nx affected -t typecheck --parallel=3

      - name: Generate Summary
        if: always()
        run: |
          echo "## 🔎 Type Check Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ Type checking completed" >> $GITHUB_STEP_SUMMARY

  test:
    name: Test
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Restore NX cache
        uses: actions/cache/restore@v5
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-

      - name: Set NX SHAs
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: 'main'

      - name: Run tests on affected projects
        run: npx nx affected -t test --parallel=3 --configuration=ci --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        if: always()
        with:
          directory: ./coverage
          fail_ci_if_error: false

      - name: Generate Summary
        if: always()
        run: |
          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ Tests completed" >> $GITHUB_STEP_SUMMARY

  build:
    name: Build
    needs: [lint, typecheck, test, setup]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Restore NX cache
        uses: actions/cache/restore@v5
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-

      - name: Set NX SHAs
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: 'main'

      - name: Build affected projects
        run: npx nx affected -t build --parallel=3 --configuration=production
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: build-artifacts-${{ github.sha }}
          path: |
            apps/*/dist
            apps/*/.next
          retention-days: 7

      - name: Generate Summary
        if: always()
        run: |
          echo "## 🔨 Build Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build completed" >> $GITHUB_STEP_SUMMARY

  deploy-backend:
    name: Deploy Backend
    needs: [build, setup]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Set NX SHAs
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: 'main'

      - name: Check if backend is affected
        id: check-backend
        run: |
          AFFECTED=$(npx nx show projects --affected --json 2>/dev/null || echo "[]")
          if echo "$AFFECTED" | grep -q '"backend"'; then
            echo "affected=true" >> $GITHUB_OUTPUT
            echo "✅ Backend is affected"
          else
            echo "affected=false" >> $GITHUB_OUTPUT
            echo "⏭️ Backend is not affected"
          fi

      - name: Setup Fly CLI
        if: steps.check-backend.outputs.affected == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest

      - name: Deploy Backend to Fly.io
        if: steps.check-backend.outputs.affected == 'true'
        run: |
          flyctl deploy --config apps/backend/fly.toml --local-only || \
          flyctl deploy --config apps/backend/fly.toml --remote-only --depot=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Generate Summary
        if: always()
        run: |
          echo "## 🚀 Backend Deployment" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-backend.outputs.affected }}" == "true" ]; then
            echo "✅ Backend deployed to Fly.io" >> $GITHUB_STEP_SUMMARY
            echo "🔗 https://oneohm-epc-backend.fly.dev" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ Backend not affected, skipped" >> $GITHUB_STEP_SUMMARY
          fi

  deploy-web:
    name: Deploy Web
    needs: [build, setup]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Set NX SHAs
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: 'main'

      - name: Check if web is affected
        id: check-web
        run: |
          AFFECTED=$(npx nx show projects --affected --json 2>/dev/null || echo "[]")
          if echo "$AFFECTED" | grep -q '"web"'; then
            echo "affected=true" >> $GITHUB_OUTPUT
            echo "✅ Web is affected"
          else
            echo "affected=false" >> $GITHUB_OUTPUT
            echo "⏭️ Web is not affected"
          fi

      - name: Setup Fly CLI
        if: steps.check-web.outputs.affected == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest

      - name: Deploy Web to Fly.io
        if: steps.check-web.outputs.affected == 'true'
        run: |
          flyctl deploy --config apps/web/fly.toml --local-only || \
          flyctl deploy --config apps/web/fly.toml --remote-only --depot=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Generate Summary
        if: always()
        run: |
          echo "## 🌐 Web Deployment" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-web.outputs.affected }}" == "true" ]; then
            echo "✅ Web deployed to Fly.io" >> $GITHUB_STEP_SUMMARY
            echo "🔗 https://oneohm-epc-web.fly.dev" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ Web not affected, skipped" >> $GITHUB_STEP_SUMMARY
          fi

name: CI/CD with NX

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  NX_CLOUD_DISTRIBUTED_EXECUTION: 'false'

jobs:
  setup:
    name: Setup and Cache Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cache-key: ${{ steps.cache-keys.outputs.node-modules }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate cache keys
        id: cache-keys
        run: |
          echo "node-modules=${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}" >> $GITHUB_OUTPUT

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ steps.cache-keys.outputs.node-modules }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          npm ci --prefer-offline --no-audit
        env:
          CYPRESS_INSTALL_BINARY: 0
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Cache NX
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-

      - name: Generate Setup Summary
        run: |
          echo "## 🚀 Setup Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Node.js: $(node --version)" >> $GITHUB_STEP_SUMMARY
          echo "✅ NPM: $(npm --version)" >> $GITHUB_STEP_SUMMARY
          echo "✅ NX: $(npx nx --version)" >> $GITHUB_STEP_SUMMARY
          echo "✅ Cache: ${{ steps.cache-node-modules.outputs.cache-hit == 'true' && 'Hit' || 'Miss' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY

  lint:
    name: Lint
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Restore NX cache
        uses: actions/cache/restore@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-

      - name: Set NX SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Run lint on affected projects
        run: npx nx affected -t lint --parallel=3 --configuration=ci

      - name: Generate Summary
        if: always()
        run: |
          echo "## 🔍 Lint Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ Linting completed" >> $GITHUB_STEP_SUMMARY

  typecheck:
    name: Type Check
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Restore NX cache
        uses: actions/cache/restore@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-

      - name: Set NX SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Run type check on affected projects
        run: npx nx affected -t typecheck --parallel=3

      - name: Generate Summary
        if: always()
        run: |
          echo "## 🔎 Type Check Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ Type checking completed" >> $GITHUB_STEP_SUMMARY

  test:
    name: Test
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Restore NX cache
        uses: actions/cache/restore@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-

      - name: Set NX SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Run tests on affected projects
        run: npx nx affected -t test --parallel=3 --configuration=ci --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          directory: ./coverage
          fail_ci_if_error: false

      - name: Generate Summary
        if: always()
        run: |
          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ Tests completed" >> $GITHUB_STEP_SUMMARY

  build:
    name: Build
    needs: [lint, typecheck, test, setup]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Restore NX cache
        uses: actions/cache/restore@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-

      - name: Set NX SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Build affected projects
        run: npx nx affected -t build --parallel=3 --configuration=production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: build-artifacts-${{ github.sha }}
          path: |
            apps/*/dist
            apps/*/.next
          retention-days: 7

      - name: Generate Summary
        if: always()
        run: |
          echo "## 🔨 Build Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build completed" >> $GITHUB_STEP_SUMMARY

  deploy-backend:
    name: Deploy Backend
    needs: [build, setup]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Set NX SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Check if backend is affected
        id: check-backend
        run: |
          if npx nx print-affected --select=projects | grep -q "backend"; then
            echo "affected=true" >> $GITHUB_OUTPUT
          else
            echo "affected=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Backend Docker Image
        if: steps.check-backend.outputs.affected == 'true'
        working-directory: ./apps/backend
        run: docker build -t oneohm-epc-backend:${{ github.sha }} -t oneohm-epc-backend:latest .

      - name: Deploy Backend
        if: steps.check-backend.outputs.affected == 'true'
        run: |
          echo "🚀 Add your backend deployment steps here"
          echo "Example: docker push, kubectl apply, etc."

      - name: Generate Summary
        if: always()
        run: |
          echo "## 🚀 Backend Deployment" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-backend.outputs.affected }}" == "true" ]; then
            echo "✅ Backend deployed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ Backend not affected, skipped" >> $GITHUB_STEP_SUMMARY
          fi

  deploy-web:
    name: Deploy Web
    needs: [build, setup]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Set NX SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Check if web is affected
        id: check-web
        run: |
          if npx nx print-affected --select=projects | grep -q "web"; then
            echo "affected=true" >> $GITHUB_OUTPUT
          else
            echo "affected=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Web
        if: steps.check-web.outputs.affected == 'true'
        run: |
          echo "🚀 Add your web deployment steps here"
          echo "Example: Vercel, Netlify, AWS S3, etc."

      - name: Generate Summary
        if: always()
        run: |
          echo "## 🌐 Web Deployment" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-web.outputs.affected }}" == "true" ]; then
            echo "✅ Web deployed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ Web not affected, skipped" >> $GITHUB_STEP_SUMMARY
          fi

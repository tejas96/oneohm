<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generate Invoice - OneOhm Solar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#76c044',
              secondary: '#0d74b8',
              tagline: '#025580',
            },
          },
        },
      };
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      body {
        font-family: 'Inter', sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-50">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl pb-8">
      <div class="bg-gradient-to-r from-green-600 to-emerald-700 px-6 py-6 pt-12">
        <a href="dashboard-finance.html" class="inline-flex items-center text-white mb-6">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 19l-7-7 7-7"
            ></path>
          </svg>
        </a>
        <h1 class="text-3xl font-bold text-white mb-2">Generate Invoice</h1>
        <p class="text-green-100">Create new invoice</p>
      </div>

      <div class="px-6 py-6">
        <!-- Project Selection -->
        <div class="mb-6">
          <label class="block text-sm font-bold text-gray-900 mb-3">Select Project</label>
          <select
            id="projectSelect"
            class="w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:border-primary focus:outline-none"
          >
            <option value="">Select project</option>
            <option value="PRJ-2025-085">PRJ-2025-085 - Rajesh Kumar (₹5,50,000)</option>
            <option value="PRJ-2025-089">PRJ-2025-089 - Sunita Reddy (₹4,20,000)</option>
            <option value="PRJ-2025-092">PRJ-2025-092 - Amit Patel (₹6,80,000)</option>
          </select>
        </div>

        <!-- Invoice Type -->
        <div class="mb-6">
          <label class="block text-sm font-bold text-gray-900 mb-3">Invoice Type</label>
          <div class="grid grid-cols-2 gap-3">
            <label class="relative cursor-pointer">
              <input type="radio" name="invoice_type" value="full" class="peer sr-only" checked />
              <div
                class="p-4 border-2 border-gray-200 rounded-2xl peer-checked:border-primary peer-checked:bg-primary/5 text-center"
              >
                <p class="font-semibold text-sm text-gray-900">Full Invoice</p>
                <p class="text-xs text-gray-600 mt-1">Complete payment</p>
              </div>
            </label>
            <label class="relative cursor-pointer">
              <input type="radio" name="invoice_type" value="partial" class="peer sr-only" />
              <div
                class="p-4 border-2 border-gray-200 rounded-2xl peer-checked:border-primary peer-checked:bg-primary/5 text-center"
              >
                <p class="font-semibold text-sm text-gray-900">Partial Invoice</p>
                <p class="text-xs text-gray-600 mt-1">Phase payment</p>
              </div>
            </label>
          </div>
        </div>

        <!-- Invoice Details -->
        <div class="mb-6">
          <label class="block text-sm font-bold text-gray-900 mb-3">Invoice Details</label>
          <div class="space-y-3">
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2">Invoice Number</label>
              <input
                type="text"
                value="INV-2025-0245"
                readonly
                class="w-full px-4 py-3 border-2 border-gray-200 rounded-2xl bg-gray-50"
              />
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2">Invoice Date</label>
              <input
                type="date"
                value="2025-10-25"
                class="w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:border-primary focus:outline-none"
              />
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2">Due Date</label>
              <input
                type="date"
                value="2025-11-10"
                class="w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:border-primary focus:outline-none"
              />
            </div>
          </div>
        </div>

        <!-- Amount Breakdown -->
        <div
          class="bg-gradient-to-br from-blue-50 to-purple-50 border-2 border-blue-200 rounded-2xl p-6 mb-6"
        >
          <h3 class="font-bold text-gray-900 mb-4">Amount Breakdown</h3>
          <div class="space-y-3">
            <div class="flex justify-between items-center">
              <span class="text-sm text-gray-700">Equipment Cost</span>
              <input
                type="text"
                value="450000"
                class="w-32 px-3 py-2 border border-gray-300 rounded-lg text-right font-semibold text-sm"
              />
            </div>
            <div class="flex justify-between items-center">
              <span class="text-sm text-gray-700">Installation</span>
              <input
                type="text"
                value="75000"
                class="w-32 px-3 py-2 border border-gray-300 rounded-lg text-right font-semibold text-sm"
              />
            </div>
            <div class="flex justify-between items-center">
              <span class="text-sm text-gray-700">Others</span>
              <input
                type="text"
                value="25000"
                class="w-32 px-3 py-2 border border-gray-300 rounded-lg text-right font-semibold text-sm"
              />
            </div>
            <div class="border-t-2 border-blue-300 pt-3">
              <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-semibold text-gray-700">Subtotal</span>
                <span class="font-bold text-gray-900">₹5,50,000</span>
              </div>
              <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-semibold text-gray-700">GST (18%)</span>
                <span class="font-bold text-gray-900">₹99,000</span>
              </div>
              <div class="flex justify-between items-center pt-2 border-t border-blue-200">
                <span class="text-lg font-bold text-gray-900">Total Amount</span>
                <span class="text-2xl font-bold text-primary">₹6,49,000</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Payment Terms -->
        <div class="mb-6">
          <label class="block text-sm font-bold text-gray-900 mb-3">Payment Terms</label>
          <textarea
            rows="3"
            placeholder="Enter payment terms and conditions..."
            class="w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:border-primary focus:outline-none resize-none text-sm"
          >
Payment due within 15 days of invoice date. Late payment charges: 2% per month.</textarea
          >
        </div>

        <!-- Notes -->
        <div class="mb-6">
          <label class="block text-sm font-bold text-gray-900 mb-3">Additional Notes</label>
          <textarea
            rows="2"
            placeholder="Add any notes..."
            class="w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:border-primary focus:outline-none resize-none text-sm"
          ></textarea>
        </div>

        <!-- Action Buttons -->
        <div class="space-y-3">
          <button
            class="w-full py-4 bg-gradient-to-r from-green-600 to-emerald-700 text-white rounded-2xl font-bold text-lg shadow-lg"
          >
            Generate Invoice
          </button>
          <button
            class="w-full py-3 bg-white border-2 border-gray-200 text-gray-700 rounded-2xl font-bold"
          >
            Preview
          </button>
        </div>
      </div>
    </div>
  </body>
</html>

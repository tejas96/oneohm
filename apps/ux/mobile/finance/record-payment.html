<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Record Payment - OneOhm Solar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#76c044',
                        secondary: '#0d74b8',
                        tagline: '#025580',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl pb-8">
        <div class="bg-gradient-to-r from-green-600 to-emerald-700 px-6 py-6 pt-12">
            <a href="dashboard-finance.html" class="inline-flex items-center text-white mb-6">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
            </a>
            <h1 class="text-3xl font-bold text-white mb-2">Record Payment</h1>
            <p class="text-green-100">Add new payment entry</p>
        </div>

        <div class="px-6 py-6">
            <!-- Project Selection -->
            <div class="mb-6">
                <label class="block text-sm font-bold text-gray-900 mb-3">Select Project</label>
                <select class="w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:border-primary focus:outline-none">
                    <option>Select project</option>
                    <option>PRJ-2025-085 - Rajesh Kumar</option>
                    <option>PRJ-2025-089 - Sunita Reddy</option>
                    <option>PRJ-2025-092 - Amit Patel</option>
                </select>
            </div>

            <!-- Payment Details -->
            <div class="bg-blue-50 border-2 border-blue-200 rounded-2xl p-4 mb-6">
                <h3 class="font-bold text-gray-900 mb-3">Project Details</h3>
                <div class="space-y-2 text-sm">
                    <div class="flex justify-between">
                        <span class="text-gray-600">Total Amount</span>
                        <span class="font-bold text-gray-900">₹5,50,000</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-600">Paid</span>
                        <span class="font-bold text-green-600">₹3,00,000</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-600">Balance</span>
                        <span class="font-bold text-red-600">₹2,50,000</span>
                    </div>
                </div>
            </div>

            <!-- Payment Amount -->
            <div class="mb-6">
                <label class="block text-sm font-bold text-gray-900 mb-3">Payment Amount</label>
                <div class="relative">
                    <span class="absolute left-4 top-4 text-xl font-bold text-gray-500">₹</span>
                    <input type="number" placeholder="Enter amount" class="w-full pl-12 pr-4 py-4 border-2 border-gray-200 rounded-2xl focus:border-primary focus:outline-none text-xl font-bold">
                </div>
            </div>

            <!-- Payment Method -->
            <div class="mb-6">
                <label class="block text-sm font-bold text-gray-900 mb-3">Payment Method</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="relative cursor-pointer">
                        <input type="radio" name="payment_method" class="peer sr-only" checked>
                        <div class="p-4 border-2 border-gray-200 rounded-2xl peer-checked:border-primary peer-checked:bg-primary/5">
                            <div class="text-center">
                                <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center mx-auto mb-2">
                                    <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path>
                                    </svg>
                                </div>
                                <p class="font-semibold text-sm">Bank Transfer</p>
                            </div>
                        </div>
                    </label>

                    <label class="relative cursor-pointer">
                        <input type="radio" name="payment_method" class="peer sr-only">
                        <div class="p-4 border-2 border-gray-200 rounded-2xl peer-checked:border-primary peer-checked:bg-primary/5">
                            <div class="text-center">
                                <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center mx-auto mb-2">
                                    <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                    </svg>
                                </div>
                                <p class="font-semibold text-sm">Cash</p>
                            </div>
                        </div>
                    </label>

                    <label class="relative cursor-pointer">
                        <input type="radio" name="payment_method" class="peer sr-only">
                        <div class="p-4 border-2 border-gray-200 rounded-2xl peer-checked:border-primary peer-checked:bg-primary/5">
                            <div class="text-center">
                                <div class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center mx-auto mb-2">
                                    <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                                    </svg>
                                </div>
                                <p class="font-semibold text-sm">Cheque</p>
                            </div>
                        </div>
                    </label>

                    <label class="relative cursor-pointer">
                        <input type="radio" name="payment_method" class="peer sr-only">
                        <div class="p-4 border-2 border-gray-200 rounded-2xl peer-checked:border-primary peer-checked:bg-primary/5">
                            <div class="text-center">
                                <div class="w-12 h-12 bg-orange-100 rounded-lg flex items-center justify-center mx-auto mb-2">
                                    <svg class="w-6 h-6 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                                    </svg>
                                </div>
                                <p class="font-semibold text-sm">UPI</p>
                            </div>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Transaction Details -->
            <div class="mb-6">
                <label class="block text-sm font-bold text-gray-900 mb-3">Transaction Details</label>
                <div class="space-y-3">
                    <input type="text" placeholder="Transaction ID / Reference Number" class="w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:border-primary focus:outline-none">
                    <input type="date" class="w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:border-primary focus:outline-none">
                </div>
            </div>

            <!-- Payment Phase -->
            <div class="mb-6">
                <label class="block text-sm font-bold text-gray-900 mb-3">Payment Phase</label>
                <select class="w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:border-primary focus:outline-none">
                    <option>Select payment phase</option>
                    <option>Booking Advance</option>
                    <option>After Site Survey</option>
                    <option>After Material Delivery</option>
                    <option>After Installation</option>
                    <option>Final Payment</option>
                </select>
            </div>

            <!-- Notes -->
            <div class="mb-6">
                <label class="block text-sm font-bold text-gray-900 mb-3">Notes (Optional)</label>
                <textarea rows="3" placeholder="Add payment notes..." class="w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:border-primary focus:outline-none resize-none"></textarea>
            </div>

            <!-- Upload Receipt -->
            <div class="mb-6">
                <label class="block text-sm font-bold text-gray-900 mb-3">Upload Receipt (Optional)</label>
                <div class="border-2 border-dashed border-gray-300 rounded-2xl p-6 text-center hover:border-primary cursor-pointer">
                    <svg class="w-12 h-12 text-gray-400 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    <p class="text-sm text-gray-600 font-semibold">Click to upload receipt</p>
                    <p class="text-xs text-gray-500 mt-1">PDF, JPG, PNG (Max 5MB)</p>
                </div>
            </div>

            <!-- Submit Button -->
            <button class="w-full py-4 bg-gradient-to-r from-green-600 to-emerald-700 text-white rounded-2xl font-bold text-lg shadow-lg hover:shadow-xl transition-all">
                Record Payment
            </button>
        </div>
    </div>
</body>
</html>

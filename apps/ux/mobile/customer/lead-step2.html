<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Lead - Step 2 - OneOhm Solar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#76c044',
              secondary: '#0d74b8',
              tagline: '#025580',
            },
          },
        },
      };
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      body {
        font-family: 'Inter', sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-50">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl">
      <!-- Header -->
      <div class="bg-gradient-to-r from-primary via-green-500 to-secondary px-6 py-6 pt-12">
        <div class="flex items-center justify-between mb-6">
          <a href="lead-step1.html" class="inline-flex items-center text-white">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 19l-7-7 7-7"
              ></path>
            </svg>
          </a>
          <div class="flex items-center space-x-2">
            <div class="w-8 h-1 bg-white rounded-full"></div>
            <div class="w-8 h-1 bg-white rounded-full"></div>
            <div class="w-8 h-1 bg-white/30 rounded-full"></div>
            <div class="w-8 h-1 bg-white/30 rounded-full"></div>
            <div class="w-8 h-1 bg-white/30 rounded-full"></div>
            <div class="w-8 h-1 bg-white/30 rounded-full"></div>
          </div>
        </div>
        <div class="mb-4">
          <p class="text-green-100 text-sm mb-1">Step 2 of 6</p>
          <h1 class="text-3xl font-bold text-white mb-2">Consumer Details</h1>
          <p class="text-green-100">Tell us about your project</p>
        </div>
      </div>

      <!-- Content -->
      <div class="px-6 py-8">
        <form id="leadForm" class="space-y-6" onsubmit="handleSubmit(event)">
          <!-- Project Type -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-3"> Project Type * </label>
            <div class="grid grid-cols-2 gap-3">
              <label
                class="relative flex items-center p-4 border-2 border-gray-200 rounded-2xl cursor-pointer hover:border-primary transition-all"
              >
                <input
                  type="radio"
                  name="projectType"
                  value="Roof Top"
                  class="peer sr-only"
                  checked
                />
                <div
                  class="peer-checked:border-primary peer-checked:bg-primary/5 absolute inset-0 border-2 rounded-2xl"
                ></div>
                <div class="relative flex flex-col items-center w-full">
                  <svg
                    class="w-8 h-8 text-primary mb-2"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
                    ></path>
                  </svg>
                  <span class="text-sm font-medium text-gray-900">Roof Top</span>
                </div>
              </label>
              <label
                class="relative flex items-center p-4 border-2 border-gray-200 rounded-2xl cursor-pointer hover:border-primary transition-all"
              >
                <input type="radio" name="projectType" value="Ground Mount" class="peer sr-only" />
                <div
                  class="peer-checked:border-primary peer-checked:bg-primary/5 absolute inset-0 border-2 rounded-2xl"
                ></div>
                <div class="relative flex flex-col items-center w-full">
                  <svg
                    class="w-8 h-8 text-primary mb-2"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"
                    ></path>
                  </svg>
                  <span class="text-sm font-medium text-gray-900">Ground Mount</span>
                </div>
              </label>
            </div>
          </div>

          <!-- Category -->
          <div>
            <label for="category" class="block text-sm font-medium text-gray-700 mb-2">
              Category *
            </label>
            <select
              id="category"
              name="category"
              class="block w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:ring-2 focus:ring-primary focus:border-primary transition-all"
              required
            >
              <option value="">Select category</option>
              <option value="Residential" selected>Residential</option>
              <option value="Commercial">Commercial</option>
              <option value="Industrial">Industrial</option>
              <option value="Government">Government</option>
              <option value="Agriculture">Agriculture</option>
            </select>
          </div>

          <!-- Subsidy -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-3">
              Subsidy Applicable? *
            </label>
            <div class="flex space-x-3">
              <label class="flex-1 relative">
                <input
                  type="radio"
                  name="subsidy"
                  value="yes"
                  class="peer sr-only"
                  checked
                  onchange="toggleSubsidy()"
                />
                <div
                  class="peer-checked:border-success peer-checked:bg-success/5 border-2 border-gray-200 rounded-2xl p-4 cursor-pointer hover:border-success transition-all text-center"
                >
                  <span class="text-sm font-semibold text-gray-900">Yes</span>
                </div>
              </label>
              <label class="flex-1 relative">
                <input
                  type="radio"
                  name="subsidy"
                  value="no"
                  class="peer sr-only"
                  onchange="toggleSubsidy()"
                />
                <div
                  class="peer-checked:border-gray-400 peer-checked:bg-gray-100 border-2 border-gray-200 rounded-2xl p-4 cursor-pointer hover:border-gray-400 transition-all text-center"
                >
                  <span class="text-sm font-semibold text-gray-900">No</span>
                </div>
              </label>
            </div>
          </div>

          <!-- Subsidy Scheme (conditional) -->
          <div id="subsidyScheme">
            <label for="scheme" class="block text-sm font-medium text-gray-700 mb-2">
              Subsidy Scheme *
            </label>
            <select
              id="scheme"
              name="scheme"
              class="block w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:ring-2 focus:ring-primary focus:border-primary transition-all"
            >
              <option value="">Select scheme</option>
              <option value="PM Surya Ghar" selected>PM Surya Ghar</option>
              <option value="State Subsidy">State Subsidy</option>
            </select>
          </div>

          <!-- Metering Type -->
          <div>
            <label for="metering" class="block text-sm font-medium text-gray-700 mb-2">
              Metering Type *
            </label>
            <select
              id="metering"
              name="metering"
              class="block w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:ring-2 focus:ring-primary focus:border-primary transition-all"
              required
            >
              <option value="">Select metering type</option>
              <option value="Net Metering" selected>Net Metering</option>
              <option value="Gross Metering">Gross Metering</option>
              <option value="Open Access">Open Access</option>
              <option value="Behind the Meter">Behind the Meter</option>
            </select>
          </div>

          <!-- Priority -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-3"> Priority * </label>
            <div class="grid grid-cols-3 gap-3">
              <label class="relative">
                <input type="radio" name="priority" value="High" class="peer sr-only" />
                <div
                  class="peer-checked:border-error peer-checked:bg-error/5 border-2 border-gray-200 rounded-2xl p-3 cursor-pointer hover:border-error transition-all text-center"
                >
                  <span class="text-sm font-semibold text-gray-900">High</span>
                </div>
              </label>
              <label class="relative">
                <input type="radio" name="priority" value="Medium" class="peer sr-only" checked />
                <div
                  class="peer-checked:border-warning peer-checked:bg-warning/5 border-2 border-gray-200 rounded-2xl p-3 cursor-pointer hover:border-warning transition-all text-center"
                >
                  <span class="text-sm font-semibold text-gray-900">Medium</span>
                </div>
              </label>
              <label class="relative">
                <input type="radio" name="priority" value="Low" class="peer sr-only" />
                <div
                  class="peer-checked:border-gray-400 peer-checked:bg-gray-100 border-2 border-gray-200 rounded-2xl p-3 cursor-pointer hover:border-gray-400 transition-all text-center"
                >
                  <span class="text-sm font-semibold text-gray-900">Low</span>
                </div>
              </label>
            </div>
          </div>

          <!-- Remarks -->
          <div>
            <label for="remarks" class="block text-sm font-medium text-gray-700 mb-2">
              Remarks (Optional)
            </label>
            <textarea
              id="remarks"
              name="remarks"
              rows="3"
              class="block w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:ring-2 focus:ring-primary focus:border-primary transition-all resize-none"
              placeholder="Any additional notes..."
            ></textarea>
          </div>

          <!-- Info Box -->
          <div class="bg-green-50 border border-green-100 rounded-lg p-4">
            <div class="flex items-start space-x-3">
              <svg
                class="w-5 h-5 text-green-600 flex-shrink-0 mt-0.5"
                fill="currentColor"
                viewBox="0 0 20 20"
              >
                <path
                  fill-rule="evenodd"
                  d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                  clip-rule="evenodd"
                ></path>
              </svg>
              <p class="text-sm text-green-800 leading-relaxed">
                <strong class="font-semibold">Subsidy eligibility:</strong> PM Surya Ghar provides
                ₹78,000 for 3kW + ₹18,000/kW for additional capacity (up to 10kW).
              </p>
            </div>
          </div>

          <!-- Buttons -->
          <div class="flex space-x-3 pt-4">
            <a href="lead-step1.html" class="flex-1">
              <button
                type="button"
                class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-4 px-6 rounded-2xl transition-all"
              >
                Back
              </button>
            </a>
            <button
              type="submit"
              class="flex-1 bg-gradient-to-r from-primary via-green-500 to-secondary text-white font-semibold py-4 px-6 rounded-2xl shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all duration-200 flex items-center justify-center space-x-2"
            >
              <span>Next Step</span>
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13 7l5 5m0 0l-5 5m5-5H6"
                ></path>
              </svg>
            </button>
          </div>
        </form>
      </div>
    </div>

    <script>
      function toggleSubsidy() {
        const subsidyYes = document.querySelector('input[name="subsidy"][value="yes"]').checked;
        const subsidyScheme = document.getElementById('subsidyScheme');
        if (subsidyYes) {
          subsidyScheme.style.display = 'block';
          document.getElementById('scheme').required = true;
        } else {
          subsidyScheme.style.display = 'none';
          document.getElementById('scheme').required = false;
        }
      }

      function handleSubmit(event) {
        event.preventDefault();
        const formData = {
          projectType: document.querySelector('input[name="projectType"]:checked').value,
          category: document.getElementById('category').value,
          subsidy: document.querySelector('input[name="subsidy"]:checked').value,
          scheme: document.getElementById('scheme').value,
          metering: document.getElementById('metering').value,
          priority: document.querySelector('input[name="priority"]:checked').value,
          remarks: document.getElementById('remarks').value,
        };
        localStorage.setItem('leadFormStep2', JSON.stringify(formData));
        console.log('Step 2 data saved:', formData);
        window.location.href = 'lead-step3.html';
      }

      window.addEventListener('load', () => {
        const savedData = localStorage.getItem('leadFormStep2');
        if (savedData) {
          const data = JSON.parse(savedData);
          if (data.projectType)
            document.querySelector(
              `input[name="projectType"][value="${data.projectType}"]`,
            ).checked = true;
          if (data.category) document.getElementById('category').value = data.category;
          if (data.subsidy) {
            document.querySelector(`input[name="subsidy"][value="${data.subsidy}"]`).checked = true;
            toggleSubsidy();
          }
          if (data.scheme) document.getElementById('scheme').value = data.scheme;
          if (data.metering) document.getElementById('metering').value = data.metering;
          if (data.priority)
            document.querySelector(`input[name="priority"][value="${data.priority}"]`).checked =
              true;
          if (data.remarks) document.getElementById('remarks').value = data.remarks;
        }
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Service Request - OneOhm Solar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#76c044',
              secondary: '#0d74b8',
              tagline: '#025580',
            },
          },
        },
      };
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      body {
        font-family: 'Inter', sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-50">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl pb-20">
      <div class="bg-gradient-to-r from-primary via-green-500 to-secondary px-6 py-6 pt-12">
        <a href="dashboard-main.html" class="inline-flex items-center text-white mb-6">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 19l-7-7 7-7"
            ></path>
          </svg>
        </a>
        <h1 class="text-3xl font-bold text-white mb-2">Service Request</h1>
        <p class="text-green-100">Submit a new service ticket</p>
      </div>

      <div class="px-6 py-8 space-y-6">
        <!-- Request Type -->
        <div>
          <label class="block text-sm font-bold text-gray-900 mb-3">Request Type *</label>
          <div class="grid grid-cols-2 gap-3">
            <button
              class="p-4 border-2 border-primary bg-primary/5 rounded-2xl text-left hover:bg-primary/10 transition-all"
            >
              <svg
                class="w-8 h-8 text-primary mb-2"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
                ></path>
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                ></path>
              </svg>
              <p class="font-semibold text-gray-900">Maintenance</p>
              <p class="text-xs text-gray-500 mt-1">Panel cleaning, inspection</p>
            </button>
            <button
              class="p-4 border-2 border-gray-200 rounded-2xl text-left hover:border-primary hover:bg-primary/5 transition-all"
            >
              <svg
                class="w-8 h-8 text-gray-600 mb-2"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
                ></path>
              </svg>
              <p class="font-semibold text-gray-900">Repair</p>
              <p class="text-xs text-gray-500 mt-1">System issues, faults</p>
            </button>
            <button
              class="p-4 border-2 border-gray-200 rounded-2xl text-left hover:border-primary hover:bg-primary/5 transition-all"
            >
              <svg
                class="w-8 h-8 text-gray-600 mb-2"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                ></path>
              </svg>
              <p class="font-semibold text-gray-900">Query</p>
              <p class="text-xs text-gray-500 mt-1">General questions</p>
            </button>
            <button
              class="p-4 border-2 border-gray-200 rounded-2xl text-left hover:border-primary hover:bg-primary/5 transition-all"
            >
              <svg
                class="w-8 h-8 text-gray-600 mb-2"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
                ></path>
              </svg>
              <p class="font-semibold text-gray-900">Documentation</p>
              <p class="text-xs text-gray-500 mt-1">Request documents</p>
            </button>
          </div>
        </div>

        <!-- Issue Category -->
        <div>
          <label class="block text-sm font-bold text-gray-900 mb-2">Issue Category *</label>
          <select
            class="w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:border-primary focus:outline-none"
          >
            <option>Select category</option>
            <option>Panel Cleaning</option>
            <option>Inverter Issue</option>
            <option>Low Power Output</option>
            <option>System Not Working</option>
            <option>Monitoring Issue</option>
            <option>Other</option>
          </select>
        </div>

        <!-- Priority -->
        <div>
          <label class="block text-sm font-bold text-gray-900 mb-3">Priority Level *</label>
          <div class="flex space-x-3">
            <button
              class="flex-1 py-3 border-2 border-gray-200 rounded-2xl font-semibold hover:border-primary transition-all"
            >
              Low
            </button>
            <button
              class="flex-1 py-3 border-2 border-primary bg-primary/5 text-primary rounded-2xl font-semibold"
            >
              Medium
            </button>
            <button
              class="flex-1 py-3 border-2 border-gray-200 rounded-2xl font-semibold hover:border-primary transition-all"
            >
              High
            </button>
          </div>
        </div>

        <!-- Description -->
        <div>
          <label class="block text-sm font-bold text-gray-900 mb-2">Describe the Issue *</label>
          <textarea
            rows="5"
            class="w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:border-primary focus:outline-none resize-none"
            placeholder="Please provide detailed information about the issue you're experiencing..."
          ></textarea>
        </div>

        <!-- Upload Photos -->
        <div>
          <label class="block text-sm font-bold text-gray-900 mb-2">Upload Photos (Optional)</label>
          <div class="grid grid-cols-3 gap-3">
            <button
              class="aspect-square border-2 border-dashed border-gray-300 rounded-2xl flex flex-col items-center justify-center hover:border-primary hover:bg-primary/5 transition-all"
            >
              <svg
                class="w-8 h-8 text-gray-400 mb-1"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 4v16m8-8H4"
                ></path>
              </svg>
              <span class="text-xs text-gray-500">Add Photo</span>
            </button>
          </div>
        </div>

        <!-- Preferred Visit Date -->
        <div>
          <label class="block text-sm font-bold text-gray-900 mb-2">Preferred Visit Date</label>
          <input
            type="date"
            class="w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:border-primary focus:outline-none"
          />
        </div>

        <!-- Preferred Time -->
        <div>
          <label class="block text-sm font-bold text-gray-900 mb-2">Preferred Time Slot</label>
          <div class="grid grid-cols-3 gap-2">
            <button
              class="py-3 border-2 border-gray-200 rounded-lg font-semibold text-sm hover:border-primary transition-all"
            >
              Morning
            </button>
            <button
              class="py-3 border-2 border-primary bg-primary/5 text-primary rounded-lg font-semibold text-sm"
            >
              Afternoon
            </button>
            <button
              class="py-3 border-2 border-gray-200 rounded-lg font-semibold text-sm hover:border-primary transition-all"
            >
              Evening
            </button>
          </div>
        </div>

        <!-- Contact Number -->
        <div>
          <label class="block text-sm font-bold text-gray-900 mb-2">Contact Number *</label>
          <input
            type="tel"
            value="+91 98765 43210"
            class="w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:border-primary focus:outline-none"
          />
        </div>

        <!-- Submit Button -->
        <button
          class="w-full py-4 bg-gradient-to-r from-primary via-green-500 to-secondary text-white rounded-2xl font-bold shadow-lg hover:shadow-xl transition-all"
        >
          Submit Request
        </button>

        <!-- Info Box -->
        <div class="bg-blue-50 border border-blue-200 rounded-2xl p-4">
          <div class="flex items-start space-x-3">
            <svg
              class="w-5 h-5 text-blue-600 mt-0.5 flex-shrink-0"
              fill="currentColor"
              viewBox="0 0 20 20"
            >
              <path
                fill-rule="evenodd"
                d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"
                clip-rule="evenodd"
              ></path>
            </svg>
            <div>
              <p class="text-sm font-semibold text-blue-900 mb-1">Response Time</p>
              <p class="text-xs text-blue-800">
                Our team will contact you within 24 hours. For urgent issues, please call our
                helpline: 1800-XXX-XXXX
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

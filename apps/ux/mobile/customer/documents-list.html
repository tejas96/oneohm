<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documents - OneOhm Solar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#76c044',
                        secondary: '#0d74b8',
                        tagline: '#025580',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl pb-20">
        <div class="bg-gradient-to-r from-primary via-green-500 to-secondary px-6 py-6 pt-12">
            <a href="dashboard-main.html" class="inline-flex items-center text-white mb-6">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
            </a>
            <h1 class="text-3xl font-bold text-white mb-2">Documents</h1>
            <p class="text-green-100">Your project documents</p>
        </div>

        <div class="px-6 py-8">
            <div class="flex space-x-2 mb-6">
                <button class="flex-1 py-2 px-4 bg-primary text-white rounded-lg font-semibold">Project Docs</button>
                <button class="flex-1 py-2 px-4 bg-gray-100 text-gray-700 rounded-lg font-semibold">My Uploads</button>
            </div>

            <div class="space-y-4">
                <div class="bg-white border-2 border-gray-200 rounded-2xl p-4 hover:border-primary transition-all">
                    <div class="flex items-start space-x-4">
                        <div class="flex-shrink-0 w-12 h-12 bg-red-100 rounded-lg flex items-center justify-center">
                            <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                            </svg>
                        </div>
                        <div class="flex-1 min-w-0">
                            <h3 class="font-semibold text-gray-900 mb-1">Quotation</h3>
                            <p class="text-xs text-gray-500 mb-2">245 KB • Oct 10, 2025</p>
                            <div class="flex space-x-2">
                                <button class="text-xs px-3 py-1.5 bg-primary text-white rounded-lg font-medium">Download</button>
                                <button class="text-xs px-3 py-1.5 bg-gray-100 text-gray-700 rounded-lg font-medium">Share</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white border-2 border-gray-200 rounded-2xl p-4">
                    <div class="flex items-start space-x-4">
                        <div class="flex-shrink-0 w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                            <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                        </div>
                        <div class="flex-1">
                            <h3 class="font-semibold text-gray-900 mb-1">Purchase Order</h3>
                            <p class="text-xs text-gray-500 mb-2">128 KB • Oct 12, 2025</p>
                            <div class="flex space-x-2">
                                <button class="text-xs px-3 py-1.5 bg-primary text-white rounded-lg font-medium">Download</button>
                                <button class="text-xs px-3 py-1.5 bg-gray-100 text-gray-700 rounded-lg font-medium">Share</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white border-2 border-gray-200 rounded-2xl p-4">
                    <div class="flex items-start space-x-4">
                        <div class="flex-shrink-0 w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
                            <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                        </div>
                        <div class="flex-1">
                            <h3 class="font-semibold text-gray-900 mb-1">GST Invoice - Phase 1</h3>
                            <p class="text-xs text-gray-500 mb-2">156 KB • Oct 15, 2025</p>
                            <div class="flex space-x-2">
                                <button class="text-xs px-3 py-1.5 bg-primary text-white rounded-lg font-medium">Download</button>
                                <button class="text-xs px-3 py-1.5 bg-gray-100 text-gray-700 rounded-lg font-medium">Share</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <button class="w-full mt-6 py-4 border-2 border-dashed border-gray-300 rounded-2xl text-gray-500 font-medium hover:border-primary hover:text-primary transition-all">
                + Upload New Document
            </button>
        </div>

        <!-- Bottom Navigation -->
        <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg max-w-md mx-auto">
            <div class="flex items-center justify-around py-3 px-6">
                <a href="dashboard-main.html" class="flex flex-col items-center space-y-1 text-gray-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                    </svg>
                    <span class="text-xs">Home</span>
                </a>
                <a href="project-timeline.html" class="flex flex-col items-center space-y-1 text-gray-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                    </svg>
                    <span class="text-xs">Project</span>
                </a>
                <a href="notifications.html" class="flex flex-col items-center space-y-1 text-gray-400 relative">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                    </svg>
                    <span class="absolute top-0 right-2 w-2 h-2 bg-error rounded-full"></span>
                    <span class="text-xs">Alerts</span>
                </a>
                <a href="profile.html" class="flex flex-col items-center space-y-1 text-gray-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                    <span class="text-xs">Profile</span>
                </a>
            </div>
        </div>
    </div>
</body>
</html>

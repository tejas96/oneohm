<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phone Signup - OneOhm Solar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#76c044',
              secondary: '#0d74b8',
              tagline: '#025580',
            },
          },
        },
      };
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      body {
        font-family: 'Inter', sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-50">
    <!-- Mobile Container -->
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl">
      <!-- Header -->
      <div class="bg-gradient-to-r from-primary via-green-500 to-secondary px-6 py-6 pt-12">
        <!-- Back Button -->
        <a href="signup-selection.html" class="inline-flex items-center text-white mb-6">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 19l-7-7 7-7"
            ></path>
          </svg>
        </a>

        <!-- Title -->
        <h1 class="text-3xl font-bold text-white mb-2">Enter your phone</h1>
        <p class="text-green-100">We'll send you a verification code</p>
      </div>

      <!-- Content -->
      <div class="px-6 py-8">
        <!-- Phone Input Form -->
        <form id="phoneForm" class="space-y-6" onsubmit="handleSubmit(event)">
          <!-- Phone Number Input -->
          <div>
            <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">
              Phone Number *
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <span class="text-gray-500">+91</span>
              </div>
              <input
                type="tel"
                id="phone"
                name="phone"
                maxlength="10"
                pattern="[0-9]{10}"
                class="block w-full pl-14 pr-4 py-4 border-2 border-gray-200 rounded-2xl focus:ring-2 focus:ring-primary focus:border-primary transition-all text-lg"
                placeholder="98765 43210"
                required
              />
            </div>
            <p class="mt-2 text-xs text-gray-500">Enter 10 digit mobile number</p>
          </div>

          <!-- Terms Checkbox -->
          <div class="flex items-start space-x-3">
            <input
              type="checkbox"
              id="terms"
              name="terms"
              class="w-5 h-5 text-primary border-gray-300 rounded focus:ring-primary mt-0.5"
              required
            />
            <label for="terms" class="text-sm text-gray-600 leading-relaxed">
              I agree to the
              <a href="#" class="text-primary font-medium hover:underline">Terms of Service</a>
              and
              <a href="#" class="text-primary font-medium hover:underline">Privacy Policy</a>
            </label>
          </div>

          <!-- WhatsApp Consent -->
          <div class="flex items-start space-x-3">
            <input
              type="checkbox"
              id="whatsapp"
              name="whatsapp"
              class="w-5 h-5 text-success border-gray-300 rounded focus:ring-success mt-0.5"
              checked
            />
            <label for="whatsapp" class="text-sm text-gray-600 leading-relaxed">
              Send me project updates on WhatsApp
            </label>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            class="w-full bg-gradient-to-r from-primary via-green-500 to-secondary text-white font-semibold py-4 px-6 rounded-2xl shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all duration-200"
          >
            Send OTP
          </button>
        </form>

        <!-- Info Box -->
        <div class="mt-8 bg-blue-50 border border-blue-100 rounded-lg p-4">
          <div class="flex items-start space-x-3">
            <svg
              class="w-5 h-5 text-blue-600 flex-shrink-0 mt-0.5"
              fill="currentColor"
              viewBox="0 0 20 20"
            >
              <path
                fill-rule="evenodd"
                d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"
                clip-rule="evenodd"
              ></path>
            </svg>
            <p class="text-sm text-blue-800 leading-relaxed">
              <strong class="font-semibold">Keep your phone handy!</strong><br />
              You'll receive a 6-digit OTP via SMS to verify your number.
            </p>
          </div>
        </div>

        <!-- Help -->
        <div class="mt-8 text-center">
          <p class="text-sm text-gray-500">
            Having trouble?
            <a href="#" class="text-primary font-medium hover:underline">Contact Support</a>
          </p>
        </div>
      </div>
    </div>

    <script>
      function handleSubmit(event) {
        event.preventDefault();

        const phone = document.getElementById('phone').value;
        const terms = document.getElementById('terms').checked;

        if (phone.length !== 10) {
          alert('Please enter a valid 10-digit phone number');
          return;
        }

        if (!terms) {
          alert('Please accept the Terms of Service');
          return;
        }

        // In real app, this would call an API
        console.log('Sending OTP to: +91' + phone);

        // Redirect to OTP verification page
        window.location.href = 'signup-otp.html?phone=' + encodeURIComponent(phone);
      }

      // Auto-format phone number
      document.getElementById('phone').addEventListener('input', function (e) {
        this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10);
      });
    </script>
  </body>
</html>

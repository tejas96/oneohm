<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome - OneOhm Solar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#76c044',
              secondary: '#0d74b8',
              tagline: '#025580',
              success: '#76c044',
              warning: '#EAB308',
              error: '#DC2626',
            },
          },
        },
      };
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      body {
        font-family: 'Inter', sans-serif;
      }
      @keyframes pulse-slow {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.05);
          opacity: 0.9;
        }
      }
      .animate-pulse-slow {
        animation: pulse-slow 3s ease-in-out infinite;
      }
    </style>
  </head>
  <body class="bg-gradient-to-br from-green-50 via-blue-50 to-cyan-50 min-h-screen">
    <!-- Mobile Container -->
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl relative overflow-hidden">
      <!-- Background Pattern -->
      <div class="absolute inset-0 opacity-5">
        <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
              <path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="1" />
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#grid)" />
        </svg>
      </div>

      <!-- Content -->
      <div class="relative z-10 flex flex-col min-h-screen">
        <!-- Logo and Branding -->
        <div class="flex-1 flex flex-col items-center justify-center px-6 pt-20 pb-10">
          <!-- Sun Icon Logo -->
          <div class="mb-8 relative">
            <div
              class="w-32 h-32 bg-gradient-to-br from-primary via-secondary to-tagline rounded-full flex items-center justify-center shadow-2xl shadow-primary/20 animate-pulse-slow"
            >
              <svg
                class="w-16 h-16 text-white"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2.5"
                  d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
                ></path>
              </svg>
            </div>
            <!-- Rays around sun -->
            <div class="absolute inset-0 -z-10">
              <div
                class="absolute top-0 left-1/2 w-2 h-8 bg-gradient-to-t from-primary to-transparent -translate-x-1/2 -translate-y-8 rounded-full"
              ></div>
              <div
                class="absolute bottom-0 left-1/2 w-2 h-8 bg-gradient-to-b from-primary to-transparent -translate-x-1/2 translate-y-8 rounded-full"
              ></div>
              <div
                class="absolute left-0 top-1/2 w-8 h-2 bg-gradient-to-l from-primary to-transparent -translate-y-1/2 -translate-x-8 rounded-full"
              ></div>
              <div
                class="absolute right-0 top-1/2 w-8 h-2 bg-gradient-to-r from-primary to-transparent -translate-y-1/2 translate-x-8 rounded-full"
              ></div>
            </div>
          </div>

          <!-- Brand Name -->
          <h1 class="text-4xl font-bold text-gray-900 mb-2">
            One<span class="text-primary">Ohm</span>
          </h1>
          <p class="text-lg text-gray-600 font-medium mb-8">Solar EPC Platform</p>

          <!-- Tagline -->
          <div class="text-center mb-12">
            <h2 class="text-3xl font-bold text-tagline mb-3 leading-tight">
              Your Solar Journey,<br />
              <span class="text-primary">Simplified</span>
            </h2>
            <p class="text-gray-600 text-base leading-relaxed max-w-xs mx-auto mt-4">
              Track your solar project in real-time, manage leads, and get instant updates - all in
              one place.
            </p>
          </div>

          <!-- Key Features -->
          <div class="space-y-4 mb-12 w-full max-w-sm">
            <!-- Feature 1 -->
            <div
              class="flex items-center space-x-3 bg-white/50 backdrop-blur-sm p-3 rounded-lg border border-gray-100"
            >
              <div
                class="flex-shrink-0 w-10 h-10 bg-primary/10 rounded-full flex items-center justify-center"
              >
                <svg
                  class="w-5 h-5 text-primary"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
                  ></path>
                </svg>
              </div>
              <p class="text-sm text-gray-700 font-medium">Real-time project tracking</p>
            </div>

            <!-- Feature 2 -->
            <div
              class="flex items-center space-x-3 bg-white/50 backdrop-blur-sm p-3 rounded-lg border border-gray-100"
            >
              <div
                class="flex-shrink-0 w-10 h-10 bg-secondary/10 rounded-full flex items-center justify-center"
              >
                <svg
                  class="w-5 h-5 text-secondary"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"
                  ></path>
                </svg>
              </div>
              <p class="text-sm text-gray-700 font-medium">Manage leads on-the-go</p>
            </div>

            <!-- Feature 3 -->
            <div
              class="flex items-center space-x-3 bg-white/50 backdrop-blur-sm p-3 rounded-lg border border-gray-100"
            >
              <div
                class="flex-shrink-0 w-10 h-10 bg-success/10 rounded-full flex items-center justify-center"
              >
                <svg
                  class="w-5 h-5 text-success"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
                  ></path>
                </svg>
              </div>
              <p class="text-sm text-gray-700 font-medium">Instant notifications & updates</p>
            </div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="px-6 pb-10 space-y-3">
          <!-- Get Started Button -->
          <a href="onboarding.html" class="block w-full">
            <button
              class="w-full bg-gradient-to-r from-primary via-green-500 to-secondary text-white font-bold py-4 px-6 rounded-2xl shadow-lg shadow-primary/30 hover:shadow-xl hover:shadow-primary/40 transform hover:-translate-y-0.5 transition-all duration-200 flex items-center justify-center space-x-2"
            >
              <span class="text-lg">Get Started</span>
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2.5"
                  d="M13 7l5 5m0 0l-5 5m5-5H6"
                ></path>
              </svg>
            </button>
          </a>

          <!-- Login Button -->
          <a href="login.html" class="block w-full">
            <button
              class="w-full bg-white text-gray-700 font-semibold py-4 px-6 rounded-2xl border-2 border-gray-200 hover:border-secondary hover:text-secondary hover:bg-blue-50 transition-all duration-200"
            >
              Already have an account? <span class="text-secondary font-bold">Login</span>
            </button>
          </a>

          <!-- App Version -->
          <p class="text-center text-xs text-gray-400 mt-6">Version 1.0.0 • Phase 1</p>
        </div>
      </div>
    </div>
  </body>
</html>

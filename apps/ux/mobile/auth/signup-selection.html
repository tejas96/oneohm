<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - OneOhm Solar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#76c044',
              secondary: '#0d74b8',
              tagline: '#025580',
            },
          },
        },
      };
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      body {
        font-family: 'Inter', sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-50">
    <!-- Mobile Container -->
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl">
      <!-- Header -->
      <div
        class="bg-gradient-to-r from-primary via-green-500 to-secondary px-6 py-6 pt-12 shadow-lg"
      >
        <!-- Back Button -->
        <a href="welcome.html" class="inline-flex items-center text-white mb-6">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 19l-7-7 7-7"
            ></path>
          </svg>
        </a>

        <!-- Title -->
        <h1 class="text-3xl font-bold text-white mb-2">Create Account</h1>
        <p class="text-green-100">Choose your preferred signup method</p>
      </div>

      <!-- Content -->
      <div class="px-6 py-8">
        <!-- Signup Options -->
        <div class="space-y-4 mb-8">
          <!-- Phone Signup -->
          <a href="signup-phone.html" class="block">
            <button
              class="w-full bg-white border-2 border-gray-200 rounded-2xl p-6 hover:border-primary hover:shadow-lg hover:bg-green-50 transition-all duration-200 group"
            >
              <div class="flex items-center space-x-4">
                <!-- Icon -->
                <div
                  class="flex-shrink-0 w-14 h-14 bg-primary/10 rounded-full flex items-center justify-center group-hover:bg-primary/20 transition-colors"
                >
                  <svg
                    class="w-7 h-7 text-primary"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"
                    ></path>
                  </svg>
                </div>
                <!-- Text -->
                <div class="flex-1 text-left">
                  <h3 class="font-semibold text-gray-900 text-lg">Sign up with Phone</h3>
                  <p class="text-sm text-gray-500">Use your mobile number</p>
                </div>
                <!-- Arrow -->
                <svg
                  class="w-6 h-6 text-gray-400 group-hover:text-primary transition-colors"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M9 5l7 7-7 7"
                  ></path>
                </svg>
              </div>
            </button>
          </a>

          <!-- Google Signup -->
          <button
            class="w-full bg-white border-2 border-gray-200 rounded-2xl p-6 hover:border-secondary hover:shadow-lg hover:bg-blue-50 transition-all duration-200 group"
            onclick="alert('Google Sign-In will be implemented in backend integration')"
          >
            <div class="flex items-center space-x-4">
              <!-- Icon -->
              <div
                class="flex-shrink-0 w-14 h-14 bg-blue-50 rounded-full flex items-center justify-center group-hover:bg-blue-100 transition-colors"
              >
                <svg class="w-7 h-7" viewBox="0 0 24 24">
                  <path
                    fill="#4285F4"
                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                  />
                  <path
                    fill="#34A853"
                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                  />
                  <path
                    fill="#FBBC05"
                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                  />
                  <path
                    fill="#EA4335"
                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                  />
                </svg>
              </div>
              <!-- Text -->
              <div class="flex-1 text-left">
                <h3 class="font-semibold text-gray-900 text-lg">Sign up with Google</h3>
                <p class="text-sm text-gray-500">Quick signup with Gmail</p>
              </div>
              <!-- Arrow -->
              <svg
                class="w-6 h-6 text-gray-400 group-hover:text-secondary transition-colors"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 5l7 7-7 7"
                ></path>
              </svg>
            </div>
          </button>
        </div>

        <!-- Divider -->
        <div class="relative mb-8">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-200"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-4 bg-white text-gray-500">Or</span>
          </div>
        </div>

        <!-- Login Link -->
        <div class="text-center">
          <p class="text-gray-600 mb-3">Already have an account?</p>
          <a
            href="login.html"
            class="inline-flex items-center text-primary font-semibold hover:underline"
          >
            <span>Login to your account</span>
            <svg class="w-5 h-5 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13 7l5 5m0 0l-5 5m5-5H6"
              ></path>
            </svg>
          </a>
        </div>

        <!-- Terms & Privacy -->
        <div class="mt-12 text-center">
          <p class="text-xs text-gray-500 leading-relaxed">
            By signing up, you agree to our
            <a href="#" class="text-primary hover:underline">Terms of Service</a>
            and
            <a href="#" class="text-primary hover:underline">Privacy Policy</a>
          </p>
        </div>
      </div>
    </div>
  </body>
</html>

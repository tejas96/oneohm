<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Complete Profile - OneOhm Solar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#76c044',
              secondary: '#0d74b8',
              tagline: '#025580',
            },
          },
        },
      };
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      body {
        font-family: 'Inter', sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-50">
    <!-- Mobile Container -->
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl">
      <!-- Header -->
      <div class="bg-gradient-to-r from-primary via-green-500 to-secondary px-6 py-6 pt-12">
        <!-- Progress Indicator -->
        <div class="flex items-center justify-center space-x-2 mb-6">
          <div class="w-3 h-3 bg-white rounded-full"></div>
          <div class="w-3 h-3 bg-white rounded-full"></div>
          <div class="w-3 h-3 bg-white/50 rounded-full"></div>
        </div>

        <!-- Title -->
        <h1 class="text-3xl font-bold text-white mb-2">Complete Your Profile</h1>
        <p class="text-green-100">Tell us a bit about yourself</p>
      </div>

      <!-- Content -->
      <div class="px-6 py-8">
        <!-- Profile Form -->
        <form id="profileForm" class="space-y-6" onsubmit="handleSubmit(event)">
          <!-- Full Name -->
          <div>
            <label for="fullName" class="block text-sm font-medium text-gray-700 mb-2">
              Full Name *
            </label>
            <input
              type="text"
              id="fullName"
              name="fullName"
              class="block w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:ring-2 focus:ring-primary focus:border-primary transition-all"
              placeholder="Enter your full name"
              required
              minlength="3"
            />
          </div>

          <!-- Email -->
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
              Email Address *
            </label>
            <input
              type="email"
              id="email"
              name="email"
              class="block w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:ring-2 focus:ring-primary focus:border-primary transition-all"
              placeholder="your.email@example.com"
              required
            />
            <p class="mt-2 text-xs text-gray-500">We'll send project updates to this email</p>
          </div>

          <!-- Role Selection -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-3"> I am a * </label>
            <div class="space-y-3">
              <!-- Customer -->
              <label
                class="flex items-center p-4 border-2 border-gray-200 rounded-2xl cursor-pointer hover:border-primary transition-all"
              >
                <input
                  type="radio"
                  name="role"
                  value="customer"
                  class="w-5 h-5 text-primary focus:ring-primary"
                  checked
                />
                <div class="ml-3 flex-1">
                  <div class="font-semibold text-gray-900">Customer</div>
                  <div class="text-sm text-gray-500">I want to install solar panels</div>
                </div>
                <svg
                  class="w-6 h-6 text-primary"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
                  ></path>
                </svg>
              </label>

              <!-- Field Worker -->
              <label
                class="flex items-center p-4 border-2 border-gray-200 rounded-2xl cursor-pointer hover:border-secondary transition-all"
              >
                <input
                  type="radio"
                  name="role"
                  value="field_worker"
                  class="w-5 h-5 text-secondary focus:ring-secondary"
                />
                <div class="ml-3 flex-1">
                  <div class="font-semibold text-gray-900">Field Worker</div>
                  <div class="text-sm text-gray-500">I work for OneOhm (requires approval)</div>
                </div>
                <svg
                  class="w-6 h-6 text-secondary"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                  ></path>
                </svg>
              </label>
            </div>
          </div>

          <!-- Create Account Button -->
          <button
            type="submit"
            class="w-full bg-gradient-to-r from-primary via-green-500 to-secondary text-white font-semibold py-4 px-6 rounded-2xl shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all duration-200"
          >
            Create Account
          </button>
        </form>

        <!-- Info Note -->
        <div class="mt-6 bg-blue-50 border border-blue-100 rounded-lg p-4">
          <div class="flex items-start space-x-3">
            <svg
              class="w-5 h-5 text-blue-600 flex-shrink-0 mt-0.5"
              fill="currentColor"
              viewBox="0 0 20 20"
            >
              <path
                fill-rule="evenodd"
                d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"
                clip-rule="evenodd"
              ></path>
            </svg>
            <p class="text-sm text-blue-800 leading-relaxed">
              <strong class="font-semibold">Field Workers:</strong> Your account will be reviewed
              and activated by an admin within 24 hours.
            </p>
          </div>
        </div>
      </div>
    </div>

    <script>
      function handleSubmit(event) {
        event.preventDefault();

        const fullName = document.getElementById('fullName').value;
        const email = document.getElementById('email').value;
        const role = document.querySelector('input[name="role"]:checked').value;

        // In real app, this would call an API to create user
        console.log('Creating account:', { fullName, email, role });

        // Mock account creation
        const userData = {
          fullName,
          email,
          role,
          phone: '+91 98765 43210', // From previous step
          createdAt: new Date().toISOString(),
        };

        // Save to localStorage for demo
        localStorage.setItem('user', JSON.stringify(userData));

        // Redirect based on role
        if (role === 'customer') {
          window.location.href = '../customer/dashboard-main.html';
        } else if (role === 'field_worker') {
          // Show pending approval message
          alert(
            'Account created! Your field worker access is pending admin approval. You will be notified via email once approved.',
          );
          window.location.href = 'welcome.html';
        }
      }

      // Real-time validation
      document.getElementById('fullName').addEventListener('input', (e) => {
        if (e.target.value.length < 3 && e.target.value.length > 0) {
          e.target.classList.add('border-red-300');
        } else {
          e.target.classList.remove('border-red-300');
        }
      });

      document.getElementById('email').addEventListener('input', (e) => {
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailPattern.test(e.target.value) && e.target.value.length > 0) {
          e.target.classList.add('border-red-300');
        } else {
          e.target.classList.remove('border-red-300');
        }
      });
    </script>
  </body>
</html>

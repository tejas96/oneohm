<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OneOhm Solar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#76c044',
                        secondary: '#0d74b8',
                        tagline: '#025580',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Mobile Container -->
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-primary via-green-500 to-secondary px-6 py-6 pt-12 shadow-lg">
            <!-- Back Button -->
            <a href="welcome.html" class="inline-flex items-center text-white mb-6">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
            </a>

            <!-- Logo -->
            <div class="flex items-center space-x-3 mb-4">
                <div class="w-14 h-14 bg-white rounded-2xl flex items-center justify-center shadow-md">
                    <svg class="w-8 h-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-3xl font-bold text-white">Login</h1>
                </div>
            </div>
            <p class="text-green-100">Welcome back! Please login to continue</p>
        </div>

        <!-- Content -->
        <div class="px-6 py-8">
            
            <!-- Login Form -->
            <form id="loginForm" class="space-y-6" onsubmit="handleSubmit(event)">
                
                <!-- Phone/Email Input -->
                <div>
                    <label for="identifier" class="block text-sm font-medium text-gray-700 mb-2">
                        Phone Number or Email *
                    </label>
                    <input 
                        type="text" 
                        id="identifier" 
                        name="identifier" 
                        class="block w-full px-4 py-4 border-2 border-gray-200 rounded-2xl focus:ring-2 focus:ring-primary focus:border-primary transition-all text-lg"
                        placeholder="Enter phone or email"
                        required
                    />
                </div>

                <!-- Login Options Tabs -->
                <div class="flex space-x-2 bg-gray-100 p-1 rounded-lg">
                    <button 
                        type="button" 
                        class="flex-1 py-2 px-4 rounded-md text-sm font-medium transition-all login-tab active" 
                        data-tab="otp"
                    >
                        Login with OTP
                    </button>
                    <button 
                        type="button" 
                        class="flex-1 py-2 px-4 rounded-md text-sm font-medium transition-all login-tab" 
                        data-tab="google"
                    >
                        Login with Google
                    </button>
                </div>

                <!-- OTP Login Content -->
                <div id="otp-content" class="tab-content">
                    <button 
                        type="submit" 
                        class="w-full bg-gradient-to-r from-primary via-green-500 to-secondary text-white font-bold py-4 px-6 rounded-2xl shadow-lg shadow-primary/30 hover:shadow-xl hover:shadow-primary/40 transform hover:-translate-y-0.5 transition-all duration-200"
                    >
                        Send OTP
                    </button>
                </div>

                <!-- Google Login Content -->
                <div id="google-content" class="tab-content hidden">
                    <button 
                        type="button" 
                        onclick="alert('Google Sign-In will be implemented in backend integration')"
                        class="w-full bg-white border-2 border-gray-200 text-gray-700 font-semibold py-4 px-6 rounded-2xl hover:border-secondary hover:shadow-lg hover:bg-blue-50 transition-all duration-200 flex items-center justify-center space-x-3"
                    >
                        <svg class="w-6 h-6" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        <span>Continue with Google</span>
                    </button>
                </div>

            </form>

            <!-- Info Box -->
            <div class="mt-6 bg-blue-50 border-2 border-secondary/20 rounded-2xl p-4">
                <div class="flex items-start space-x-3">
                    <svg class="w-5 h-5 text-secondary flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
                    </svg>
                    <p class="text-sm text-tagline leading-relaxed">
                        <strong class="font-semibold">First time here?</strong><br>
                        Create a new account to get started with your solar journey.
                    </p>
                </div>
            </div>

            <!-- Divider -->
            <div class="relative my-8">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-200"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-4 bg-white text-gray-500">Or</span>
                </div>
            </div>

            <!-- Signup Link -->
            <div class="text-center">
                <p class="text-gray-600 mb-3">Don't have an account?</p>
                <a href="signup-selection.html" class="inline-flex items-center text-primary font-semibold hover:underline">
                    <span>Create new account</span>
                    <svg class="w-5 h-5 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
                    </svg>
                </a>
            </div>

            <!-- Help -->
            <div class="mt-8 text-center">
                <p class="text-sm text-gray-500">
                    Need help logging in? 
                    <a href="#" class="text-primary font-medium hover:underline">Contact Support</a>
                </p>
            </div>

        </div>
    </div>

    <script>
        // Tab Switching
        const tabs = document.querySelectorAll('.login-tab');
        const otpContent = document.getElementById('otp-content');
        const googleContent = document.getElementById('google-content');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                // Remove active class from all tabs
                tabs.forEach(t => {
                    t.classList.remove('active', 'bg-white', 'text-primary', 'shadow-sm');
                    t.classList.add('text-gray-600');
                });
                
                // Add active class to clicked tab
                tab.classList.add('active', 'bg-white', 'text-primary', 'shadow-sm');
                tab.classList.remove('text-gray-600');
                
                // Show/hide content
                const tabType = tab.getAttribute('data-tab');
                if (tabType === 'otp') {
                    otpContent.classList.remove('hidden');
                    googleContent.classList.add('hidden');
                } else {
                    otpContent.classList.add('hidden');
                    googleContent.classList.remove('hidden');
                }
            });
        });

        // Initialize first tab as active
        tabs[0].classList.add('bg-white', 'text-primary', 'shadow-sm');
        tabs[0].classList.remove('text-gray-600');

        // Form submission
        function handleSubmit(event) {
            event.preventDefault();
            
            const identifier = document.getElementById('identifier').value;
            
            if (!identifier) {
                alert('Please enter your phone number or email');
                return;
            }
            
            // In real app, this would call an API
            console.log('Sending OTP to:', identifier);
            
            // Mock login - redirect to OTP verification
            window.location.href = 'login-otp.html?identifier=' + encodeURIComponent(identifier);
        }

        // Auto-detect if input is phone or email
        document.getElementById('identifier').addEventListener('input', (e) => {
            const value = e.target.value;
            // If starts with numbers, format as phone
            if (/^\d/.test(value)) {
                e.target.type = 'tel';
                e.target.placeholder = '+91 98765 43210';
            } else if (value.includes('@')) {
                e.target.type = 'email';
                e.target.placeholder = 'your.email@example.com';
            }
        });
    </script>
</body>
</html>

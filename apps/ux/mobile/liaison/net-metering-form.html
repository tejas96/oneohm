<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Net Metering Application - OneOhm Solar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#76c044',
              secondary: '#0d74b8',
              tagline: '#025580',
            },
          },
        },
      };
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      body {
        font-family: 'Inter', sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-50">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl pb-8">
      <div class="bg-gradient-to-r from-purple-600 to-indigo-700 px-6 py-6 pt-12">
        <a href="dashboard-liaison.html" class="inline-flex items-center text-white mb-6">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 19l-7-7 7-7"
            ></path>
          </svg>
        </a>
        <h1 class="text-3xl font-bold text-white mb-2">Net Metering</h1>
        <p class="text-purple-100">Application Form</p>
      </div>

      <div class="px-6 py-6">
        <!-- Project Selection -->
        <div class="mb-6">
          <label class="block text-sm font-bold text-gray-900 mb-3">Select Project</label>
          <select
            class="w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:border-primary focus:outline-none"
          >
            <option>Select project</option>
            <option>PRJ-2025-089 - Amit Kumar</option>
            <option>PRJ-2025-092 - Sunita Reddy</option>
          </select>
        </div>

        <!-- Customer Details -->
        <div class="bg-blue-50 border-2 border-blue-200 rounded-2xl p-4 mb-6">
          <h3 class="font-bold text-gray-900 mb-3">Customer Info</h3>
          <div class="space-y-2 text-sm">
            <div class="flex justify-between">
              <span class="text-gray-600">Name</span>
              <span class="font-semibold text-gray-900">Amit Kumar</span>
            </div>
            <div class="flex justify-between">
              <span class="text-gray-600">System Size</span>
              <span class="font-semibold text-gray-900">8 kW</span>
            </div>
            <div class="flex justify-between">
              <span class="text-gray-600">Location</span>
              <span class="font-semibold text-gray-900">Viman Nagar, Pune</span>
            </div>
          </div>
        </div>

        <!-- Consumer Details -->
        <div class="mb-6">
          <label class="block text-sm font-bold text-gray-900 mb-3">Consumer Details</label>
          <div class="space-y-3">
            <input
              type="text"
              placeholder="Consumer Number"
              class="w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:border-primary focus:outline-none"
            />
            <input
              type="text"
              placeholder="Consumer Name (As per MSEDCL)"
              class="w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:border-primary focus:outline-none"
            />
            <input
              type="text"
              placeholder="Billing Address"
              class="w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:border-primary focus:outline-none"
            />
            <select
              class="w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:border-primary focus:outline-none"
            >
              <option>Select Consumer Category</option>
              <option>Residential</option>
              <option>Commercial</option>
              <option>Industrial</option>
            </select>
            <input
              type="number"
              step="0.1"
              placeholder="Sanctioned Load (kW)"
              class="w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:border-primary focus:outline-none"
            />
          </div>
        </div>

        <!-- System Details -->
        <div class="mb-6">
          <label class="block text-sm font-bold text-gray-900 mb-3">System Details</label>
          <div class="space-y-3">
            <input
              type="number"
              step="0.1"
              placeholder="Solar System Capacity (kW)"
              class="w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:border-primary focus:outline-none"
            />
            <input
              type="text"
              placeholder="Inverter Make & Model"
              class="w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:border-primary focus:outline-none"
            />
            <input
              type="text"
              placeholder="Solar Panel Make & Model"
              class="w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:border-primary focus:outline-none"
            />
            <input
              type="date"
              placeholder="Expected Commissioning Date"
              class="w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:border-primary focus:outline-none"
            />
          </div>
        </div>

        <!-- Required Documents -->
        <div class="mb-6">
          <label class="block text-sm font-bold text-gray-900 mb-3">📎 Required Documents</label>
          <div class="space-y-3">
            <div
              class="border-2 border-gray-200 rounded-2xl p-4 hover:border-primary cursor-pointer"
            >
              <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                  <div class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center">
                    <svg
                      class="w-5 h-5 text-blue-600"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
                      ></path>
                    </svg>
                  </div>
                  <div>
                    <p class="font-semibold text-sm text-gray-900">Electricity Bill</p>
                    <p class="text-xs text-gray-500">Latest bill copy</p>
                  </div>
                </div>
                <svg
                  class="w-5 h-5 text-gray-400"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
                  ></path>
                </svg>
              </div>
            </div>

            <div
              class="border-2 border-gray-200 rounded-2xl p-4 hover:border-primary cursor-pointer"
            >
              <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                  <div class="w-10 h-10 bg-green-100 rounded-lg flex items-center justify-center">
                    <svg
                      class="w-5 h-5 text-green-600"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2"
                      ></path>
                    </svg>
                  </div>
                  <div>
                    <p class="font-semibold text-sm text-gray-900">ID Proof</p>
                    <p class="text-xs text-gray-500">Aadhar/PAN</p>
                  </div>
                </div>
                <svg
                  class="w-5 h-5 text-gray-400"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
                  ></path>
                </svg>
              </div>
            </div>

            <div
              class="border-2 border-gray-200 rounded-2xl p-4 hover:border-primary cursor-pointer"
            >
              <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                  <div class="w-10 h-10 bg-purple-100 rounded-lg flex items-center justify-center">
                    <svg
                      class="w-5 h-5 text-purple-600"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"
                      ></path>
                    </svg>
                  </div>
                  <div>
                    <p class="font-semibold text-sm text-gray-900">Property Document</p>
                    <p class="text-xs text-gray-500">Ownership proof</p>
                  </div>
                </div>
                <svg
                  class="w-5 h-5 text-gray-400"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
                  ></path>
                </svg>
              </div>
            </div>

            <div
              class="border-2 border-gray-200 rounded-2xl p-4 hover:border-primary cursor-pointer"
            >
              <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                  <div class="w-10 h-10 bg-orange-100 rounded-lg flex items-center justify-center">
                    <svg
                      class="w-5 h-5 text-primary"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
                      ></path>
                    </svg>
                  </div>
                  <div>
                    <p class="font-semibold text-sm text-gray-900">System Datasheet</p>
                    <p class="text-xs text-gray-500">Technical specs</p>
                  </div>
                </div>
                <svg
                  class="w-5 h-5 text-gray-400"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
                  ></path>
                </svg>
              </div>
            </div>
          </div>
        </div>

        <!-- Additional Notes -->
        <div class="mb-6">
          <label class="block text-sm font-bold text-gray-900 mb-3">Additional Notes</label>
          <textarea
            rows="3"
            placeholder="Any additional information..."
            class="w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:border-primary focus:outline-none resize-none"
          ></textarea>
        </div>

        <!-- Submit Button -->
        <button
          class="w-full py-4 bg-gradient-to-r from-purple-600 to-indigo-700 text-white rounded-2xl font-bold text-lg shadow-lg hover:shadow-xl transition-all"
        >
          Submit Application
        </button>
      </div>
    </div>
  </body>
</html>

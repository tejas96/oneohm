<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material Request - OneOhm Solar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#76c044',
                        secondary: '#0d74b8',
                        tagline: '#025580',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl pb-20">
        <div class="bg-gradient-to-r from-primary via-green-500 to-secondary px-6 py-6 pt-12">
            <a href="dashboard-engineer.html" class="inline-flex items-center text-white mb-6">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
            </a>
            <h1 class="text-3xl font-bold text-white mb-2">Material Request</h1>
            <p class="text-green-100">Request materials for project</p>
        </div>

        <div class="px-6 py-6">
            <!-- Project Selection -->
            <div class="mb-6">
                <label class="block text-sm font-bold text-gray-900 mb-3">Project</label>
                <select class="w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:border-primary focus:outline-none">
                    <option>Select project</option>
                    <option>PRJ-2025-089 - Sunita Reddy</option>
                    <option>PRJ-2025-092 - Amit Kumar</option>
                </select>
            </div>

            <!-- Material Items -->
            <div class="mb-6">
                <div class="flex items-center justify-between mb-3">
                    <label class="block text-sm font-bold text-gray-900">Material Items</label>
                    <button class="text-primary font-semibold text-sm">+ Add Item</button>
                </div>

                <div class="space-y-3">
                    <!-- Item 1 -->
                    <div class="bg-white border-2 border-gray-200 rounded-2xl p-4">
                        <div class="grid grid-cols-2 gap-3 mb-3">
                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-2">Category</label>
                                <select class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                                    <option>Solar Panels</option>
                                    <option>Inverters</option>
                                    <option>Cables</option>
                                    <option>Connectors</option>
                                    <option>Mounting</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-2">Item</label>
                                <select class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                                    <option>Tata 540W Panel</option>
                                    <option>Adani 550W Panel</option>
                                </select>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-2">Quantity</label>
                                <input type="number" value="15" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-2">Unit</label>
                                <select class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                                    <option>Pieces</option>
                                    <option>Meters</option>
                                    <option>Kg</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Item 2 -->
                    <div class="bg-white border-2 border-gray-200 rounded-2xl p-4">
                        <div class="grid grid-cols-2 gap-3 mb-3">
                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-2">Category</label>
                                <select class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                                    <option>Cables</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-2">Item</label>
                                <select class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                                    <option>DC Cable 6mm²</option>
                                    <option>AC Cable 10mm²</option>
                                </select>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-2">Quantity</label>
                                <input type="number" value="100" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-2">Unit</label>
                                <select class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                                    <option>Meters</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Priority -->
            <div class="mb-6">
                <label class="block text-sm font-bold text-gray-900 mb-3">Priority</label>
                <div class="grid grid-cols-3 gap-3">
                    <label class="relative cursor-pointer">
                        <input type="radio" name="priority" class="peer sr-only" checked>
                        <div class="p-3 border-2 border-gray-200 rounded-lg peer-checked:border-green-500 peer-checked:bg-green-50 text-center">
                            <p class="font-semibold text-sm">Low</p>
                        </div>
                    </label>
                    <label class="relative cursor-pointer">
                        <input type="radio" name="priority" class="peer sr-only">
                        <div class="p-3 border-2 border-gray-200 rounded-lg peer-checked:border-yellow-500 peer-checked:bg-yellow-50 text-center">
                            <p class="font-semibold text-sm">Medium</p>
                        </div>
                    </label>
                    <label class="relative cursor-pointer">
                        <input type="radio" name="priority" class="peer sr-only">
                        <div class="p-3 border-2 border-gray-200 rounded-lg peer-checked:border-red-500 peer-checked:bg-red-50 text-center">
                            <p class="font-semibold text-sm">Urgent</p>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Required Date -->
            <div class="mb-6">
                <label class="block text-sm font-bold text-gray-900 mb-3">Required By</label>
                <input type="date" class="w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:border-primary focus:outline-none">
            </div>

            <!-- Notes -->
            <div class="mb-6">
                <label class="block text-sm font-bold text-gray-900 mb-3">Additional Notes</label>
                <textarea rows="3" placeholder="Any specific requirements..." class="w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:border-primary focus:outline-none resize-none"></textarea>
            </div>

            <!-- Submit Button -->
            <button class="w-full py-4 bg-gradient-to-r from-primary via-green-500 to-secondary text-white rounded-2xl font-bold text-lg shadow-lg">
                Submit Request
            </button>
        </div>

        <!-- Bottom Navigation -->
        <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg max-w-md mx-auto">
            <div class="flex items-center justify-around py-3 px-6">
                <a href="dashboard-engineer.html" class="flex flex-col items-center space-y-1 text-gray-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                    </svg>
                    <span class="text-xs">Home</span>
                </a>
                <a href="projects-engineer.html" class="flex flex-col items-center space-y-1 text-gray-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                    </svg>
                    <span class="text-xs">Projects</span>
                </a>
                <a href="inventory-engineer.html" class="flex flex-col items-center space-y-1 text-primary">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M3 1a1 1 0 000 2h1.22l.305 1.222a.997.997 0 00.01.042l1.358 5.43-.893.892C3.74 11.846 4.632 14 6.414 14H15a1 1 0 000-2H6.414l1-1H14a1 1 0 00.894-.553l3-6A1 1 0 0017 3H6.28l-.31-1.243A1 1 0 005 1H3zM16 16.5a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0zM6.5 18a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"></path>
                    </svg>
                    <span class="text-xs font-semibold">Request</span>
                </a>
                <a href="profile-engineer.html" class="flex flex-col items-center space-y-1 text-gray-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                    <span class="text-xs">Profile</span>
                </a>
            </div>
        </div>
    </div>
</body>
</html>

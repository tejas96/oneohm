<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lead Created | OneOhm Solar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#76c044',
                        'primary-dark': '#5ea031',
                        secondary: '#0d74b8',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #f8fdf5 0%, #e8f5e0 50%, #f0f9ff 100%);
        }
        .success-ring {
            animation: ringPulse 2s ease-out infinite;
        }
        @keyframes ringPulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 0.4; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        .checkmark {
            animation: checkDraw 0.6s ease-out 0.3s both;
        }
        @keyframes checkDraw {
            0% { stroke-dashoffset: 50; }
            100% { stroke-dashoffset: 0; }
        }
        .fade-in { animation: fadeIn 0.5s ease-out; }
        .fade-in-delay { animation: fadeIn 0.5s ease-out 0.4s both; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .btn-gradient {
            background: linear-gradient(135deg, #76c044 0%, #5ea031 50%, #0d74b8 100%);
            background-size: 200% 200%;
        }
        .action-card {
            transition: all 0.2s ease;
        }
        .action-card:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="min-h-screen">
    <div class="max-w-md mx-auto min-h-screen flex flex-col">
        
        <!-- Main Content -->
        <main class="flex-1 flex flex-col items-center justify-center px-6 py-12">
            
            <!-- Success Animation -->
            <div class="relative mb-8 fade-in">
                <div class="success-ring absolute inset-0 w-32 h-32 rounded-full border-4 border-primary/30"></div>
                <div class="w-32 h-32 rounded-full bg-gradient-to-br from-primary to-primary-dark flex items-center justify-center shadow-xl shadow-primary/30">
                    <svg class="w-16 h-16 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path class="checkmark" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" stroke-dasharray="50" d="M5 13l4 4L19 7"/>
                    </svg>
                </div>
            </div>

            <!-- Title -->
            <div class="text-center mb-8 fade-in-delay">
                <h1 class="text-3xl font-bold text-gray-900 mb-2">Lead Created!</h1>
                <p class="text-gray-500">
                    <span id="leadName" class="font-semibold text-gray-700">Customer</span> has been added
                </p>
            </div>

            <!-- Lead Summary Card -->
            <div class="w-full bg-white rounded-3xl shadow-lg p-6 mb-8 fade-in-delay">
                <div class="flex items-center gap-4 mb-4">
                    <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-primary to-secondary flex items-center justify-center">
                        <span id="avatarInitials" class="text-white font-bold text-lg">--</span>
                    </div>
                    <div class="flex-1">
                        <p id="displayName" class="font-bold text-gray-900 text-lg">--</p>
                        <p id="displayLocation" class="text-sm text-gray-500">--</p>
                    </div>
                    <div class="px-3 py-1 bg-yellow-100 text-yellow-700 text-xs font-semibold rounded-full">
                        New Lead
                    </div>
                </div>
                <div class="flex items-center justify-between pt-4 border-t border-gray-100">
                    <div>
                        <p class="text-xs text-gray-500">Property</p>
                        <p id="displayProperty" class="font-semibold text-gray-800">--</p>
                    </div>
                    <div>
                        <p class="text-xs text-gray-500">Est. System</p>
                        <p id="displaySize" class="font-semibold text-primary">~3 KW</p>
                    </div>
                    <div>
                        <p class="text-xs text-gray-500">Status</p>
                        <p class="font-semibold text-gray-800">Part 1 Done</p>
                    </div>
                </div>
            </div>

            <!-- Action Cards -->
            <div class="w-full space-y-3 fade-in-delay">
                
                <!-- Continue to Part 2 (Recommended) -->
                <button onclick="goToPart2()" class="action-card w-full bg-white rounded-2xl p-4 border-2 border-primary shadow-sm flex items-center gap-4 text-left">
                    <div class="w-12 h-12 rounded-xl bg-primary/10 flex items-center justify-center flex-shrink-0">
                        <svg class="w-6 h-6 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
                        </svg>
                    </div>
                    <div class="flex-1">
                        <div class="flex items-center gap-2">
                            <p class="font-semibold text-gray-900">Add Technical Details</p>
                            <span class="px-2 py-0.5 bg-primary/10 text-primary text-xs font-semibold rounded-full">Recommended</span>
                        </div>
                        <p class="text-sm text-gray-500">Complete Part 2 for accurate quote</p>
                    </div>
                    <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </button>

                <!-- Generate Quick Quote -->
                <button onclick="generateQuote()" class="action-card w-full bg-white rounded-2xl p-4 border border-gray-200 shadow-sm flex items-center gap-4 text-left">
                    <div class="w-12 h-12 rounded-xl bg-secondary/10 flex items-center justify-center flex-shrink-0">
                        <svg class="w-6 h-6 text-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
                        </svg>
                    </div>
                    <div class="flex-1">
                        <p class="font-semibold text-gray-900">Generate Quick Quote</p>
                        <p class="text-sm text-gray-500">Based on current information</p>
                    </div>
                    <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </button>

                <!-- Go to Dashboard -->
                <button onclick="goToDashboard()" class="action-card w-full bg-gray-50 rounded-2xl p-4 flex items-center gap-4 text-left">
                    <div class="w-12 h-12 rounded-xl bg-gray-200 flex items-center justify-center flex-shrink-0">
                        <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                        </svg>
                    </div>
                    <div class="flex-1">
                        <p class="font-semibold text-gray-700">Go to Dashboard</p>
                        <p class="text-sm text-gray-500">Complete Part 2 later</p>
                    </div>
                    <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </button>

            </div>

        </main>

        <!-- Add Another Button -->
        <footer class="p-6 text-center">
            <button onclick="addAnother()" class="text-primary font-semibold hover:underline flex items-center justify-center gap-2 mx-auto">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
                </svg>
                Add Another Lead
            </button>
        </footer>

    </div>

    <script>
        function loadLeadData() {
            const lead = JSON.parse(localStorage.getItem('createdLead') || '{}');
            
            if (lead.fullName) {
                document.getElementById('leadName').textContent = lead.fullName;
                document.getElementById('displayName').textContent = lead.fullName;
                const initials = lead.fullName.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
                document.getElementById('avatarInitials').textContent = initials;
            }
            
            if (lead.city || lead.state) {
                document.getElementById('displayLocation').textContent = 
                    [lead.city, lead.state].filter(Boolean).join(', ');
            }
            
            if (lead.propertyType) {
                const labels = {
                    residential: 'Residential',
                    apartment: 'Apartment',
                    commercial: 'Commercial',
                    industrial: 'Industrial',
                    agricultural: 'Agricultural'
                };
                document.getElementById('displayProperty').textContent = labels[lead.propertyType] || lead.propertyType;
            }
            
            // Calculate size
            const bill = parseInt(lead.monthlyBill) || 0;
            const area = parseInt(lead.roofArea) || 0;
            if (bill || area) {
                const sizeByBill = bill / 1000;
                const sizeByArea = area / 100;
                const size = Math.max(1, Math.round(Math.min(sizeByBill || 999, sizeByArea || 999)));
                document.getElementById('displaySize').textContent = '~' + size + ' KW';
            }
        }

        function goToPart2() {
            window.location.href = 'part2-technical.html';
        }

        function generateQuote() {
            // Navigate to Part 2 technical assessment
            window.location.href = 'part2-technical.html';
        }

        function goToDashboard() {
            window.location.href = '../dashboard-fieldworker.html';
        }

        function addAnother() {
            // Clear lead data and start fresh
            localStorage.removeItem('createdLead');
            window.location.href = 'part1-contact.html';
        }

        window.addEventListener('load', loadLeadData);
    </script>
</body>
</html>

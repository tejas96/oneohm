<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>New Lead - Contact | OneOhm Solar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#76c044',
              'primary-dark': '#5ea031',
              secondary: '#0d74b8',
              'secondary-dark': '#025580',
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

      * {
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font-family: 'Inter', system-ui, sans-serif;
        background: linear-gradient(135deg, #f8fdf5 0%, #f0f9ff 100%);
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      .input-focus:focus {
        box-shadow: 0 0 0 3px rgba(118, 192, 68, 0.15);
      }

      .btn-gradient {
        background: linear-gradient(135deg, #76c044 0%, #5ea031 50%, #0d74b8 100%);
        background-size: 200% 200%;
        animation: gradientShift 3s ease infinite;
      }

      @keyframes gradientShift {
        0%,
        100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }

      .progress-dot {
        transition: all 0.3s ease;
      }

      .progress-dot.active {
        transform: scale(1.2);
      }

      .fade-in {
        animation: fadeIn 0.4s ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .input-label {
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.025em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body class="min-h-screen">
    <div class="max-w-md mx-auto min-h-screen flex flex-col">
      <!-- Floating Header -->
      <header class="sticky top-0 z-50 px-4 pt-4">
        <div class="glass-card rounded-2xl px-4 py-3 flex items-center justify-between shadow-lg">
          <button
            onclick="history.back()"
            class="p-2 -ml-2 rounded-xl hover:bg-gray-100 transition-colors"
          >
            <svg
              class="w-6 h-6 text-gray-700"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 19l-7-7 7-7"
              />
            </svg>
          </button>

          <!-- Progress Indicator -->
          <div class="flex items-center gap-2">
            <div class="flex items-center gap-1.5">
              <div class="progress-dot active w-2.5 h-2.5 rounded-full bg-primary"></div>
              <div class="progress-dot w-2 h-2 rounded-full bg-gray-300"></div>
              <div class="progress-dot w-2 h-2 rounded-full bg-gray-300"></div>
            </div>
            <span class="text-xs font-medium text-gray-500 ml-2">Part 1 of 2</span>
          </div>

          <button
            onclick="saveDraft()"
            class="text-sm font-semibold text-primary hover:text-primary-dark transition-colors"
          >
            Save
          </button>
        </div>
      </header>

      <!-- Main Content -->
      <main class="flex-1 px-6 py-8 fade-in">
        <!-- Title Section -->
        <div class="mb-8">
          <div class="inline-flex items-center gap-2 px-3 py-1.5 bg-primary/10 rounded-full mb-4">
            <div class="w-2 h-2 rounded-full bg-primary animate-pulse"></div>
            <span class="text-xs font-semibold text-primary uppercase tracking-wide">New Lead</span>
          </div>
          <h1 class="text-3xl font-bold text-gray-900 mb-2">Contact Details</h1>
          <p class="text-gray-500">Let's start with the basics</p>
        </div>

        <!-- Form -->
        <form id="contactForm" class="space-y-5">
          <!-- Name Field -->
          <div class="space-y-2">
            <label class="input-label text-gray-600">
              Full Name <span class="text-red-500">*</span>
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <svg
                  class="w-5 h-5 text-gray-400"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.5"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                  />
                </svg>
              </div>
              <input
                type="text"
                id="fullName"
                name="fullName"
                required
                minlength="3"
                class="input-focus w-full pl-12 pr-4 py-4 bg-white border-2 border-gray-100 rounded-2xl text-gray-900 placeholder-gray-400 focus:border-primary focus:outline-none transition-all"
                placeholder="Enter customer name"
              />
            </div>
          </div>

          <!-- Phone Field -->
          <div class="space-y-2">
            <label class="input-label text-gray-600">
              Mobile Number <span class="text-red-500">*</span>
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <span class="text-gray-500 font-medium">+91</span>
              </div>
              <input
                type="tel"
                id="phone"
                name="phone"
                required
                pattern="[0-9]{10}"
                maxlength="10"
                class="input-focus w-full pl-14 pr-4 py-4 bg-white border-2 border-gray-100 rounded-2xl text-gray-900 placeholder-gray-400 focus:border-primary focus:outline-none transition-all"
                placeholder="98765 43210"
                oninput="this.value = this.value.replace(/[^0-9]/g, '')"
              />
              <div class="absolute inset-y-0 right-0 pr-4 flex items-center">
                <svg
                  id="phoneCheck"
                  class="w-5 h-5 text-green-500 hidden"
                  fill="currentColor"
                  viewBox="0 0 20 20"
                >
                  <path
                    fill-rule="evenodd"
                    d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                    clip-rule="evenodd"
                  />
                </svg>
              </div>
            </div>
          </div>

          <!-- Alternate Phone (Optional) -->
          <div class="space-y-2">
            <label class="input-label text-gray-500">
              Alternate Number <span class="text-gray-400 font-normal normal-case">(optional)</span>
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <span class="text-gray-400 font-medium">+91</span>
              </div>
              <input
                type="tel"
                id="alternatePhone"
                name="alternatePhone"
                maxlength="10"
                class="input-focus w-full pl-14 pr-4 py-4 bg-gray-50 border-2 border-gray-100 rounded-2xl text-gray-900 placeholder-gray-400 focus:border-primary focus:bg-white focus:outline-none transition-all"
                placeholder="Optional backup number"
                oninput="this.value = this.value.replace(/[^0-9]/g, '')"
              />
            </div>
          </div>

          <!-- Email (Optional) -->
          <div class="space-y-2">
            <label class="input-label text-gray-500">
              Email Address <span class="text-gray-400 font-normal normal-case">(optional)</span>
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <svg
                  class="w-5 h-5 text-gray-400"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.5"
                    d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                  />
                </svg>
              </div>
              <input
                type="email"
                id="email"
                name="email"
                class="input-focus w-full pl-12 pr-4 py-4 bg-gray-50 border-2 border-gray-100 rounded-2xl text-gray-900 placeholder-gray-400 focus:border-primary focus:bg-white focus:outline-none transition-all"
                placeholder="customer@email.com"
              />
            </div>
          </div>
        </form>

        <!-- Quick Tip -->
        <div
          class="mt-8 p-4 bg-gradient-to-r from-primary/5 to-secondary/5 rounded-2xl border border-primary/10"
        >
          <div class="flex gap-3">
            <div
              class="w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center flex-shrink-0"
            >
              <svg class="w-4 h-4 text-primary" fill="currentColor" viewBox="0 0 20 20">
                <path
                  fill-rule="evenodd"
                  d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"
                  clip-rule="evenodd"
                />
              </svg>
            </div>
            <div>
              <p class="text-sm font-medium text-gray-700">Quick Tip</p>
              <p class="text-xs text-gray-500 mt-0.5">
                Only name & phone are required. You can add more details later.
              </p>
            </div>
          </div>
        </div>
      </main>

      <!-- Bottom Action -->
      <footer class="sticky bottom-0 p-4 pb-8">
        <button
          type="submit"
          form="contactForm"
          onclick="handleNext(event)"
          class="btn-gradient w-full py-4 px-6 rounded-2xl text-white font-semibold text-lg shadow-xl shadow-primary/25 hover:shadow-2xl hover:shadow-primary/30 transform hover:-translate-y-0.5 transition-all duration-200 flex items-center justify-center gap-2"
        >
          <span>Continue</span>
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M13 7l5 5m0 0l-5 5m5-5H6"
            />
          </svg>
        </button>
      </footer>
    </div>

    <script>
      // Phone validation visual feedback
      document.getElementById('phone').addEventListener('input', function (e) {
        const checkIcon = document.getElementById('phoneCheck');
        if (e.target.value.length === 10) {
          checkIcon.classList.remove('hidden');
        } else {
          checkIcon.classList.add('hidden');
        }
      });

      function saveDraft() {
        const formData = {
          fullName: document.getElementById('fullName').value,
          phone: document.getElementById('phone').value,
          alternatePhone: document.getElementById('alternatePhone').value,
          email: document.getElementById('email').value,
          savedAt: new Date().toISOString(),
        };
        localStorage.setItem('leadDraft_contact', JSON.stringify(formData));

        // Show toast
        showToast('Draft saved!');
      }

      function showToast(message) {
        const toast = document.createElement('div');
        toast.className =
          'fixed top-20 left-1/2 -translate-x-1/2 px-4 py-2 bg-gray-900 text-white text-sm font-medium rounded-full shadow-lg z-50 animate-pulse';
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
      }

      function handleNext(e) {
        e.preventDefault();
        const form = document.getElementById('contactForm');

        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        // Save data
        const formData = {
          fullName: document.getElementById('fullName').value,
          phone: document.getElementById('phone').value,
          alternatePhone: document.getElementById('alternatePhone').value,
          email: document.getElementById('email').value,
        };
        localStorage.setItem('leadData_contact', JSON.stringify(formData));

        // Navigate to next step
        window.location.href = 'part1-property.html';
      }

      // Load saved draft on page load
      window.addEventListener('load', () => {
        const draft =
          localStorage.getItem('leadDraft_contact') || localStorage.getItem('leadData_contact');
        if (draft) {
          const data = JSON.parse(draft);
          if (data.fullName) document.getElementById('fullName').value = data.fullName;
          if (data.phone) {
            document.getElementById('phone').value = data.phone;
            if (data.phone.length === 10) {
              document.getElementById('phoneCheck').classList.remove('hidden');
            }
          }
          if (data.alternatePhone)
            document.getElementById('alternatePhone').value = data.alternatePhone;
          if (data.email) document.getElementById('email').value = data.email;
        }
      });
    </script>
  </body>
</html>

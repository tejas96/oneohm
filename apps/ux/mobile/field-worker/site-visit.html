<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Visit - OneOhm Solar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#76c044',
                        secondary: '#0d74b8',
                        tagline: '#025580',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl pb-20">
        <div class="bg-gradient-to-r from-primary via-green-500 to-secondary px-6 py-6 pt-12">
            <a href="dashboard-fieldworker.html" class="inline-flex items-center text-white mb-6">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
            </a>
            <h1 class="text-3xl font-bold text-white mb-2">Site Visit</h1>
            <p class="text-green-100">Rajesh Patel - Site Survey</p>
        </div>

        <div class="px-6 py-8 space-y-6">
            <!-- GPS Location -->
            <div class="bg-white border-2 border-gray-200 rounded-2xl p-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="font-bold text-gray-900">Location Capture</h3>
                    <span class="px-3 py-1 bg-green-100 text-green-700 text-xs font-semibold rounded-full">GPS Active</span>
                </div>
                <div class="bg-gray-100 rounded-lg p-4 mb-4">
                    <div class="flex items-start space-x-3">
                        <svg class="w-5 h-5 text-primary mt-1" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"></path>
                        </svg>
                        <div class="flex-1">
                            <p class="text-sm font-semibold text-gray-900">Current Location</p>
                            <p class="text-xs text-gray-600 mt-1">19.1136° N, 72.8697° E</p>
                            <p class="text-xs text-gray-500 mt-1">Andheri West, Mumbai</p>
                        </div>
                    </div>
                </div>
                <button class="w-full py-3 bg-gray-100 text-gray-700 rounded-lg font-semibold hover:bg-gray-200">
                    Refresh Location
                </button>
            </div>

            <!-- Photo Capture -->
            <div class="bg-white border-2 border-gray-200 rounded-2xl p-6">
                <h3 class="font-bold text-gray-900 mb-4">Site Photos</h3>
                
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <div class="aspect-square bg-gray-100 rounded-lg flex flex-col items-center justify-center border-2 border-dashed border-gray-300 hover:border-primary cursor-pointer">
                        <svg class="w-8 h-8 text-gray-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                        <p class="text-xs text-gray-500">Front View</p>
                    </div>
                    <div class="aspect-square bg-gray-100 rounded-lg flex flex-col items-center justify-center border-2 border-dashed border-gray-300 hover:border-primary cursor-pointer">
                        <svg class="w-8 h-8 text-gray-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                        <p class="text-xs text-gray-500">Roof</p>
                    </div>
                    <div class="aspect-square bg-gray-100 rounded-lg flex flex-col items-center justify-center border-2 border-dashed border-gray-300 hover:border-primary cursor-pointer">
                        <svg class="w-8 h-8 text-gray-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                        <p class="text-xs text-gray-500">Meter</p>
                    </div>
                    <div class="aspect-square bg-gray-100 rounded-lg flex flex-col items-center justify-center border-2 border-dashed border-gray-300 hover:border-primary cursor-pointer">
                        <svg class="w-8 h-8 text-gray-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                        <p class="text-xs text-gray-500">Other</p>
                    </div>
                </div>
            </div>

            <!-- Visit Notes -->
            <div class="bg-white border-2 border-gray-200 rounded-2xl p-6">
                <h3 class="font-bold text-gray-900 mb-4">Visit Notes</h3>
                <textarea 
                    rows="5" 
                    class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-primary focus:outline-none resize-none"
                    placeholder="Enter your observations, measurements, and any customer feedback..."
                ></textarea>
            </div>

            <!-- Measurements -->
            <div class="bg-white border-2 border-gray-200 rounded-2xl p-6">
                <h3 class="font-bold text-gray-900 mb-4">Measurements</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Roof Area (sq ft)</label>
                        <input 
                            type="number" 
                            class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-primary focus:outline-none"
                            placeholder="Enter roof area"
                        >
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Shadow Analysis</label>
                        <select class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-primary focus:outline-none">
                            <option>Select shadow coverage</option>
                            <option>No Shadow (0-10%)</option>
                            <option>Low Shadow (10-30%)</option>
                            <option>Moderate Shadow (30-50%)</option>
                            <option>High Shadow (50%+)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Roof Type</label>
                        <select class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-primary focus:outline-none">
                            <option>Select roof type</option>
                            <option>Flat Concrete</option>
                            <option>Sloped RCC</option>
                            <option>Tin Shed</option>
                            <option>Asbestos</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex space-x-3">
                <button class="flex-1 py-4 bg-gray-100 text-gray-700 rounded-2xl font-bold hover:bg-gray-200 transition-all">
                    Save Draft
                </button>
                <button class="flex-1 py-4 bg-gradient-to-r from-primary via-green-500 to-secondary text-white rounded-2xl font-bold shadow-lg hover:shadow-xl transition-all">
                    Complete Visit
                </button>
            </div>
        </div>
    </div>
</body>
</html>

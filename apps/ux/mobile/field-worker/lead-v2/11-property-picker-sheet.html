<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Property Picker | OneOhm Solar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#76c044',
                        secondary: '#0d74b8',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-black/50 min-h-screen flex items-end">
    <div class="max-w-md mx-auto w-full">
        
        <!-- Bottom Sheet -->
        <div class="bg-white rounded-t-3xl">
            <!-- Handle -->
            <div class="flex justify-center pt-3 pb-2">
                <div class="w-10 h-1 bg-gray-300 rounded-full"></div>
            </div>

            <!-- Header -->
            <div class="px-6 pb-4 border-b border-gray-100">
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="text-lg font-bold text-gray-900">Rajesh Kumar</h2>
                        <p class="text-sm text-gray-500">Select a property</p>
                    </div>
                    <a href="01-my-leads-list.html" class="p-2 -mr-2 text-gray-400 hover:text-gray-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </a>
            </div>

            <!-- Properties List -->
            <div class="px-4 py-4 space-y-2 max-h-[60vh] overflow-y-auto">
                <!-- Property 1 - Selected -->
                <div class="flex items-center gap-3 p-4 border-2 border-primary bg-primary/5 rounded-2xl">
                    <div class="w-5 h-5 bg-primary rounded-full flex items-center justify-center">
                        <svg class="w-3 h-3 text-white" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                        </svg>
                    </div>
                    <span class="text-xl">🏠</span>
                    <div class="flex-1">
                        <div class="flex items-center gap-2">
                            <p class="font-semibold text-gray-900 text-sm">Home - MG Road</p>
                            <span class="px-1.5 py-0.5 bg-primary/10 text-primary text-[10px] font-semibold rounded">PRIMARY</span>
                        </div>
                        <p class="text-xs text-gray-500">Residential • <span class="text-red-600 font-semibold">Hot</span> • Est: 5 KW</p>
                        <p class="text-xs text-gray-400 mt-0.5">Sangli, Maharashtra</p>
                    </div>
                </div>

                <!-- Property 2 -->
                <div class="flex items-center gap-3 p-4 border border-gray-200 rounded-2xl hover:border-primary/50 cursor-pointer">
                    <div class="w-5 h-5 border-2 border-gray-300 rounded-full"></div>
                    <span class="text-xl">🏢</span>
                    <div class="flex-1">
                        <p class="font-semibold text-gray-900 text-sm">Shop - Market Area</p>
                        <p class="text-xs text-gray-500">Commercial • <span class="text-blue-600 font-semibold">Cold</span> • Est: 10 KW</p>
                        <p class="text-xs text-gray-400 mt-0.5">Sangli Market, Maharashtra</p>
                    </div>
                </div>

                <!-- Property 3 -->
                <div class="flex items-center gap-3 p-4 border border-gray-200 rounded-2xl hover:border-primary/50 cursor-pointer">
                    <div class="w-5 h-5 border-2 border-gray-300 rounded-full"></div>
                    <span class="text-xl">🏭</span>
                    <div class="flex-1">
                        <p class="font-semibold text-gray-900 text-sm">Factory - MIDC</p>
                        <p class="text-xs text-gray-500">Industrial • <span class="text-amber-600 font-semibold">Warm</span> • Est: 50 KW</p>
                        <p class="text-xs text-gray-400 mt-0.5">MIDC, Maharashtra</p>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="px-4 pb-8 pt-4 border-t border-gray-100">
                <a href="09-site-visit.html" class="block w-full py-4 bg-gradient-to-r from-primary to-secondary text-white font-semibold rounded-2xl shadow-lg text-center">
                    Confirm Selection
                </a>
            </div>
        </div>

    </div>
</body>
</html>

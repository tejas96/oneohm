<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>New Lead - Property | OneOhm Solar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#76c044',
              secondary: '#0d74b8',
            },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
    </style>
  </head>
  <body class="bg-gradient-to-br from-green-50 to-blue-50 min-h-screen">
    <div class="max-w-md mx-auto min-h-screen flex flex-col">
      <!-- Header -->
      <header class="sticky top-0 z-10 px-4 pt-4">
        <div
          class="bg-white/90 backdrop-blur-lg rounded-2xl px-4 py-3 flex items-center justify-between shadow-lg"
        >
          <a href="03-step-contact.html" class="p-2 -ml-2 rounded-xl hover:bg-gray-100">
            <svg
              class="w-6 h-6 text-gray-700"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 19l-7-7 7-7"
              />
            </svg>
          </a>
          <!-- Progress -->
          <div class="flex items-center gap-2">
            <div class="flex gap-1.5">
              <div class="w-2 h-2 rounded-full bg-primary"></div>
              <div class="w-2.5 h-2.5 rounded-full bg-primary"></div>
              <div class="w-2 h-2 rounded-full bg-gray-300"></div>
              <div class="w-2 h-2 rounded-full bg-gray-300"></div>
            </div>
            <span class="text-xs font-medium text-gray-500 ml-1">2 of 4</span>
          </div>
          <div class="w-10"></div>
        </div>
      </header>

      <!-- Content -->
      <main class="flex-1 px-6 py-6 overflow-y-auto">
        <!-- Title -->
        <div class="mb-6">
          <h1 class="text-2xl font-bold text-gray-900 mb-1">Property Details</h1>
          <p class="text-gray-500 text-sm">Where is the installation site?</p>
        </div>

        <!-- Form -->
        <div class="space-y-5">
          <!-- Property Type -->
          <div>
            <label class="text-xs font-semibold text-gray-600 uppercase tracking-wide"
              >Property Type <span class="text-red-500">*</span></label
            >
            <div class="mt-3 grid grid-cols-3 gap-2">
              <button class="py-3 px-2 border-2 border-primary bg-primary/5 rounded-xl text-center">
                <span class="text-xl">🏠</span>
                <span class="block text-xs font-semibold text-primary mt-1">Home</span>
              </button>
              <button
                class="py-3 px-2 border-2 border-gray-200 rounded-xl text-center hover:border-gray-300"
              >
                <span class="text-xl">🏢</span>
                <span class="block text-xs font-semibold text-gray-600 mt-1">Apartment</span>
              </button>
              <button
                class="py-3 px-2 border-2 border-gray-200 rounded-xl text-center hover:border-gray-300"
              >
                <span class="text-xl">🏪</span>
                <span class="block text-xs font-semibold text-gray-600 mt-1">Business</span>
              </button>
              <button
                class="py-3 px-2 border-2 border-gray-200 rounded-xl text-center hover:border-gray-300"
              >
                <span class="text-xl">🏭</span>
                <span class="block text-xs font-semibold text-gray-600 mt-1">Industry</span>
              </button>
              <button
                class="py-3 px-2 border-2 border-gray-200 rounded-xl text-center hover:border-gray-300"
              >
                <span class="text-xl">🌾</span>
                <span class="block text-xs font-semibold text-gray-600 mt-1">Farm</span>
              </button>
              <button
                class="py-3 px-2 border-2 border-gray-200 rounded-xl text-center hover:border-gray-300"
              >
                <span class="text-xl">🏛️</span>
                <span class="block text-xs font-semibold text-gray-600 mt-1">Institution</span>
              </button>
            </div>
          </div>

          <!-- Property Name -->
          <div>
            <label class="text-xs font-medium text-gray-500 uppercase tracking-wide"
              >Property Name <span class="text-gray-400 normal-case">(optional)</span></label
            >
            <div class="mt-2">
              <input
                type="text"
                placeholder="e.g., Kumar Residence, Main Office"
                class="w-full px-4 py-4 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:border-primary focus:bg-white focus:outline-none"
              />
            </div>
          </div>

          <!-- Address -->
          <div>
            <label class="text-xs font-semibold text-gray-600 uppercase tracking-wide"
              >Address</label
            >
            <div class="mt-2">
              <textarea
                rows="2"
                placeholder="House/Flat No., Street, Area, Landmark"
                class="w-full px-4 py-4 bg-white border-2 border-gray-100 rounded-2xl focus:border-primary focus:outline-none resize-none"
              ></textarea>
            </div>
          </div>

          <!-- City & State -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs font-semibold text-gray-600 uppercase tracking-wide"
                >City <span class="text-red-500">*</span></label
              >
              <div class="mt-2">
                <input
                  type="text"
                  placeholder="City"
                  class="w-full px-4 py-4 bg-white border-2 border-gray-100 rounded-2xl focus:border-primary focus:outline-none"
                />
              </div>
            </div>
            <div>
              <label class="text-xs font-semibold text-gray-600 uppercase tracking-wide"
                >State</label
              >
              <div class="mt-2 relative">
                <select
                  class="w-full px-4 py-4 bg-white border-2 border-gray-100 rounded-2xl appearance-none focus:border-primary focus:outline-none text-gray-700"
                >
                  <option value="maharashtra">Maharashtra</option>
                  <option value="karnataka">Karnataka</option>
                  <option value="gujarat">Gujarat</option>
                  <option value="rajasthan">Rajasthan</option>
                  <option value="tamil_nadu">Tamil Nadu</option>
                </select>
                <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                  <svg
                    class="w-5 h-5 text-gray-400"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M19 9l-7 7-7-7"
                    />
                  </svg>
                </div>
              </div>
            </div>
          </div>

          <!-- Pincode with Auto-fill -->
          <div>
            <label class="text-xs font-semibold text-gray-600 uppercase tracking-wide"
              >Pincode</label
            >
            <div class="mt-2 relative">
              <input
                type="text"
                maxlength="6"
                placeholder="Enter 6-digit pincode"
                class="w-full px-4 py-4 bg-white border-2 border-gray-100 rounded-2xl focus:border-primary focus:outline-none"
              />
              <div class="absolute inset-y-0 right-0 pr-4 flex items-center">
                <span class="text-xs text-primary font-medium">Auto-fills city</span>
              </div>
            </div>
            <p class="text-xs text-gray-400 mt-1">City & state will auto-fill from pincode</p>
          </div>
        </div>
      </main>

      <!-- Bottom Actions -->
      <footer class="sticky bottom-0 p-4 pb-8 bg-gradient-to-t from-green-50 to-transparent pt-8">
        <div class="flex gap-3">
          <a
            href="03-step-contact.html"
            class="flex-1 py-4 border-2 border-gray-200 bg-white text-gray-700 font-semibold text-center rounded-2xl"
          >
            Back
          </a>
          <a
            href="06-step-technical.html"
            class="flex-1 py-4 bg-gradient-to-r from-primary to-secondary text-white font-semibold text-center rounded-2xl shadow-lg shadow-primary/25 flex items-center justify-center gap-2"
          >
            <span>Continue</span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13 7l5 5m0 0l-5 5m5-5H6"
              />
            </svg>
          </a>
        </div>
      </footer>
    </div>
  </body>
</html>

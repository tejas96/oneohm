<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>New Lead - Contact | OneOhm Solar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#76c044',
                        secondary: '#0d74b8',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gradient-to-br from-green-50 to-blue-50 min-h-screen">
    <div class="max-w-md mx-auto min-h-screen flex flex-col">
        
        <!-- Header -->
        <header class="sticky top-0 z-10 px-4 pt-4">
            <div class="bg-white/90 backdrop-blur-lg rounded-2xl px-4 py-3 flex items-center justify-between shadow-lg">
                <a href="01-my-leads-list.html" class="p-2 -ml-2 rounded-xl hover:bg-gray-100">
                    <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                </a>
                <!-- Progress -->
                <div class="flex items-center gap-2">
                    <div class="flex gap-1.5">
                        <div class="w-2.5 h-2.5 rounded-full bg-primary"></div>
                        <div class="w-2 h-2 rounded-full bg-gray-300"></div>
                        <div class="w-2 h-2 rounded-full bg-gray-300"></div>
                        <div class="w-2 h-2 rounded-full bg-gray-300"></div>
                    </div>
                    <span class="text-xs font-medium text-gray-500 ml-1">1 of 4</span>
                </div>
                <div class="w-10"></div>
            </div>
        </header>

        <!-- Content -->
        <main class="flex-1 px-6 py-6">
            <!-- Title -->
            <div class="mb-6">
                <div class="inline-flex items-center gap-2 px-3 py-1.5 bg-primary/10 rounded-full mb-3">
                    <div class="w-2 h-2 rounded-full bg-primary animate-pulse"></div>
                    <span class="text-xs font-semibold text-primary uppercase tracking-wide">New Lead</span>
                </div>
                <h1 class="text-2xl font-bold text-gray-900 mb-1">Contact Details</h1>
                <p class="text-gray-500 text-sm">Let's start with the basics</p>
            </div>

            <!-- Form -->
            <div class="space-y-5">
                <!-- Full Name -->
                <div>
                    <label class="text-xs font-semibold text-gray-600 uppercase tracking-wide">Full Name <span class="text-red-500">*</span></label>
                    <div class="mt-2 relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                        </div>
                        <input type="text" placeholder="Enter customer name" class="w-full pl-12 pr-4 py-4 bg-white border-2 border-gray-100 rounded-2xl focus:border-primary focus:outline-none">
                    </div>
                </div>

                <!-- Mobile Number -->
                <div>
                    <label class="text-xs font-semibold text-gray-600 uppercase tracking-wide">Mobile Number <span class="text-red-500">*</span></label>
                    <div class="mt-2 relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <span class="text-gray-500 font-medium">+91</span>
                        </div>
                        <input type="tel" placeholder="98765 43210" maxlength="10" class="w-full pl-14 pr-12 py-4 bg-white border-2 border-gray-100 rounded-2xl focus:border-primary focus:outline-none">
                        <!-- Validation Check -->
                        <div class="absolute inset-y-0 right-0 pr-4 flex items-center">
                            <svg class="w-5 h-5 text-primary" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Alternate Phone -->
                <div>
                    <label class="text-xs font-medium text-gray-500 uppercase tracking-wide">Alternate Number <span class="text-gray-400 normal-case">(optional)</span></label>
                    <div class="mt-2 relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <span class="text-gray-400 font-medium">+91</span>
                        </div>
                        <input type="tel" placeholder="Optional backup" class="w-full pl-14 pr-4 py-4 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:border-primary focus:bg-white focus:outline-none">
                    </div>
                </div>

                <!-- Email -->
                <div>
                    <label class="text-xs font-medium text-gray-500 uppercase tracking-wide">Email <span class="text-gray-400 normal-case">(optional)</span></label>
                    <div class="mt-2 relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                            </svg>
                        </div>
                        <input type="email" placeholder="customer@email.com" class="w-full pl-12 pr-4 py-4 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:border-primary focus:bg-white focus:outline-none">
                    </div>
                </div>

                <!-- Lead Source -->
                <div>
                    <label class="text-xs font-medium text-gray-500 uppercase tracking-wide">Lead Source <span class="text-gray-400 normal-case">(optional)</span></label>
                    <div class="mt-2 relative">
                        <select class="w-full px-4 py-4 bg-gray-50 border-2 border-gray-100 rounded-2xl appearance-none focus:border-primary focus:bg-white focus:outline-none text-gray-700">
                            <option value="">How did they find us?</option>
                            <option value="walk_in">Walk-in</option>
                            <option value="referral">Referral</option>
                            <option value="website">Website</option>
                            <option value="social_media">Social Media</option>
                            <option value="exhibition">Exhibition</option>
                            <option value="cold_call">Cold Call</option>
                            <option value="advertisement">Advertisement</option>
                            <option value="other">Other</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Lead Temperature -->
                <div>
                    <label class="text-xs font-semibold text-gray-600 uppercase tracking-wide">Lead Temperature</label>
                    <div class="mt-3 flex gap-2">
                        <button class="flex-1 py-3 px-4 border-2 border-gray-200 rounded-xl text-center hover:border-red-300 transition-colors">
                            <span class="px-3 py-1 bg-red-100 text-red-600 text-xs font-bold rounded-full">HOT</span>
                        </button>
                        <button class="flex-1 py-3 px-4 border-2 border-primary bg-primary/5 rounded-xl text-center">
                            <span class="px-3 py-1 bg-amber-100 text-amber-600 text-xs font-bold rounded-full">WARM</span>
                        </button>
                        <button class="flex-1 py-3 px-4 border-2 border-gray-200 rounded-xl text-center hover:border-blue-300 transition-colors">
                            <span class="px-3 py-1 bg-blue-100 text-blue-600 text-xs font-bold rounded-full">COLD</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Tip -->
            <div class="mt-6 p-4 bg-gradient-to-r from-primary/5 to-secondary/5 rounded-2xl border border-primary/10">
                <div class="flex gap-3">
                    <div class="w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center flex-shrink-0">
                        <svg class="w-4 h-4 text-primary" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
                        </svg>
                    </div>
                    <div>
                        <p class="text-sm font-medium text-gray-700">Quick Tip</p>
                        <p class="text-xs text-gray-500 mt-0.5">Only name & phone are required. Add more later.</p>
                    </div>
                </div>
            </div>
        </main>

        <!-- Bottom Action -->
        <footer class="sticky bottom-0 p-4 pb-8">
            <a href="04-step-property.html" class="block w-full py-4 bg-gradient-to-r from-primary to-secondary text-white font-semibold text-center rounded-2xl shadow-xl shadow-primary/25 flex items-center justify-center gap-2">
                <span>Continue</span>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
                </svg>
            </a>
        </footer>

    </div>
</body>
</html>

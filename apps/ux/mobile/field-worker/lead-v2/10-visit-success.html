<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Visit Complete | OneOhm Solar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#76c044',
                        secondary: '#0d74b8',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes checkmark {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
        .checkmark { animation: checkmark 0.5s ease-out forwards; }
    </style>
</head>
<body class="bg-gradient-to-br from-green-50 to-blue-50 min-h-screen">
    <div class="max-w-md mx-auto min-h-screen flex flex-col justify-center p-6">
        
        <!-- Success Content -->
        <div class="text-center">
            <!-- Checkmark Animation -->
            <div class="checkmark w-24 h-24 mx-auto bg-gradient-to-r from-primary to-secondary rounded-full flex items-center justify-center shadow-xl shadow-primary/30 mb-6">
                <svg class="w-12 h-12 text-white" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                </svg>
            </div>

            <h1 class="text-2xl font-bold text-gray-900 mb-2">Visit Complete!</h1>
            <p class="text-gray-500 mb-8">Property data updated successfully</p>

            <!-- Summary Card -->
            <div class="bg-white rounded-2xl p-5 border-2 border-gray-200 shadow-lg mb-8 text-left">
                <div class="flex items-center gap-4 mb-4">
                    <div class="w-12 h-12 bg-gradient-to-br from-green-400 to-teal-500 rounded-full flex items-center justify-center text-white font-bold text-lg">
                        RK
                    </div>
                    <div class="flex-1">
                        <h3 class="font-bold text-gray-900">Rajesh Kumar</h3>
                        <p class="text-sm text-gray-500">🏠 Home - MG Road</p>
                    </div>
                    <span class="px-3 py-1 bg-red-100 text-red-600 text-xs font-bold rounded-full">HOT</span>
                </div>

                <!-- Updated Stats -->
                <div class="grid grid-cols-3 gap-3 pt-4 border-t border-gray-100">
                    <div class="text-center">
                        <p class="text-lg font-bold text-gray-900">4</p>
                        <p class="text-[10px] text-gray-500 uppercase">Photos</p>
                    </div>
                    <div class="text-center">
                        <p class="text-lg font-bold text-gray-900">750</p>
                        <p class="text-[10px] text-gray-500 uppercase">Sq.ft Roof</p>
                    </div>
                    <div class="text-center">
                        <p class="text-lg font-bold text-primary">100%</p>
                        <p class="text-[10px] text-gray-500 uppercase">Data</p>
                    </div>
                </div>

                <!-- GPS Tag -->
                <div class="mt-4 pt-4 border-t border-gray-100 flex items-center gap-2 text-sm text-gray-600">
                    <svg class="w-4 h-4 text-primary" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/>
                    </svg>
                    <span>GPS verified: 19.1136° N, 72.8697° E</span>
                </div>
            </div>

            <!-- Next Actions -->
            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-4">What's next?</p>
            
            <div class="space-y-3">
                <!-- Create Quote -->
                <a href="02-customer-property-select.html" class="block bg-white rounded-2xl p-4 border-2 border-gray-200 shadow-sm hover:border-primary/50 hover:shadow-md transition-all">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-primary/10 rounded-xl flex items-center justify-center">
                            <svg class="w-6 h-6 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
                            </svg>
                        </div>
                        <div class="flex-1 text-left">
                            <p class="font-semibold text-gray-900">Create Quote</p>
                            <p class="text-xs text-gray-500">With verified site data</p>
                        </div>
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                        </svg>
                    </div>
                </a>

                <!-- New Site Visit -->
                <a href="02-customer-property-select.html" class="block bg-white rounded-2xl p-4 border-2 border-gray-200 shadow-sm hover:border-secondary/50 hover:shadow-md transition-all">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-secondary/10 rounded-xl flex items-center justify-center">
                            <svg class="w-6 h-6 text-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                            </svg>
                        </div>
                        <div class="flex-1 text-left">
                            <p class="font-semibold text-gray-900">New Site Visit</p>
                            <p class="text-xs text-gray-500">Visit another property</p>
                        </div>
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                        </svg>
                    </div>
                </a>
            </div>

            <!-- Go to Dashboard -->
            <a href="01-my-leads-list.html" class="block w-full py-4 mt-8 text-gray-500 font-medium hover:text-gray-700">
                ← Go to My Leads
            </a>
        </div>

    </div>
</body>
</html>

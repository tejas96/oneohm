<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Follow-up Set | OneOhm Solar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#76c044',
                        secondary: '#0d74b8',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes checkmark {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .checkmark { animation: checkmark 0.5s ease-out forwards; }
        .fade-up { animation: fadeUp 0.4s ease-out forwards; }
        .fade-up-1 { animation-delay: 0.2s; opacity: 0; }
        .fade-up-2 { animation-delay: 0.4s; opacity: 0; }
    </style>
</head>
<body class="bg-gradient-to-br from-green-50 to-blue-50 min-h-screen">
    <div class="max-w-md mx-auto min-h-screen flex flex-col justify-center p-6">
        
        <!-- Success Content -->
        <div class="text-center">
            <!-- Checkmark Animation -->
            <div class="checkmark w-20 h-20 mx-auto bg-gradient-to-r from-primary to-secondary rounded-full flex items-center justify-center shadow-xl shadow-primary/30 mb-6">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
            </div>

            <h1 class="text-2xl font-bold text-gray-900 mb-2">Follow-up Set!</h1>
            <p class="text-gray-500 mb-8">We'll remind you on the scheduled date</p>

            <!-- Reminder Card -->
            <div class="fade-up fade-up-1 bg-white rounded-2xl p-5 border-2 border-gray-200 shadow-lg mb-8 text-left">
                <div class="flex items-center gap-4 mb-4">
                    <div class="w-12 h-12 bg-gradient-to-br from-green-400 to-teal-500 rounded-full flex items-center justify-center text-white font-bold text-lg">
                        RK
                    </div>
                    <div class="flex-1">
                        <h3 class="font-bold text-gray-900">Rajesh Kumar</h3>
                        <p class="text-sm text-gray-500">🏠 Home - MG Road</p>
                    </div>
                    <span class="px-2 py-1 bg-amber-100 text-amber-600 text-xs font-bold rounded-full">WARM</span>
                </div>

                <!-- Follow-up Details -->
                <div class="pt-4 border-t border-gray-100 space-y-3">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 bg-secondary/10 rounded-lg flex items-center justify-center">
                            <svg class="w-4 h-4 text-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                            </svg>
                        </div>
                        <div>
                            <p class="text-xs text-gray-500">Follow-up Date</p>
                            <p class="font-semibold text-gray-900" id="followupDate">Tomorrow, Dec 19</p>
                        </div>
                    </div>
                    <div class="flex items-start gap-3">
                        <div class="w-8 h-8 bg-primary/10 rounded-lg flex items-center justify-center">
                            <svg class="w-4 h-4 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"/>
                            </svg>
                        </div>
                        <div class="flex-1">
                            <p class="text-xs text-gray-500">Notes</p>
                            <p class="text-sm text-gray-700">Discuss pricing options and subsidy details</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="fade-up fade-up-2 space-y-3">
                <a href="01-my-leads-list.html" class="block w-full py-4 bg-gradient-to-r from-primary to-secondary text-white font-semibold text-center rounded-2xl shadow-lg shadow-primary/25">
                    Go to My Leads
                </a>
                <a href="03-step-contact.html" class="block py-3 text-primary font-semibold">
                    + Add Another Lead
                </a>
            </div>
        </div>

    </div>

    <script>
        // Format tomorrow's date
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        const options = { weekday: 'long', month: 'short', day: 'numeric' };
        const formatted = tomorrow.toLocaleDateString('en-US', options);
        document.getElementById('followupDate').textContent = formatted;
    </script>
</body>
</html>

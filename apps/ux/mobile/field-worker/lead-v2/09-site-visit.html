<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Site Visit | OneOhm Solar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#76c044',
                        secondary: '#0d74b8',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-md mx-auto bg-white min-h-screen pb-32">
        
        <!-- Header -->
        <div class="sticky top-0 z-10 bg-white border-b border-gray-100 px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <a href="01-my-leads-list.html" class="p-2 -ml-2 text-gray-600 hover:bg-gray-100 rounded-xl">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                        </svg>
                    </a>
                    <h1 class="text-lg font-bold text-gray-900">Site Visit</h1>
                    <p class="text-xs text-gray-500">Capture site details & photos</p>
                </div>
            </div>
        </div>

        <!-- Customer/Property Banner -->
        <div class="px-4 py-3 bg-gradient-to-r from-primary/10 to-secondary/10 border-b border-primary/10">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-green-400 to-teal-500 rounded-full flex items-center justify-center text-white font-bold text-sm">RK</div>
                <div class="flex-1">
                    <p class="font-semibold text-gray-900 text-sm">Rajesh Kumar</p>
                    <p class="text-xs text-gray-600">🏠 Home - MG Road, Sangli</p>
                </div>
                <a href="02-customer-property-select.html" class="text-xs font-semibold text-primary">Change</a>
            </div>
        </div>

        <!-- Content -->
        <div class="p-4 space-y-6">

            <!-- GPS Location -->
            <div class="bg-white rounded-2xl border-2 border-gray-200 overflow-hidden">
                <div class="p-4 border-b border-gray-100">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <svg class="w-5 h-5 text-secondary" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/>
                            </svg>
                            <span class="font-semibold text-gray-900 text-sm">GPS Location</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="w-2 h-2 bg-primary rounded-full animate-pulse"></span>
                            <span class="text-xs font-medium text-primary">Active</span>
                        </div>
                    </div>
                </div>
                <div class="p-4 bg-gray-50">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm font-mono text-gray-700">19.1136° N, 72.8697° E</p>
                            <p class="text-xs text-gray-500 mt-1">Accuracy: ±5 meters</p>
                        </div>
                        <button class="px-3 py-2 text-xs font-semibold text-secondary bg-secondary/10 rounded-lg flex items-center gap-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                            </svg>
                            Refresh
                        </button>
                    </div>
                </div>
            </div>

            <!-- Site Photos -->
            <div>
                <div class="flex items-center justify-between mb-3">
                    <span class="font-semibold text-gray-900 text-sm">📸 Site Photos</span>
                    <span class="text-xs text-gray-500">2 of 4 required</span>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <!-- Photo 1 - Captured -->
                    <div class="relative">
                        <div class="aspect-square bg-gray-200 rounded-xl overflow-hidden">
                            <img src="https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=300&h=300&fit=crop" alt="Front View" class="w-full h-full object-cover">
                        </div>
                        <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/70 to-transparent p-2 rounded-b-xl">
                            <p class="text-white text-xs font-medium">Front View</p>
                        </div>
                        <button class="absolute top-2 right-2 w-6 h-6 bg-white/90 rounded-full flex items-center justify-center">
                            <svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                            </svg>
                        </button>
                    </div>
                    <!-- Photo 2 - Captured -->
                    <div class="relative">
                        <div class="aspect-square bg-gray-200 rounded-xl overflow-hidden">
                            <img src="https://images.unsplash.com/photo-1508514177221-188b1cf16e9d?w=300&h=300&fit=crop" alt="Roof View" class="w-full h-full object-cover">
                        </div>
                        <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/70 to-transparent p-2 rounded-b-xl">
                            <p class="text-white text-xs font-medium">Roof View</p>
                        </div>
                        <button class="absolute top-2 right-2 w-6 h-6 bg-white/90 rounded-full flex items-center justify-center">
                            <svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                            </svg>
                        </button>
                    </div>
                    <!-- Photo 3 - Empty -->
                    <button class="aspect-square bg-gray-100 border-2 border-dashed border-gray-300 rounded-xl flex flex-col items-center justify-center hover:bg-gray-50 hover:border-primary transition-colors">
                        <svg class="w-8 h-8 text-gray-400 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                        <span class="text-xs text-gray-500">Meter Box</span>
                    </button>
                    <!-- Photo 4 - Empty -->
                    <button class="aspect-square bg-gray-100 border-2 border-dashed border-gray-300 rounded-xl flex flex-col items-center justify-center hover:bg-gray-50 hover:border-primary transition-colors">
                        <svg class="w-8 h-8 text-gray-400 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                        <span class="text-xs text-gray-500">Electricity Bill</span>
                    </button>
                </div>
                <button class="w-full mt-3 py-2 text-sm font-medium text-primary flex items-center justify-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                    Add More Photos
                </button>
            </div>

            <!-- Roof Area -->
            <div>
                <label class="text-xs text-gray-500 mb-2 block">📐 Available Roof Area</label>
                <div class="bg-white border-2 border-gray-200 rounded-2xl p-4">
                    <div class="flex items-center justify-between">
                        <button type="button" class="w-12 h-12 rounded-xl bg-gray-100 hover:bg-gray-200 flex items-center justify-center active:scale-95 transition-transform">
                            <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 12H4"/>
                            </svg>
                        </button>
                        <div class="text-center">
                            <div class="flex items-baseline justify-center gap-1">
                                <input type="number" value="500" class="w-24 text-3xl font-bold text-gray-900 text-center bg-transparent focus:outline-none">
                                <span class="text-sm text-gray-400">sq.ft</span>
                            </div>
                            <span class="text-xs text-gray-500">approx usable area</span>
                        </div>
                        <button type="button" class="w-12 h-12 rounded-xl bg-primary/10 hover:bg-primary/20 flex items-center justify-center active:scale-95 transition-transform">
                            <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Notes -->
            <div>
                <label class="text-xs text-gray-500 mb-2 block">📝 Site Visit Notes</label>
                <textarea rows="3" placeholder="Observations, customer feedback, special considerations..." class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl text-sm focus:border-primary focus:outline-none resize-none"></textarea>
            </div>

        </div>

        <!-- Bottom Actions -->
        <div class="fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-gray-100 max-w-md mx-auto">
            <a href="10-visit-success.html" class="block w-full py-4 bg-gradient-to-r from-primary to-secondary text-white font-semibold text-center rounded-xl shadow-lg flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                    </svg>
                    Complete Visit
                </a>
        </div>

    </div>
</body>
</html>

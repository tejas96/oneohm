<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>New Lead - Requirements | OneOhm Solar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#76c044',
                        secondary: '#0d74b8',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gradient-to-br from-green-50 to-blue-50 min-h-screen">
    <div class="max-w-md mx-auto min-h-screen flex flex-col">
        
        <!-- Header -->
        <header class="sticky top-0 z-10 px-4 pt-4">
            <div class="bg-white/90 backdrop-blur-lg rounded-2xl px-4 py-3 flex items-center justify-between shadow-lg">
                <a href="04-step-property.html" class="p-2 -ml-2 rounded-xl hover:bg-gray-100">
                    <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                </a>
                <!-- Progress -->
                <div class="flex items-center gap-2">
                    <div class="flex gap-1.5">
                        <div class="w-2 h-2 rounded-full bg-primary"></div>
                        <div class="w-2 h-2 rounded-full bg-primary"></div>
                        <div class="w-2.5 h-2.5 rounded-full bg-primary"></div>
                        <div class="w-2 h-2 rounded-full bg-gray-300"></div>
                        <div class="w-2 h-2 rounded-full bg-gray-300"></div>
                    </div>
                    <span class="text-xs font-medium text-gray-500 ml-1">3 of 5</span>
                </div>
                <a href="06-step-technical.html" class="text-sm font-semibold text-gray-400">Skip</a>
            </div>
        </header>

        <!-- Content -->
        <main class="flex-1 px-6 py-6">
            <!-- Title -->
            <div class="mb-6">
                <div class="inline-flex items-center gap-2 px-3 py-1.5 bg-amber-100 rounded-full mb-3">
                    <span class="text-xs font-semibold text-amber-700 uppercase tracking-wide">Optional</span>
                </div>
                <h1 class="text-2xl font-bold text-gray-900 mb-1">Requirements</h1>
                <p class="text-gray-500 text-sm">Helps us estimate system size</p>
            </div>

            <!-- Form -->
            <div class="space-y-6">
                <!-- Monthly Bill -->
                <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm">
                    <label class="text-xs font-semibold text-gray-600 uppercase tracking-wide">Monthly Electricity Bill</label>
                    
                    <!-- Stepper -->
                    <div class="mt-4 flex items-center justify-center gap-6">
                        <button class="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center text-gray-600 hover:bg-gray-200 transition-colors">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"/>
                            </svg>
                        </button>
                        <div class="text-center">
                            <div class="flex items-center justify-center">
                                <span class="text-2xl font-bold text-gray-400">₹</span>
                                <input type="text" value="3,000" class="w-24 text-3xl font-bold text-gray-900 text-center bg-transparent border-b-2 border-transparent focus:border-primary focus:outline-none">
                            </div>
                            <p class="text-xs text-gray-500 mt-1">per month</p>
                        </div>
                        <button class="w-12 h-12 bg-primary/10 rounded-full flex items-center justify-center text-primary hover:bg-primary/20 transition-colors">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                            </svg>
                        </button>
                    </div>

                    </div>

                <!-- Roof Area -->
                <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm">
                    <label class="text-xs font-semibold text-gray-600 uppercase tracking-wide">Available Roof Area</label>
                    
                    <!-- Stepper -->
                    <div class="mt-4 flex items-center justify-center gap-6">
                        <button class="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center text-gray-600 hover:bg-gray-200 transition-colors">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"/>
                            </svg>
                        </button>
                        <div class="text-center">
                            <input type="text" value="500" class="w-20 text-3xl font-bold text-gray-900 text-center bg-transparent border-b-2 border-transparent focus:border-primary focus:outline-none">
                            <p class="text-xs text-gray-500 mt-1">sq. ft (approx)</p>
                        </div>
                        <button class="w-12 h-12 bg-primary/10 rounded-full flex items-center justify-center text-primary hover:bg-primary/20 transition-colors">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                            </svg>
                        </button>
                    </div>

                    </div>

                <!-- Estimated System -->
                <div class="bg-gradient-to-r from-primary/10 to-secondary/10 rounded-2xl p-4 border border-primary/20">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm">
                            <svg class="w-5 h-5 text-primary" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z"/>
                            </svg>
                        </div>
                        <div>
                            <p class="font-bold text-gray-900">Estimated: ~3 KW System</p>
                            <p class="text-xs text-gray-600">Based on your bill & roof area</p>
                        </div>
                    </div>
                </div>

                <!-- Notes -->
                <div>
                    <label class="text-xs font-medium text-gray-500 uppercase tracking-wide">Additional Notes <span class="text-gray-400 normal-case">(optional)</span></label>
                    <div class="mt-2">
                        <textarea rows="3" placeholder="Any specific requirements, preferences, concerns..." class="w-full px-4 py-4 bg-white border-2 border-gray-100 rounded-2xl focus:border-primary focus:outline-none resize-none"></textarea>
                    </div>
                </div>
            </div>
        </main>

        <!-- Bottom Actions -->
        <footer class="sticky bottom-0 p-4 pb-8 bg-gradient-to-t from-green-50 to-transparent pt-8">
            <div class="flex gap-3">
                <a href="04-step-property.html" class="flex-1 py-4 border-2 border-gray-200 bg-white text-gray-700 font-semibold text-center rounded-2xl">
                    Back
                </a>
                <a href="06-step-technical.html" class="flex-1 py-4 bg-gradient-to-r from-primary to-secondary text-white font-semibold text-center rounded-2xl shadow-lg shadow-primary/25 flex items-center justify-center gap-2">
                    <span>Continue</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
                    </svg>
                </a>
            </div>
        </footer>

    </div>
</body>
</html>

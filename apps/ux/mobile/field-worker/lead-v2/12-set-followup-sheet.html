<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Set Follow-up | OneOhm Solar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#76c044',
              secondary: '#0d74b8',
            },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      @keyframes slideUp {
        from {
          transform: translateY(100%);
        }
        to {
          transform: translateY(0);
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .sheet-animate {
        animation: slideUp 0.3s ease-out forwards;
      }
      .backdrop-animate {
        animation: fadeIn 0.2s ease-out forwards;
      }
    </style>
  </head>
  <body class="bg-gray-900/50 min-h-screen">
    <!-- Backdrop -->
    <div
      class="fixed inset-0 bg-black/50 backdrop-animate"
      onclick="window.location.href = '08-success.html'"
    ></div>

    <!-- Bottom Sheet -->
    <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto sheet-animate">
      <div class="bg-white rounded-t-3xl overflow-hidden">
        <!-- Handle -->
        <div class="flex justify-center pt-3 pb-2">
          <div class="w-10 h-1 bg-gray-300 rounded-full"></div>
        </div>

        <!-- Header -->
        <div class="px-6 pb-4 border-b border-gray-100">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-xl font-bold text-gray-900">Set Follow-up</h2>
              <p class="text-sm text-gray-500 mt-0.5">Remind yourself to contact later</p>
            </div>
            <button
              onclick="window.location.href = '08-success.html'"
              class="p-2 -mr-2 text-gray-400 hover:text-gray-600"
            >
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M6 18L18 6M6 6l12 12"
                />
              </svg>
            </button>
          </div>
        </div>

        <!-- Property Context -->
        <div
          class="px-6 py-4 bg-gradient-to-r from-primary/5 to-secondary/5 border-b border-gray-100"
        >
          <div class="flex items-center gap-3">
            <div
              class="w-10 h-10 bg-gradient-to-br from-green-400 to-teal-500 rounded-full flex items-center justify-center text-white font-bold text-sm"
            >
              RK
            </div>
            <div class="flex-1">
              <p class="font-semibold text-gray-900 text-sm">Rajesh Kumar</p>
              <p class="text-xs text-gray-600">🏠 Home - MG Road, Sangli</p>
            </div>
            <span class="px-2 py-0.5 bg-amber-100 text-amber-600 text-[10px] font-bold rounded-full"
              >WARM</span
            >
          </div>
        </div>

        <!-- Form Content -->
        <div class="p-6 space-y-5">
          <!-- Follow-up Date -->
          <div>
            <label class="text-xs font-semibold text-gray-600 uppercase tracking-wide"
              >Follow-up Date <span class="text-red-500">*</span></label
            >
            <div class="mt-2 relative">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <svg
                  class="w-5 h-5 text-gray-400"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.5"
                    d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
                  />
                </svg>
              </div>
              <input
                type="date"
                class="w-full pl-12 pr-4 py-4 bg-white border-2 border-gray-100 rounded-2xl focus:border-primary focus:outline-none text-gray-900"
              />
            </div>
            <p class="text-xs text-gray-400 mt-1.5 ml-1">When should we remind you?</p>
          </div>

          <!-- Follow-up Notes -->
          <div>
            <label class="text-xs font-semibold text-gray-600 uppercase tracking-wide"
              >Notes <span class="text-gray-400 font-normal normal-case">(optional)</span></label
            >
            <div class="mt-2">
              <textarea
                rows="3"
                placeholder="What to discuss, action items, customer preferences..."
                class="w-full px-4 py-4 bg-white border-2 border-gray-100 rounded-2xl focus:border-primary focus:outline-none resize-none text-gray-900 placeholder-gray-400"
              ></textarea>
            </div>
          </div>

          <!-- Last Contact Info -->
          <div class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl">
            <div class="w-8 h-8 bg-green-100 rounded-full flex items-center justify-center">
              <svg class="w-4 h-4 text-green-600" fill="currentColor" viewBox="0 0 20 20">
                <path
                  fill-rule="evenodd"
                  d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                  clip-rule="evenodd"
                />
              </svg>
            </div>
            <div class="flex-1">
              <p class="text-xs text-gray-500">Last contact will be updated to</p>
              <p class="text-sm font-semibold text-gray-900">
                Today, <span id="currentTime">3:45 PM</span>
              </p>
            </div>
          </div>
        </div>

        <!-- Actions -->
        <div class="p-6 pt-0 pb-8 space-y-3">
          <a
            href="13-followup-success.html"
            class="block w-full py-4 bg-gradient-to-r from-primary to-secondary text-white font-semibold text-center rounded-2xl shadow-lg shadow-primary/25"
          >
            Set Follow-up
          </a>
          <button
            onclick="window.location.href = '08-success.html'"
            class="w-full py-3 text-gray-500 font-medium text-center"
          >
            Cancel
          </button>
        </div>
      </div>
    </div>

    <script>
      // Set current time
      const now = new Date();
      const hours = now.getHours();
      const minutes = now.getMinutes().toString().padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      const displayHours = hours % 12 || 12;
      document.getElementById('currentTime').textContent = `${displayHours}:${minutes} ${ampm}`;

      // Set default date to tomorrow
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      document.querySelector('input[type="date"]').valueAsDate = tomorrow;
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Lead - Step 6 - OneOhm Solar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#76c044',
                        secondary: '#0d74b8',
                        tagline: '#025580',
                        success: '#76c044',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl pb-8">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-primary via-green-500 to-secondary px-6 py-6 pt-12">
            <div class="flex items-center justify-between mb-6">
                <a href="lead-step5.html" class="inline-flex items-center text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                </a>
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-1 bg-white rounded-full"></div>
                    <div class="w-8 h-1 bg-white rounded-full"></div>
                    <div class="w-8 h-1 bg-white rounded-full"></div>
                    <div class="w-8 h-1 bg-white rounded-full"></div>
                    <div class="w-8 h-1 bg-white rounded-full"></div>
                    <div class="w-8 h-1 bg-white rounded-full"></div>
                </div>
            </div>
            <div class="mb-4">
                <p class="text-green-100 text-sm mb-1">Step 6 of 6</p>
                <h1 class="text-3xl font-bold text-white mb-2">Review & Submit</h1>
                <p class="text-green-100">Verify your information</p>
            </div>
        </div>

        <!-- Content -->
        <div class="px-6 py-8">
            
            <!-- Review Sections -->
            <div class="space-y-4">
                
                <!-- Basic Info Section -->
                <div class="bg-white border-2 border-gray-200 rounded-2xl p-5">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="font-bold text-gray-900 flex items-center">
                            <span class="w-8 h-8 bg-primary/10 rounded-full flex items-center justify-center text-primary font-bold text-sm mr-2">1</span>
                            Basic Information
                        </h3>
                        <a href="lead-step1.html" class="text-primary text-sm font-medium hover:underline">Edit</a>
                    </div>
                    <div id="step1Summary" class="space-y-2 text-sm"></div>
                </div>

                <!-- Consumer Details Section -->
                <div class="bg-white border-2 border-gray-200 rounded-2xl p-5">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="font-bold text-gray-900 flex items-center">
                            <span class="w-8 h-8 bg-primary/10 rounded-full flex items-center justify-center text-primary font-bold text-sm mr-2">2</span>
                            Consumer Details
                        </h3>
                        <a href="lead-step2.html" class="text-primary text-sm font-medium hover:underline">Edit</a>
                    </div>
                    <div id="step2Summary" class="space-y-2 text-sm"></div>
                </div>

                <!-- Technical Details Section -->
                <div class="bg-white border-2 border-gray-200 rounded-2xl p-5">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="font-bold text-gray-900 flex items-center">
                            <span class="w-8 h-8 bg-primary/10 rounded-full flex items-center justify-center text-primary font-bold text-sm mr-2">3</span>
                            Technical Details
                        </h3>
                        <a href="lead-step3.html" class="text-primary text-sm font-medium hover:underline">Edit</a>
                    </div>
                    <div id="step3Summary" class="space-y-2 text-sm"></div>
                </div>

                <!-- Product Preferences Section -->
                <div class="bg-white border-2 border-gray-200 rounded-2xl p-5">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="font-bold text-gray-900 flex items-center">
                            <span class="w-8 h-8 bg-primary/10 rounded-full flex items-center justify-center text-primary font-bold text-sm mr-2">4</span>
                            Product Preferences
                        </h3>
                        <a href="lead-step4.html" class="text-primary text-sm font-medium hover:underline">Edit</a>
                    </div>
                    <div id="step4Summary" class="space-y-2 text-sm"></div>
                </div>

                <!-- Documents Section -->
                <div class="bg-white border-2 border-gray-200 rounded-2xl p-5">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="font-bold text-gray-900 flex items-center">
                            <span class="w-8 h-8 bg-primary/10 rounded-full flex items-center justify-center text-primary font-bold text-sm mr-2">5</span>
                            Documents
                        </h3>
                        <a href="lead-step5.html" class="text-primary text-sm font-medium hover:underline">Edit</a>
                    </div>
                    <div id="step5Summary" class="space-y-2 text-sm"></div>
                </div>

            </div>

            <!-- Terms & Conditions -->
            <form id="submitForm" onsubmit="handleSubmit(event)" class="mt-6">
                <div class="bg-gray-50 border-2 border-gray-200 rounded-2xl p-5 mb-6">
                    <div class="flex items-start space-x-3">
                        <input type="checkbox" id="terms" name="terms" class="w-5 h-5 text-primary border-gray-300 rounded focus:ring-primary mt-0.5" required />
                        <label for="terms" class="text-sm text-gray-700 leading-relaxed">
                            I agree to the <a href="#" class="text-primary font-medium hover:underline">Terms of Service</a> and <a href="#" class="text-primary font-medium hover:underline">Privacy Policy</a>. I authorize OneOhm to contact me regarding this solar installation inquiry.
                        </label>
                    </div>
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    class="w-full bg-gradient-to-r from-success via-green-600 to-green-700 text-white font-bold py-5 px-6 rounded-2xl shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all duration-200 flex items-center justify-center space-x-2"
                >
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span>Submit Lead</span>
                </button>
            </form>

            <!-- Info Box -->
            <div class="mt-6 bg-blue-50 border border-blue-100 rounded-lg p-4">
                <div class="flex items-start space-x-3">
                    <svg class="w-5 h-5 text-blue-600 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
                    </svg>
                    <p class="text-sm text-blue-800 leading-relaxed">
                        <strong class="font-semibold">What's next?</strong> Our team will review your inquiry and contact you within 24 hours to discuss your solar installation.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function displaySummary(step, data, containerId) {
            const container = document.getElementById(containerId);
            let html = '';
            
            for (const [key, value] of Object.entries(data)) {
                if (value) {
                    const label = key.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase());
                    html += `
                        <div class="flex justify-between py-1">
                            <span class="text-gray-600">${label}:</span>
                            <span class="text-gray-900 font-medium text-right">${value}</span>
                        </div>
                    `;
                }
            }
            container.innerHTML = html;
        }

        window.addEventListener('load', () => {
            // Load all step data
            const step1 = JSON.parse(localStorage.getItem('leadFormStep1') || '{}');
            const step2 = JSON.parse(localStorage.getItem('leadFormStep2') || '{}');
            const step3 = JSON.parse(localStorage.getItem('leadFormStep3') || '{}');
            const step4 = JSON.parse(localStorage.getItem('leadFormStep4') || '{}');
            const step5 = JSON.parse(localStorage.getItem('leadFormStep5') || '{}');

            // Display summaries
            displaySummary(1, step1, 'step1Summary');
            displaySummary(2, step2, 'step2Summary');
            displaySummary(3, step3, 'step3Summary');
            displaySummary(4, step4, 'step4Summary');
            displaySummary(5, step5, 'step5Summary');
        });

        function handleSubmit(event) {
            event.preventDefault();
            
            if (!document.getElementById('terms').checked) {
                alert('Please accept the terms and conditions');
                return;
            }

            // Collect all data
            const leadData = {
                step1: JSON.parse(localStorage.getItem('leadFormStep1') || '{}'),
                step2: JSON.parse(localStorage.getItem('leadFormStep2') || '{}'),
                step3: JSON.parse(localStorage.getItem('leadFormStep3') || '{}'),
                step4: JSON.parse(localStorage.getItem('leadFormStep4') || '{}'),
                step5: JSON.parse(localStorage.getItem('leadFormStep5') || '{}'),
                submittedAt: new Date().toISOString()
            };

            console.log('Complete Lead Data:', leadData);

            // In real app, this would POST to API
            // For demo, save to localStorage
            const leads = JSON.parse(localStorage.getItem('submittedLeads') || '[]');
            leads.push(leadData);
            localStorage.setItem('submittedLeads', JSON.stringify(leads));

            // Show success page
            window.location.href = 'lead-success.html';
        }
    </script>
</body>
</html>

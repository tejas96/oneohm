<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EA580C;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#grad)"/>
  <g fill="white">
    <!-- Sun rays -->
    <line x1="32" y1="12" x2="32" y2="16" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="32" y1="48" x2="32" y2="52" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="32" x2="16" y2="32" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="48" y1="32" x2="52" y2="32" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="18" y1="18" x2="21" y2="21" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="43" y1="43" x2="46" y2="46" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="46" y1="18" x2="43" y2="21" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="21" y1="43" x2="18" y2="46" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <!-- Sun circle -->
    <circle cx="32" cy="32" r="10" fill="white"/>
  </g>
</svg>

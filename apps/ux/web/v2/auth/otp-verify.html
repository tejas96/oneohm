<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - OneOhm Solar EPC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#76c044',
                        'primary-dark': '#5ea031',
                        'primary-light': '#8fd055',
                        secondary: '#0d74b8',
                        'secondary-dark': '#025580',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .otp-input:focus {
            border-color: #76c044;
            box-shadow: 0 0 0 4px rgba(118, 192, 68, 0.1);
        }
        .gradient-text {
            background: linear-gradient(135deg, #76c044 0%, #0d74b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <!-- Background Pattern -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -right-40 w-80 h-80 bg-primary/5 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-secondary/5 rounded-full blur-3xl"></div>
    </div>

    <div class="relative w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <img src="../assets/oneohmlogo.png" alt="OneOhm - Solar EPC Platform" class="h-14 w-auto object-contain mx-auto">
        </div>

        <!-- OTP Card -->
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <!-- Icon -->
            <div class="flex justify-center mb-6">
                <div class="w-20 h-20 bg-primary/10 rounded-full flex items-center justify-center">
                    <svg class="w-10 h-10 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/>
                    </svg>
                </div>
            </div>

            <!-- Heading -->
            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold text-gray-900 mb-2">Verify OTP</h2>
                <p class="text-gray-500 text-sm">
                    Enter the 6-digit code sent to<br>
                    <span class="font-semibold text-gray-700">+91 98765 *****</span>
                </p>
            </div>

            <!-- OTP Input Boxes -->
            <form id="otpForm">
                <div class="flex justify-center space-x-3 mb-6">
                    <input type="text" maxlength="1" class="otp-input w-12 h-14 text-center text-2xl font-bold border-2 border-gray-200 rounded-xl focus:outline-none transition-all" data-index="0">
                    <input type="text" maxlength="1" class="otp-input w-12 h-14 text-center text-2xl font-bold border-2 border-gray-200 rounded-xl focus:outline-none transition-all" data-index="1">
                    <input type="text" maxlength="1" class="otp-input w-12 h-14 text-center text-2xl font-bold border-2 border-gray-200 rounded-xl focus:outline-none transition-all" data-index="2">
                    <input type="text" maxlength="1" class="otp-input w-12 h-14 text-center text-2xl font-bold border-2 border-gray-200 rounded-xl focus:outline-none transition-all" data-index="3">
                    <input type="text" maxlength="1" class="otp-input w-12 h-14 text-center text-2xl font-bold border-2 border-gray-200 rounded-xl focus:outline-none transition-all" data-index="4">
                    <input type="text" maxlength="1" class="otp-input w-12 h-14 text-center text-2xl font-bold border-2 border-gray-200 rounded-xl focus:outline-none transition-all" data-index="5">
                </div>

                <!-- Timer -->
                <div class="text-center mb-6">
                    <div id="timerSection" class="flex items-center justify-center space-x-2 text-gray-500">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <span class="text-sm">Resend OTP in <span id="timer" class="font-semibold text-primary">00:45</span></span>
                    </div>
                    <button type="button" id="resendBtn" class="hidden text-sm font-semibold text-primary hover:text-primary-dark transition-colors">
                        Resend OTP
                    </button>
                </div>

                <!-- Verify Button -->
                <button type="submit" class="w-full bg-gradient-to-r from-primary to-primary-dark hover:from-primary-dark hover:to-primary text-white font-semibold py-3.5 px-4 rounded-xl transition-all duration-200 transform hover:scale-[1.02] shadow-lg hover:shadow-xl mb-4">
                    Verify & Login
                </button>

                <!-- Change Number Link -->
                <div class="text-center">
                    <a href="login.html" class="inline-flex items-center text-sm text-gray-500 hover:text-primary transition-colors">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                        </svg>
                        Change phone number
                    </a>
                </div>
            </form>
        </div>

        <!-- Help Text -->
        <div class="mt-6 text-center">
            <p class="text-sm text-gray-500">
                Didn't receive the code? Check your spam folder or 
                <a href="#" class="text-primary hover:text-primary-dark font-medium">contact support</a>
            </p>
        </div>

        <!-- Footer -->
        <div class="mt-8 text-center text-sm text-gray-400">
            <p>© 2026 OneOhm Solar. All rights reserved.</p>
        </div>
    </div>

    <script>
        // OTP Input Auto-focus
        const inputs = document.querySelectorAll('.otp-input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const value = e.target.value;
                if (value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });

            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text').slice(0, 6);
                pastedData.split('').forEach((char, i) => {
                    if (inputs[i]) {
                        inputs[i].value = char;
                    }
                });
                if (pastedData.length === 6) {
                    inputs[5].focus();
                }
            });
        });

        // Timer Countdown
        let timeLeft = 45;
        const timerElement = document.getElementById('timer');
        const timerSection = document.getElementById('timerSection');
        const resendBtn = document.getElementById('resendBtn');

        const countdown = setInterval(() => {
            timeLeft--;
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerElement.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerSection.classList.add('hidden');
                resendBtn.classList.remove('hidden');
            }
        }, 1000);

        // Resend OTP
        resendBtn.addEventListener('click', () => {
            timeLeft = 45;
            timerSection.classList.remove('hidden');
            resendBtn.classList.add('hidden');
            
            const newCountdown = setInterval(() => {
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerElement.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                
                if (timeLeft <= 0) {
                    clearInterval(newCountdown);
                    timerSection.classList.add('hidden');
                    resendBtn.classList.remove('hidden');
                }
            }, 1000);
        });
    </script>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify OTP - OneOhm Solar EPC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: '#76c044',
                dark: '#5ea031',
                light: '#8fd35f',
              },
              secondary: {
                DEFAULT: '#0d74b8',
                dark: '#0a5c92',
              },
              success: '#22c55e',
              warning: '#eab308',
              error: '#dc2626',
              info: '#0ea5e9',
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: 'Inter', system-ui, sans-serif;
      }

      .otp-input:focus {
        border-color: #76c044;
        box-shadow: 0 0 0 3px rgba(118, 192, 68, 0.1);
      }

      .otp-input.error {
        border-color: #dc2626;
        box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
      }

      .otp-input.success {
        border-color: #76c044;
        background-color: #f3fae8;
      }

      .gradient-text {
        background: linear-gradient(135deg, #76c044 0%, #0d74b8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      input:focus-visible,
      button:focus-visible {
        outline: 2px solid #76c044;
        outline-offset: 2px;
      }

      /* Loading spinner */
      .spinner {
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Shake animation for errors */
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        10%,
        30%,
        50%,
        70%,
        90% {
          transform: translateX(-4px);
        }
        20%,
        40%,
        60%,
        80% {
          transform: translateX(4px);
        }
      }

      .shake {
        animation: shake 0.5s ease-in-out;
      }

      /* Success animation */
      @keyframes pop {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
        100% {
          transform: scale(1);
        }
      }

      .pop {
        animation: pop 0.3s ease-in-out;
      }
    </style>
  </head>
  <body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <!-- Background Pattern -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
      <div class="absolute -top-40 -right-40 w-80 h-80 bg-primary/5 rounded-full blur-3xl"></div>
      <div
        class="absolute -bottom-40 -left-40 w-80 h-80 bg-secondary/5 rounded-full blur-3xl"
      ></div>
    </div>

    <div class="relative w-full max-w-md">
      <!-- Logo -->
      <div class="text-center mb-8">
        <img
          src="../assets/oneohmlogo.png"
          alt="OneOhm - Solar EPC Platform"
          class="h-14 w-auto object-contain mx-auto"
        />
      </div>

      <!-- OTP Card -->
      <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-6">
        <!-- Icon -->
        <div class="flex justify-center mb-5">
          <div class="w-16 h-16 bg-primary/10 rounded-full flex items-center justify-center">
            <svg class="w-8 h-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"
              />
            </svg>
          </div>
        </div>

        <!-- Heading -->
        <div class="text-center mb-6">
          <h2 class="text-xl font-semibold text-gray-900 mb-1">Verify OTP</h2>
          <p class="text-gray-500 text-[13px]">
            Enter the 6-digit code sent to<br />
            <span class="font-medium text-gray-700">+91 98765 *****</span>
          </p>
        </div>

        <!-- OTP Input Boxes -->
        <form id="otpForm" onsubmit="handleVerifyOTP(event)">
          <!-- Error Alert -->
          <div
            id="otpError"
            class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-[13px] flex items-center gap-2"
            role="alert"
          >
            <svg
              class="w-4 h-4 flex-shrink-0"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
              />
            </svg>
            <span id="otpErrorText">Invalid OTP. Please try again.</span>
          </div>

          <div id="otpInputs" class="flex justify-center gap-2 mb-5">
            <input
              type="text"
              maxlength="1"
              inputmode="numeric"
              pattern="[0-9]"
              aria-label="OTP digit 1"
              class="otp-input w-11 h-12 text-center text-lg font-semibold border border-gray-200 rounded-lg focus:outline-none transition-all"
              data-index="0"
            />
            <input
              type="text"
              maxlength="1"
              inputmode="numeric"
              pattern="[0-9]"
              aria-label="OTP digit 2"
              class="otp-input w-11 h-12 text-center text-lg font-semibold border border-gray-200 rounded-lg focus:outline-none transition-all"
              data-index="1"
            />
            <input
              type="text"
              maxlength="1"
              inputmode="numeric"
              pattern="[0-9]"
              aria-label="OTP digit 3"
              class="otp-input w-11 h-12 text-center text-lg font-semibold border border-gray-200 rounded-lg focus:outline-none transition-all"
              data-index="2"
            />
            <input
              type="text"
              maxlength="1"
              inputmode="numeric"
              pattern="[0-9]"
              aria-label="OTP digit 4"
              class="otp-input w-11 h-12 text-center text-lg font-semibold border border-gray-200 rounded-lg focus:outline-none transition-all"
              data-index="3"
            />
            <input
              type="text"
              maxlength="1"
              inputmode="numeric"
              pattern="[0-9]"
              aria-label="OTP digit 5"
              class="otp-input w-11 h-12 text-center text-lg font-semibold border border-gray-200 rounded-lg focus:outline-none transition-all"
              data-index="4"
            />
            <input
              type="text"
              maxlength="1"
              inputmode="numeric"
              pattern="[0-9]"
              aria-label="OTP digit 6"
              class="otp-input w-11 h-12 text-center text-lg font-semibold border border-gray-200 rounded-lg focus:outline-none transition-all"
              data-index="5"
            />
          </div>

          <!-- Timer -->
          <div class="text-center mb-5">
            <div id="timerSection" class="flex items-center justify-center gap-1.5 text-gray-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
                />
              </svg>
              <span class="text-[13px]"
                >Resend OTP in <span id="timer" class="font-medium text-primary">00:45</span></span
              >
            </div>
            <button
              type="button"
              id="resendBtn"
              class="hidden text-[13px] font-medium text-primary hover:text-primary-dark transition-colors"
            >
              Resend OTP
            </button>
          </div>

          <!-- Verify Button -->
          <button
            type="submit"
            id="verifyBtn"
            class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-primary to-primary-dark hover:from-primary-dark hover:to-primary text-white font-medium py-2.5 px-4 rounded-lg transition-all duration-200 shadow-sm hover:shadow disabled:opacity-60 disabled:cursor-not-allowed mb-4"
          >
            <span id="verifyBtnText">Verify & Login</span>
            <div id="verifySpinner" class="spinner hidden"></div>
          </button>

          <!-- Change Number Link -->
          <div class="text-center">
            <a
              href="login.html"
              class="inline-flex items-center text-[13px] text-gray-500 hover:text-primary transition-colors"
            >
              <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 19l-7-7 7-7"
                />
              </svg>
              Change phone number
            </a>
          </div>
        </form>
      </div>

      <!-- Help Text -->
      <div class="mt-5 text-center">
        <p class="text-[13px] text-gray-500">
          Didn't receive the code? Check your SMS or
          <a href="#" class="text-primary hover:text-primary-dark font-medium">contact support</a>
        </p>
      </div>

      <!-- Footer -->
      <div class="mt-8 text-center text-sm text-gray-400">
        <p>© 2026 OneOhm Solar. All rights reserved.</p>
      </div>
    </div>

    <script>
      // OTP Input Auto-focus
      const inputs = document.querySelectorAll('.otp-input');

      inputs.forEach((input, index) => {
        // Only allow numeric input
        input.addEventListener('input', (e) => {
          const value = e.target.value.replace(/[^0-9]/g, '');
          e.target.value = value;

          // Clear error state on input
          clearOtpError();

          if (value.length === 1 && index < inputs.length - 1) {
            inputs[index + 1].focus();
          }

          // Check if all inputs filled
          checkOtpComplete();
        });

        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !e.target.value && index > 0) {
            inputs[index - 1].focus();
          }
        });

        input.addEventListener('paste', (e) => {
          e.preventDefault();
          const pastedData = e.clipboardData
            .getData('text')
            .replace(/[^0-9]/g, '')
            .slice(0, 6);
          pastedData.split('').forEach((char, i) => {
            if (inputs[i]) {
              inputs[i].value = char;
            }
          });
          if (pastedData.length === 6) {
            inputs[5].focus();
            checkOtpComplete();
          }
        });
      });

      function checkOtpComplete() {
        const allFilled = Array.from(inputs).every((input) => input.value.length === 1);
        if (allFilled) {
          // Add success styling
          inputs.forEach((input) => {
            input.classList.add('success', 'pop');
          });
        }
      }

      function clearOtpError() {
        document.getElementById('otpError').classList.add('hidden');
        inputs.forEach((input) => {
          input.classList.remove('error', 'success');
        });
      }

      function showOtpError(message) {
        const errorDiv = document.getElementById('otpError');
        const errorText = document.getElementById('otpErrorText');
        const inputsContainer = document.getElementById('otpInputs');

        errorText.textContent = message;
        errorDiv.classList.remove('hidden');
        inputsContainer.classList.add('shake');

        inputs.forEach((input) => {
          input.classList.add('error');
          input.classList.remove('success');
        });

        setTimeout(() => inputsContainer.classList.remove('shake'), 500);
      }

      function setVerifyLoading(isLoading) {
        const btn = document.getElementById('verifyBtn');
        const text = document.getElementById('verifyBtnText');
        const spinner = document.getElementById('verifySpinner');

        if (isLoading) {
          btn.disabled = true;
          text.textContent = 'Verifying...';
          spinner.classList.remove('hidden');
        } else {
          btn.disabled = false;
          text.textContent = 'Verify & Login';
          spinner.classList.add('hidden');
        }
      }

      function handleVerifyOTP(event) {
        event.preventDefault();

        const otp = Array.from(inputs)
          .map((input) => input.value)
          .join('');

        if (otp.length !== 6) {
          showOtpError('Please enter all 6 digits');
          return;
        }

        setVerifyLoading(true);

        // Simulate API call
        setTimeout(() => {
          // For demo: success - redirect to dashboard
          window.location.href = '../dashboard/index.html';

          // For demo: error case
          // setVerifyLoading(false);
          // showOtpError('Invalid OTP. Please try again.');
        }, 1500);
      }

      // Timer Countdown
      let timeLeft = 45;
      const timerElement = document.getElementById('timer');
      const timerSection = document.getElementById('timerSection');
      const resendBtn = document.getElementById('resendBtn');

      function startTimer() {
        const countdown = setInterval(() => {
          timeLeft--;
          const minutes = Math.floor(timeLeft / 60);
          const seconds = timeLeft % 60;
          timerElement.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

          if (timeLeft <= 0) {
            clearInterval(countdown);
            timerSection.classList.add('hidden');
            resendBtn.classList.remove('hidden');
          }
        }, 1000);
        return countdown;
      }

      let currentCountdown = startTimer();

      // Resend OTP
      resendBtn.addEventListener('click', () => {
        // Clear inputs
        inputs.forEach((input) => {
          input.value = '';
          input.classList.remove('error', 'success');
        });
        inputs[0].focus();

        // Clear error
        clearOtpError();

        // Reset timer
        timeLeft = 45;
        timerSection.classList.remove('hidden');
        resendBtn.classList.add('hidden');
        currentCountdown = startTimer();
      });

      // Focus first input on load
      inputs[0].focus();
    </script>
  </body>
</html>

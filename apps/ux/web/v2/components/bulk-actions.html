<!-- 
    Bulk Actions Component
    Usage: Include this at the top of list pages when items are selected
    Requires Tailwind CSS
-->

<!-- Bulk Actions Bar (appears when items are selected) -->
<div id="bulkActionsBar" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-40">
  <div
    class="flex items-center gap-4 px-4 py-2 bg-gray-900 text-white rounded-lg shadow-2xl shadow-black/30"
  >
    <!-- Selection Count -->
    <div class="flex items-center gap-3 pr-4 border-r border-gray-700">
      <div
        class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center font-bold text-sm"
        id="selectedCount"
      >
        5
      </div>
      <span class="text-sm font-medium">selected</span>
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-2">
      <!-- Change Status -->
      <div class="relative">
        <button
          onclick="toggleBulkDropdown('statusDropdown')"
          class="flex items-center gap-2 px-4 py-2 hover:bg-gray-800 rounded-lg transition-colors text-sm font-medium"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
          Status
          <svg class="w-3 h-3 opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            />
          </svg>
        </button>
        <div
          id="statusDropdown"
          class="hidden absolute bottom-full left-0 mb-2 w-48 bg-white rounded-lg shadow-md border border-gray-100 py-2 text-gray-900"
        >
          <button
            onclick="bulkUpdateStatus('contacted')"
            class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 flex items-center gap-2"
          >
            <span class="w-2 h-2 rounded-full bg-blue-500"></span>
            Contacted
          </button>
          <button
            onclick="bulkUpdateStatus('qualified')"
            class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 flex items-center gap-2"
          >
            <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
            Qualified
          </button>
          <button
            onclick="bulkUpdateStatus('site_visit_scheduled')"
            class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 flex items-center gap-2"
          >
            <span class="w-2 h-2 rounded-full bg-purple-500"></span>
            Site Visit Scheduled
          </button>
          <button
            onclick="bulkUpdateStatus('quotation_sent')"
            class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 flex items-center gap-2"
          >
            <span class="w-2 h-2 rounded-full bg-cyan-500"></span>
            Quotation Sent
          </button>
          <div class="border-t border-gray-100 my-1"></div>
          <button
            onclick="bulkUpdateStatus('lost')"
            class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 flex items-center gap-2 text-red-600"
          >
            <span class="w-2 h-2 rounded-full bg-red-500"></span>
            Mark as Lost
          </button>
        </div>
      </div>

      <!-- Change Temperature -->
      <div class="relative">
        <button
          onclick="toggleBulkDropdown('tempDropdown')"
          class="flex items-center gap-2 px-4 py-2 hover:bg-gray-800 rounded-lg transition-colors text-sm font-medium"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z"
            />
          </svg>
          Temperature
          <svg class="w-3 h-3 opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            />
          </svg>
        </button>
        <div
          id="tempDropdown"
          class="hidden absolute bottom-full left-0 mb-2 w-40 bg-white rounded-lg shadow-md border border-gray-100 py-2 text-gray-900"
        >
          <button
            onclick="bulkUpdateTemperature('hot')"
            class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 flex items-center gap-2"
          >
            <span class="w-3 h-3 rounded-full bg-red-500"></span>
            Hot
          </button>
          <button
            onclick="bulkUpdateTemperature('warm')"
            class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 flex items-center gap-2"
          >
            <span class="w-3 h-3 rounded-full bg-yellow-500"></span>
            Warm
          </button>
          <button
            onclick="bulkUpdateTemperature('cold')"
            class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 flex items-center gap-2"
          >
            <span class="w-3 h-3 rounded-full bg-blue-400"></span>
            Cold
          </button>
        </div>
      </div>

      <!-- Assign To -->
      <div class="relative">
        <button
          onclick="toggleBulkDropdown('assignDropdown')"
          class="flex items-center gap-2 px-4 py-2 hover:bg-gray-800 rounded-lg transition-colors text-sm font-medium"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
            />
          </svg>
          Assign
          <svg class="w-3 h-3 opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            />
          </svg>
        </button>
        <div
          id="assignDropdown"
          class="hidden absolute bottom-full left-0 mb-2 w-56 bg-white rounded-lg shadow-md border border-gray-100 py-2 text-gray-900"
        >
          <div class="px-3 py-2">
            <input
              type="text"
              placeholder="Search team members..."
              class="w-full px-3 py-1.5 text-sm border border-gray-100 rounded-lg focus:outline-none focus:border-primary"
            />
          </div>
          <div class="max-h-48 overflow-y-auto">
            <button
              onclick="bulkAssign('user1')"
              class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 flex items-center gap-3"
            >
              <div
                class="w-7 h-7 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-medium text-xs"
              >
                RK
              </div>
              <span>Rohit Kumar</span>
            </button>
            <button
              onclick="bulkAssign('user2')"
              class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 flex items-center gap-3"
            >
              <div
                class="w-7 h-7 rounded-full bg-green-100 flex items-center justify-center text-green-600 font-medium text-xs"
              >
                AP
              </div>
              <span>Amit Patel</span>
            </button>
            <button
              onclick="bulkAssign('user3')"
              class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 flex items-center gap-3"
            >
              <div
                class="w-7 h-7 rounded-full bg-purple-100 flex items-center justify-center text-purple-600 font-medium text-xs"
              >
                SK
              </div>
              <span>Suresh Kumar</span>
            </button>
          </div>
        </div>
      </div>

      <!-- More Actions -->
      <div class="relative">
        <button
          onclick="toggleBulkDropdown('moreDropdown')"
          class="flex items-center gap-2 px-4 py-2 hover:bg-gray-800 rounded-lg transition-colors text-sm font-medium"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M5 12h.01M12 12h.01M19 12h.01M6 12a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0z"
            />
          </svg>
          More
          <svg class="w-3 h-3 opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            />
          </svg>
        </button>
        <div
          id="moreDropdown"
          class="hidden absolute bottom-full right-0 mb-2 w-48 bg-white rounded-lg shadow-md border border-gray-100 py-2 text-gray-900"
        >
          <button
            onclick="bulkExport()"
            class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 flex items-center gap-2"
          >
            <svg
              class="w-4 h-4 text-gray-500"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"
              />
            </svg>
            Export Selected
          </button>
          <button
            onclick="bulkSendSMS()"
            class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 flex items-center gap-2"
          >
            <svg
              class="w-4 h-4 text-gray-500"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"
              />
            </svg>
            Send Bulk SMS
          </button>
          <button
            onclick="bulkScheduleFollowup()"
            class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 flex items-center gap-2"
          >
            <svg
              class="w-4 h-4 text-gray-500"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
              />
            </svg>
            Schedule Follow-up
          </button>
          <div class="border-t border-gray-100 my-1"></div>
          <button
            onclick="bulkDelete()"
            class="w-full px-4 py-2 text-left text-sm hover:bg-red-50 text-red-600 flex items-center gap-2"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
              />
            </svg>
            Delete Selected
          </button>
        </div>
      </div>
    </div>

    <!-- Close Button -->
    <button
      onclick="clearSelection()"
      class="ml-2 p-2 hover:bg-gray-800 rounded-lg transition-colors"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M6 18L18 6M6 6l12 12"
        />
      </svg>
    </button>
  </div>
</div>

<!-- Table Header with Select All (for integration with list pages) -->
<div class="bulk-select-header hidden">
  <div class="flex items-center gap-4 px-3 py-2 bg-primary/5 border-b border-primary/20">
    <label class="flex items-center gap-3 cursor-pointer">
      <input
        type="checkbox"
        id="selectAll"
        onchange="toggleSelectAll(this)"
        class="w-4 h-4 rounded border-gray-300 text-primary focus:ring-primary"
      />
      <span class="text-xs font-medium text-gray-500">Select All</span>
    </label>
    <span class="text-sm text-gray-500">|</span>
    <span class="text-sm text-gray-500"><span id="selectionInfo">0</span> of 25 selected</span>
  </div>
</div>

<script>
  let selectedItems = new Set();

  function toggleItemSelection(itemId, checkbox) {
    if (checkbox.checked) {
      selectedItems.add(itemId);
    } else {
      selectedItems.delete(itemId);
    }
    updateBulkActionsBar();
  }

  function toggleSelectAll(checkbox) {
    const allCheckboxes = document.querySelectorAll('.item-checkbox');
    allCheckboxes.forEach((cb) => {
      cb.checked = checkbox.checked;
      const itemId = cb.dataset.itemId;
      if (checkbox.checked) {
        selectedItems.add(itemId);
      } else {
        selectedItems.delete(itemId);
      }
    });
    updateBulkActionsBar();
  }

  function updateBulkActionsBar() {
    const bar = document.getElementById('bulkActionsBar');
    const countEl = document.getElementById('selectedCount');
    const infoEl = document.getElementById('selectionInfo');

    if (selectedItems.size > 0) {
      bar.classList.remove('hidden');
      countEl.textContent = selectedItems.size;
      if (infoEl) infoEl.textContent = selectedItems.size;
    } else {
      bar.classList.add('hidden');
    }
  }

  function clearSelection() {
    selectedItems.clear();
    document.querySelectorAll('.item-checkbox').forEach((cb) => (cb.checked = false));
    document.getElementById('selectAll').checked = false;
    updateBulkActionsBar();
  }

  function toggleBulkDropdown(dropdownId) {
    // Close all other dropdowns
    ['statusDropdown', 'tempDropdown', 'assignDropdown', 'moreDropdown'].forEach((id) => {
      if (id !== dropdownId) {
        document.getElementById(id).classList.add('hidden');
      }
    });

    // Toggle the clicked dropdown
    document.getElementById(dropdownId).classList.toggle('hidden');
  }

  function bulkUpdateStatus(status) {
    console.log(`Updating ${selectedItems.size} items to status: ${status}`);
    alert(`${selectedItems.size} items updated to "${status}"`);
    document.getElementById('statusDropdown').classList.add('hidden');
    clearSelection();
  }

  function bulkUpdateTemperature(temperature) {
    console.log(`Updating ${selectedItems.size} items to temperature: ${temperature}`);
    alert(`${selectedItems.size} items updated to "${temperature}"`);
    document.getElementById('tempDropdown').classList.add('hidden');
    clearSelection();
  }

  function bulkAssign(userId) {
    console.log(`Assigning ${selectedItems.size} items to user: ${userId}`);
    alert(`${selectedItems.size} items assigned`);
    document.getElementById('assignDropdown').classList.add('hidden');
    clearSelection();
  }

  function bulkExport() {
    console.log(`Exporting ${selectedItems.size} items`);
    alert(`Exporting ${selectedItems.size} items...`);
    document.getElementById('moreDropdown').classList.add('hidden');
  }

  function bulkSendSMS() {
    console.log(`Sending SMS to ${selectedItems.size} customers`);
    alert(`SMS will be sent to ${selectedItems.size} customers`);
    document.getElementById('moreDropdown').classList.add('hidden');
  }

  function bulkScheduleFollowup() {
    console.log(`Scheduling follow-up for ${selectedItems.size} items`);
    alert(`Opening follow-up scheduler for ${selectedItems.size} items...`);
    document.getElementById('moreDropdown').classList.add('hidden');
  }

  function bulkDelete() {
    if (
      confirm(
        `Are you sure you want to delete ${selectedItems.size} items? This action cannot be undone.`,
      )
    ) {
      console.log(`Deleting ${selectedItems.size} items`);
      alert(`${selectedItems.size} items deleted`);
      clearSelection();
    }
    document.getElementById('moreDropdown').classList.add('hidden');
  }

  // Close dropdowns when clicking outside
  document.addEventListener('click', function (e) {
    if (!e.target.closest('#bulkActionsBar')) {
      ['statusDropdown', 'tempDropdown', 'assignDropdown', 'moreDropdown'].forEach((id) => {
        document.getElementById(id)?.classList.add('hidden');
      });
    }
  });
</script>

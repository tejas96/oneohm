<!-- 
    Status Transition Component
    Usage: Include this file and call openStatusTransitionModal(currentStatus, options)
    Requires Tailwind CSS
-->

<!-- Status Transition Modal -->
<div id="statusTransitionModal" class="fixed inset-0 z-50 hidden" aria-modal="true" role="dialog">
    <div class="fixed inset-0 bg-black/50 backdrop-blur-sm" onclick="closeStatusTransitionModal()"></div>
    <div class="fixed inset-0 overflow-y-auto">
        <div class="flex min-h-full items-center justify-center p-4">
            <div class="relative w-full max-w-md bg-white rounded-lg shadow-xl">
                <!-- Header -->
                <div class="px-6 py-4 border-b border-gray-100">
                    <h2 class="text-lg font-semibold text-gray-900">Update Status</h2>
                    <p class="text-sm text-gray-500 mt-1">Change the customer's pipeline status</p>
                </div>
                
                <!-- Current Status -->
                <div class="px-6 py-4 bg-gray-50 border-b border-gray-100">
                    <div class="flex items-center gap-3">
                        <span class="text-sm text-gray-500">Current:</span>
                        <span id="currentStatusBadge" class="px-3 py-1 text-sm font-medium rounded-full bg-blue-100 text-blue-700">Contacted</span>
                    </div>
                </div>
                
                <!-- Status Options -->
                <div class="p-6">
                    <div class="text-xs font-medium text-gray-500 mb-3">Select new status:</div>
                    <div class="space-y-2" id="statusOptions">
                        <!-- Status options will be populated by JS -->
                    </div>
                </div>
                
                <!-- Reason Section (for Lost/Cancelled) -->
                <div id="reasonSection" class="hidden px-6 pb-4">
                    <div class="p-4 bg-red-50 border border-red-100 rounded-lg">
                        <div class="space-y-3">
                            <label class="block text-sm font-medium text-red-800">Reason for marking as Lost <span class="text-red-500">*</span></label>
                            <select id="lostReason" 
                                class="w-full px-3 py-2 border border-red-200 rounded-lg text-sm focus:outline-none focus:border-red-400 focus:ring-2 focus:ring-red-100 bg-white">
                                <option value="">Select reason...</option>
                                <option value="price_too_high">Price too high</option>
                                <option value="chose_competitor">Chose competitor</option>
                                <option value="not_interested">No longer interested</option>
                                <option value="financial_constraints">Financial constraints</option>
                                <option value="property_issues">Property not suitable</option>
                                <option value="no_response">No response</option>
                                <option value="other">Other</option>
                            </select>
                            <textarea id="lostNotes" rows="2" placeholder="Additional notes..."
                                class="w-full px-3 py-2 border border-red-200 rounded-lg text-sm focus:outline-none focus:border-red-400 focus:ring-2 focus:ring-red-100 resize-none"></textarea>
                        </div>
                    </div>
                </div>
                
                <!-- Confirmation for Converted -->
                <div id="convertedSection" class="hidden px-6 pb-4">
                    <div class="p-4 bg-green-50 border border-green-100 rounded-lg">
                        <div class="flex items-start gap-3">
                            <div class="w-10 h-10 rounded-full bg-green-100 flex items-center justify-center flex-shrink-0">
                                <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                                </svg>
                            </div>
                            <div>
                                <div class="font-medium text-green-800">Converting to Customer</div>
                                <div class="text-sm text-green-600 mt-1">This will mark the lead as converted and create a project for installation tracking.</div>
                            </div>
                        </div>
                        <div class="mt-4 space-y-3">
                            <div class="space-y-2">
                                <label class="block text-sm font-medium text-green-800">Quote Reference</label>
                                <select id="quoteReference" 
                                    class="w-full px-3 py-2 border border-green-200 rounded-lg text-sm focus:outline-none focus:border-green-400 focus:ring-2 focus:ring-green-100 bg-white">
                                    <option value="QT-2026-00124">QT-2026-00124 - ₹2,44,670</option>
                                    <option value="QT-2026-00123">QT-2026-00123 - ₹2,15,000</option>
                                </select>
                            </div>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" id="createProject" checked class="w-4 h-4 rounded border-green-300 text-green-600 focus:ring-green-500">
                                <span class="text-sm text-green-800">Create project for this customer</span>
                            </label>
                        </div>
                    </div>
                </div>
                
                <!-- Footer -->
                <div class="flex items-center justify-between gap-3 px-6 py-4 border-t border-gray-100 bg-gray-50 rounded-b-2xl">
                    <button onclick="closeStatusTransitionModal()" class="px-4 py-2 text-gray-500 hover:text-gray-900 hover:bg-gray-50 rounded-lg font-medium text-sm transition-colors">
                        Cancel
                    </button>
                    <button onclick="confirmStatusChange()" id="confirmBtn" class="px-6 py-2 bg-primary text-white rounded-lg font-medium text-sm hover:bg-primary-dark transition-colors flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                        </svg>
                        Update Status
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Status Progress Indicator Component -->
<div class="status-progress-indicator hidden">
    <div class="flex items-center justify-between p-4 bg-white rounded-lg border border-gray-100">
        <!-- Step 1 -->
        <div class="flex flex-col items-center">
            <div class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
            </div>
            <span class="text-xs font-medium text-primary mt-1">New Lead</span>
        </div>
        <div class="flex-1 h-0.5 bg-primary mx-2"></div>
        <!-- Step 2 -->
        <div class="flex flex-col items-center">
            <div class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
            </div>
            <span class="text-xs font-medium text-primary mt-1">Contacted</span>
        </div>
        <div class="flex-1 h-0.5 bg-primary mx-2"></div>
        <!-- Step 3 -->
        <div class="flex flex-col items-center">
            <div class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center font-bold text-sm">3</div>
            <span class="text-xs font-medium text-primary mt-1">Site Visit</span>
        </div>
        <div class="flex-1 h-0.5 bg-gray-200 mx-2"></div>
        <!-- Step 4 -->
        <div class="flex flex-col items-center">
            <div class="w-8 h-8 rounded-full bg-gray-200 text-gray-500 flex items-center justify-center font-bold text-sm">4</div>
            <span class="text-xs font-medium text-gray-500 mt-1">Quote Sent</span>
        </div>
        <div class="flex-1 h-0.5 bg-gray-200 mx-2"></div>
        <!-- Step 5 -->
        <div class="flex flex-col items-center">
            <div class="w-8 h-8 rounded-full bg-gray-200 text-gray-500 flex items-center justify-center font-bold text-sm">5</div>
            <span class="text-xs font-medium text-gray-500 mt-1">Converted</span>
        </div>
    </div>
</div>

<!-- Status Dropdown (inline version for detail pages) -->
<div class="status-dropdown-inline relative inline-block">
    <button onclick="toggleInlineStatus()" class="flex items-center gap-2 px-3 py-1.5 rounded-lg hover:bg-gray-50 transition-colors">
        <span id="inlineStatusBadge" class="px-2.5 py-1 text-xs font-semibold rounded-full bg-purple-100 text-purple-700">Site Visit Scheduled</span>
        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
    </button>
    <div id="inlineStatusDropdown" class="hidden absolute top-full left-0 mt-1 w-56 bg-white rounded-lg shadow-md border border-gray-100 py-2 z-20">
        <div class="px-3 py-2 text-xs font-medium text-gray-500 uppercase">Change Status</div>
        <button onclick="quickChangeStatus('new_lead')" class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 flex items-center gap-3">
            <span class="w-2.5 h-2.5 rounded-full bg-gray-400"></span>
            New Lead
        </button>
        <button onclick="quickChangeStatus('contacted')" class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 flex items-center gap-3">
            <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>
            Contacted
        </button>
        <button onclick="quickChangeStatus('qualified')" class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 flex items-center gap-3">
            <span class="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>
            Qualified
        </button>
        <button onclick="quickChangeStatus('site_visit_scheduled')" class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 flex items-center gap-3 bg-gray-50">
            <span class="w-2.5 h-2.5 rounded-full bg-purple-500"></span>
            Site Visit Scheduled
            <svg class="w-4 h-4 ml-auto text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
        </button>
        <button onclick="quickChangeStatus('site_visit_done')" class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 flex items-center gap-3">
            <span class="w-2.5 h-2.5 rounded-full bg-violet-500"></span>
            Site Visit Done
        </button>
        <button onclick="quickChangeStatus('quotation_sent')" class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 flex items-center gap-3">
            <span class="w-2.5 h-2.5 rounded-full bg-cyan-500"></span>
            Quotation Sent
        </button>
        <button onclick="quickChangeStatus('negotiation')" class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 flex items-center gap-3">
            <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
            Negotiation
        </button>
        <div class="border-t border-gray-100 my-1"></div>
        <button onclick="quickChangeStatus('converted')" class="w-full px-4 py-2 text-left text-sm hover:bg-green-50 text-green-700 flex items-center gap-3">
            <span class="w-2.5 h-2.5 rounded-full bg-green-500"></span>
            Converted
        </button>
        <button onclick="quickChangeStatus('lost')" class="w-full px-4 py-2 text-left text-sm hover:bg-red-50 text-red-600 flex items-center gap-3">
            <span class="w-2.5 h-2.5 rounded-full bg-red-500"></span>
            Lost
        </button>
    </div>
</div>

<script>
    const statusConfig = {
        new_lead: { label: 'New Lead', color: 'gray', bgClass: 'bg-gray-100', textClass: 'text-gray-700' },
        contacted: { label: 'Contacted', color: 'blue', bgClass: 'bg-blue-100', textClass: 'text-blue-700' },
        qualified: { label: 'Qualified', color: 'indigo', bgClass: 'bg-indigo-100', textClass: 'text-indigo-700' },
        site_visit_scheduled: { label: 'Site Visit Scheduled', color: 'purple', bgClass: 'bg-purple-100', textClass: 'text-purple-700' },
        site_visit_done: { label: 'Site Visit Done', color: 'violet', bgClass: 'bg-violet-100', textClass: 'text-violet-700' },
        quotation_sent: { label: 'Quotation Sent', color: 'cyan', bgClass: 'bg-cyan-100', textClass: 'text-cyan-700' },
        negotiation: { label: 'Negotiation', color: 'amber', bgClass: 'bg-amber-100', textClass: 'text-amber-700' },
        converted: { label: 'Converted', color: 'green', bgClass: 'bg-green-100', textClass: 'text-green-700' },
        lost: { label: 'Lost', color: 'red', bgClass: 'bg-red-100', textClass: 'text-red-700' }
    };
    
    let currentStatus = 'contacted';
    let selectedNewStatus = null;
    
    function openStatusTransitionModal(status) {
        currentStatus = status;
        const modal = document.getElementById('statusTransitionModal');
        
        // Update current status badge
        const currentConfig = statusConfig[status];
        const badge = document.getElementById('currentStatusBadge');
        badge.textContent = currentConfig.label;
        badge.className = `px-3 py-1 text-sm font-medium rounded-full ${currentConfig.bgClass} ${currentConfig.textClass}`;
        
        // Populate status options
        const optionsContainer = document.getElementById('statusOptions');
        optionsContainer.innerHTML = '';
        
        Object.entries(statusConfig).forEach(([key, config]) => {
            if (key !== status) {
                const option = document.createElement('label');
                option.className = 'flex items-center gap-3 p-3 rounded-lg border border-gray-100 cursor-pointer hover:border-gray-300 transition-all has-[:checked]:border-primary has-[:checked]:bg-primary/5';
                option.innerHTML = `
                    <input type="radio" name="newStatus" value="${key}" class="sr-only" onchange="onStatusSelect('${key}')">
                    <span class="w-3 h-3 rounded-full" style="background-color: var(--color-${config.color}-500, ${getColorHex(config.color)})"></span>
                    <span class="text-sm font-medium text-gray-900">${config.label}</span>
                    <svg class="w-5 h-5 ml-auto text-primary opacity-0 check-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                    </svg>
                `;
                optionsContainer.appendChild(option);
            }
        });
        
        // Hide special sections
        document.getElementById('reasonSection').classList.add('hidden');
        document.getElementById('convertedSection').classList.add('hidden');
        selectedNewStatus = null;
        
        modal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
    }
    
    function getColorHex(color) {
        const colors = {
            gray: '#9CA3AF',
            blue: '#3B82F6',
            indigo: '#6366F1',
            purple: '#8B5CF6',
            violet: '#7C3AED',
            cyan: '#06B6D4',
            amber: '#F59E0B',
            green: '#22C55E',
            red: '#EF4444'
        };
        return colors[color] || '#9CA3AF';
    }
    
    function onStatusSelect(status) {
        selectedNewStatus = status;
        
        // Update visual selection
        document.querySelectorAll('#statusOptions label').forEach(label => {
            const radio = label.querySelector('input');
            const checkIcon = label.querySelector('.check-icon');
            if (radio.value === status) {
                label.classList.add('border-primary', 'bg-primary/5');
                checkIcon.classList.remove('opacity-0');
            } else {
                label.classList.remove('border-primary', 'bg-primary/5');
                checkIcon.classList.add('opacity-0');
            }
        });
        
        // Show/hide special sections
        if (status === 'lost') {
            document.getElementById('reasonSection').classList.remove('hidden');
            document.getElementById('convertedSection').classList.add('hidden');
        } else if (status === 'converted') {
            document.getElementById('convertedSection').classList.remove('hidden');
            document.getElementById('reasonSection').classList.add('hidden');
        } else {
            document.getElementById('reasonSection').classList.add('hidden');
            document.getElementById('convertedSection').classList.add('hidden');
        }
    }
    
    function closeStatusTransitionModal() {
        document.getElementById('statusTransitionModal').classList.add('hidden');
        document.body.style.overflow = '';
    }
    
    function confirmStatusChange() {
        if (!selectedNewStatus) {
            alert('Please select a new status');
            return;
        }
        
        if (selectedNewStatus === 'lost') {
            const reason = document.getElementById('lostReason').value;
            if (!reason) {
                alert('Please select a reason for marking as lost');
                return;
            }
        }
        
        console.log(`Changing status from ${currentStatus} to ${selectedNewStatus}`);
        alert(`Status changed to "${statusConfig[selectedNewStatus].label}"`);
        closeStatusTransitionModal();
    }
    
    function toggleInlineStatus() {
        document.getElementById('inlineStatusDropdown').classList.toggle('hidden');
    }
    
    function quickChangeStatus(status) {
        if (status === 'lost' || status === 'converted') {
            // These require the full modal
            openStatusTransitionModal(currentStatus);
            setTimeout(() => onStatusSelect(status), 100);
        } else {
            console.log(`Quick changing status to ${status}`);
            alert(`Status changed to "${statusConfig[status].label}"`);
        }
        document.getElementById('inlineStatusDropdown').classList.add('hidden');
    }
    
    // Close dropdowns when clicking outside
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.status-dropdown-inline')) {
            document.getElementById('inlineStatusDropdown')?.classList.add('hidden');
        }
    });
    
    // Close modal on escape
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeStatusTransitionModal();
        }
    });
</script>

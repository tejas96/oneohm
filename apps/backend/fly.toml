# Fly.io configuration for OneOhm EPC Backend
# See https://fly.io/docs/reference/configuration/

app = 'oneohm-epc-backend'
primary_region = 'bom'  # Mumbai region
kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]
  dockerfile = 'Dockerfile'
  # IMPORTANT: This Dockerfile expects its build context to be apps/backend/
  # (so COPY dist/ . finds the pre-built pruned output).
  # Deploy using: cd apps/backend && flyctl deploy --config fly.toml
  # Do NOT run: flyctl deploy apps/backend --config apps/backend/fly.toml
  # (Fly changes build context to apps/backend and then cannot resolve that config path)
  # Also do NOT run: flyctl deploy --config apps/backend/fly.toml from the repo root
  # (that sets the build context to the repo root and dist/ won't be found)

# Non-sensitive environment variables
# Sensitive ones MUST be set via: fly secrets set KEY=value
[env]
  NODE_ENV = 'production'
  PORT = '8085'
  BACKEND_PORT = '8085'
  BACKEND_HOST = '0.0.0.0'
  BACKEND_API_PREFIX = '/api/v1'
  BASE_URL = 'https://oneohm-epc-backend.fly.dev'
  TZ = 'Asia/Kolkata'
  
  # Database (non-sensitive - host is internal)
  DATABASE_PORT = '5432'
  DATABASE_SSL = 'false'
  DATABASE_LOGGING = 'false'
  DATABASE_POOL_MIN = '5'
  DATABASE_POOL_MAX = '20'
  
  # Features
  ENABLE_SWAGGER = 'false'
  NODE_OPTIONS = '--max-old-space-size=384'
  ENABLE_CACHING = 'false'
  ENABLE_RATE_LIMITING = 'true'
  ENABLE_COMPRESSION = 'true'
  ENABLE_HELMET = 'true'
  
  # Logging
  LOG_LEVEL = 'info'
  LOG_FORMAT = 'json'
  
  # Rate Limiting
  THROTTLE_TTL = '60'
  THROTTLE_LIMIT = '100'
  RATE_LIMIT_TTL = '60'
  RATE_LIMIT_MAX = '1000'
  
  # CORS - Allow web app to call API
  CORS_ORIGIN = 'https://solaroneohm.in,https://www.solaroneohm.in,https://oneohm-epc-web.fly.dev,http://localhost:3001'
  
  # JWT Expiry (non-sensitive, can be in env)
  JWT_EXPIRES_IN = '15m'
  JWT_REFRESH_EXPIRES_IN = '7d'

# HTTP Service Configuration
[http_service]
  internal_port = 8085
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

  # Response headers for security
  [http_service.http_options]
    h2_backend = false

# VM Configuration
[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'

# Health Checks
[checks]
  [checks.health]
    port = 8085
    type = 'http'
    interval = '30s'
    timeout = '10s'
    grace_period = '60s'
    method = 'GET'
    path = '/api/v1'

# Deployment Configuration
[deploy]
  # Run migrations before starting new version (like Heroku release phase)
  release_command = 'node src/scripts/run-migrations.js'
  # Rolling deployment strategy
  strategy = 'rolling'

[processes]
  app = 'node src/main.js'

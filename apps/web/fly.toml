# Fly.io configuration for OneOhm EPC Web
app = 'oneohm-epc-web'
primary_region = 'bom'

[build]
  dockerfile = 'Dockerfile'
  [build.args]
    NEXT_PUBLIC_API_URL = 'https://oneohm-epc-backend.fly.dev/api/v1'
    NEXT_PUBLIC_APP_NAME = 'OneOhm EPC'

[env]
  NODE_ENV = 'production'
  PORT = '3001'
  TZ = 'Asia/Kolkata'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'

[checks]
  [checks.health]
    port = 3001
    type = 'http'
    interval = '30s'
    timeout = '10s'
    grace_period = '60s'
    method = 'GET'
    path = '/api/health'

[deploy]
  strategy = 'rolling'

kill_signal = 'SIGTERM'
kill_timeout = '30s'
